<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPcr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowP" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="920" height="620" fill="#f8fafc" rx="12" />

  <rect x="20" y="20" width="880" height="55" rx="8" fill="url(#gradPcr)" filter="url(#shadowP)" />
  <text x="460" y="44" fill="#ffffff" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">PARADA CARDIORRESPIRATÓRIA PEDIÁTRICA &amp; PALS (SBP / AHA 2024)</text>
  <text x="460" y="62" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Algoritmo de Ritmos Não-Chocáveis (Assistolia/AESP) vs Ritmos Chocáveis (FV/TVsp)</text>

  <!-- Reconhecimento -->
  <rect x="240" y="95" width="440" height="55" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadowP)" />
  <text x="460" y="117" fill="#b91c1c" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Criança Inconsciente, Apneica (ou Gaspeando) e sem Pulso</text>
  <text x="460" y="136" fill="#334155" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Iniciar RCP: 15 compressões : 2 ventilações (2 socorristas) | Conectar Monitor/DEA</text>

  <line x1="460" y1="150" x2="460" y2="180" stroke="#64748b" stroke-width="2" />
  <polygon points="455,178 465,178 460,185" fill="#64748b" />

  <!-- Decisão de Ritmo -->
  <polygon points="460,185 660,230 460,275 260,230" fill="#fef08a" stroke="#ca8a04" stroke-width="2" filter="url(#shadowP)" />
  <text x="460" y="224" fill="#854d0e" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">AVALIAÇÃO DO RITMO CARDÍACO</text>
  <text x="460" y="242" fill="#a16207" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">O ritmo é Chocável ou Não-Chocável?</text>

  <!-- Não Chocável (> 85% dos casos pediátricos) -->
  <line x1="260" y1="230" x2="160" y2="230" stroke="#475569" stroke-width="2" />
  <line x1="160" y1="230" x2="160" y2="300" stroke="#475569" stroke-width="2" />
  <polygon points="155,298 165,298 160,305" fill="#475569" />
  <text x="180" y="222" fill="#475569" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">NÃO-CHOCÁVEL (&gt; 85%)</text>

  <rect x="30" y="305" width="260" height="290" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadowP)" />
  <text x="160" y="330" fill="#0f172a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">ASSISTOLIA OU AESP</text>
  <text x="160" y="348" fill="#475569" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">(Ritmos de PCR Asfíxica / Hipóxia)</text>

  <rect x="45" y="365" width="230" height="215" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="160" y="388" fill="#dc2626" font-size="11.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">CONDUTA IMEDIATA:</text>
  <text x="55" y="410" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif">1. Reiniciar RCP 15:2 imediatamente</text>
  <text x="55" y="430" fill="#0369a1" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">2. ADRENALINA IV / IO PRECOCE:</text>
  <text x="55" y="446" fill="#b91c1c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">   0,01 mg/kg (0,1 mL/kg da 1:10.000)</text>
  <text x="55" y="462" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">   Repetir a cada 3 a 5 minutos</text>
  <text x="55" y="482" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif">3. Considerar Via Aérea Avançada:</text>
  <text x="55" y="498" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">   1 ventilação a cada 2-3s (20-30/min)</text>
  <text x="55" y="518" fill="#334155" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">4. Tratar Causas Reversíveis:</text>
  <text x="55" y="534" fill="#0369a1" font-size="9.5" font-family="system-ui, sans-serif">   6 H's e 5 T's (Hipóxia e Hipovolemia</text>
  <text x="55" y="548" fill="#0369a1" font-size="9.5" font-family="system-ui, sans-serif">   são as causas de &gt; 80% das PCRs)</text>
  <text x="55" y="568" fill="#15803d" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">Reavaliar ritmo a cada 2 minutos</text>

  <!-- Chocável (< 15%) -->
  <line x1="660" y1="230" x2="760" y2="230" stroke="#dc2626" stroke-width="2" />
  <line x1="760" y1="230" x2="760" y2="300" stroke="#dc2626" stroke-width="2" />
  <polygon points="755,298 765,298 760,305" fill="#dc2626" />
  <text x="670" y="222" fill="#dc2626" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">CHOCÁVEL (&lt; 15%)</text>

  <rect x="630" y="305" width="260" height="290" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowP)" />
  <text x="760" y="330" fill="#991b1b" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">FV OU TV SEM PULSO</text>
  <text x="760" y="348" fill="#b91c1c" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">(Ritmos Desfibriláveis)</text>

  <rect x="645" y="365" width="230" height="215" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
  <text x="760" y="388" fill="#dc2626" font-size="11.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">DESFIBRILAÇÃO IMEDIATA:</text>
  <text x="655" y="410" fill="#b91c1c" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">1º Choque: 2 J/kg $
ightarrow$ RCP 2 min</text>
  <text x="655" y="430" fill="#b91c1c" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">2º Choque: 4 J/kg $
ightarrow$ RCP 2 min</text>
  <text x="655" y="448" fill="#0369a1" font-size="10" font-family="system-ui, sans-serif">• Adrenalina 0,01 mg/kg após 2º choque</text>
  <text x="655" y="468" fill="#b91c1c" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">3º Choque: ≥ 4 J/kg (máx 10 J/kg)</text>
  <text x="655" y="488" fill="#15803d" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">• Amiodarona 5 mg/kg IV/IO</text>
  <text x="655" y="504" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">  (ou Lidocaína 1 mg/kg) pós 3º choque</text>
  <text x="655" y="524" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Repetir amiodarona até 3 doses</text>
  <text x="655" y="544" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Minimizar pausas nas compressões</text>
  <text x="760" y="568" fill="#991b1b" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Tratar 6 H's e 5 T's simultaneamente</text>

  <!-- Caixa Central: 6 H's e 5 T's -->
  <rect x="315" y="305" width="290" height="290" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadowP)" />
  <text x="460" y="330" fill="#0369a1" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">ETIOLOGIAS REVERSÍVEIS PALS</text>
  <text x="460" y="352" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">OS 6 H's:</text>
  <text x="330" y="372" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Hipovolemia (cristaloide IV/IO)</text>
  <text x="330" y="388" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Hipóxia (ventilar com O2 a 100%)</text>
  <text x="330" y="404" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Hidrogênio / Acidose (ventilação)</text>
  <text x="330" y="420" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Hipo/Hipercalemia (gluconato de Ca)</text>
  <text x="330" y="436" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Hipotermia (aquecimento ativo)</text>
  <text x="330" y="452" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Hipoglicemia (SG 10% 2-5 mL/kg)</text>

  <text x="460" y="478" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">OS 5 T's:</text>
  <text x="330" y="498" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Tensão / Pneumotórax (toracocentese)</text>
  <text x="330" y="514" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Tamponamento Cardíaco (pericardiocentese)</text>
  <text x="330" y="530" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Tóxicos / Intoxicações (antídotos)</text>
  <text x="330" y="546" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Trombose Pulmonar (TEP)</text>
  <text x="330" y="562" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Trombose Coronária</text>
  <text x="460" y="586" fill="#0284c7" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Tratado SBP / PALS 2024</text>
</svg>