<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">ABORDAGEM CLÍNICA DO PÓLIPO CERVICAL / ENDOCERVICAL</text>
  <text x="950" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 76 • Exame Especular e Conduta</text>

  <!-- Content -->
  
    <rect x="290" y="90" width="400" height="60" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
    <text x="490" y="115" font-size="14" font-weight="800" fill="#9d174d" text-anchor="middle">MASSA EM COLO UTERINO AO EXAME ESPECULAR</text>
    <text x="490" y="135" font-size="11" fill="#be185d" text-anchor="middle">Lesão exofítica avermelhada projetando-se pelo orifício externo</text>

    <!-- Passo 1: Diagnóstico Diferencial Imediato -->
    <path d="M 490 150 L 490 190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="140" y="190" width="700" height="75" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="490" y="213" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">DIAGNÓSTICO DIFERENCIAL NA INSPEÇÃO VISUAL E TOQUE</text>
    <text x="490" y="233" font-size="11" fill="#475569" text-anchor="middle">1. Pólipo Endocervical (mole, friável, pediculado, base no canal cervical)</text>
    <text x="490" y="251" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">2. Mioma Parido (firme, elástico, pedículo espesso) • 3. Pólipo Endometrial exteriorizado • 4. Câncer de Colo</text>

    <!-- Bifurcação Características -->
    <path d="M 320 265 L 230 310" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 660 265 L 750 310" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Caixa 1: Pólipo Endocervical Benigno Típico -->
    <rect x="50" y="320" width="410" height="320" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="255" y="348" font-size="13" font-weight="800" fill="#15803d" text-anchor="middle">PÓLIPO ENDOCERVICAL TÍPICO (BENIGNO)</text>
    <text x="70" y="375" font-size="11" font-weight="700" fill="#166534">• Características Macroscópicas:</text>
    <text x="80" y="395" font-size="10" fill="#334155">- Pequeno (&lt; 2 a 3 cm), liso, avermelhado ou violáceo</text>
    <text x="80" y="413" font-size="10" fill="#334155">- Pedículo fino inserido no canal endocervical</text>
    <text x="80" y="431" font-size="10" fill="#334155">- Colo subjacente epitelizado e sem ulceração suspeita</text>

    <text x="70" y="460" font-size="11" font-weight="700" fill="#15803d">• Conduta: Polipectomia Ambulatorial por Torção:</text>
    <text x="80" y="480" font-size="10" fill="#334155">1. Pinçamento do pedículo com pinça de Foerster, Cheron ou Kelly</text>
    <text x="80" y="498" font-size="10" fill="#334155">2. Rotação axial contínua sobre o próprio eixo até avulsão</text>
    <text x="80" y="516" font-size="10" fill="#334155">3. Hemostasia química (Monsel / nitrato de prata) ou compressão</text>
    <text x="80" y="534" font-size="10" font-weight="700" fill="#b91c1c">4. Envio obrigatório de 100% dos espécimes para anatomopatológico!</text>
    <text x="80" y="552" font-size="10" fill="#475569">(Malignidade rara &lt; 0,2-0,5%, mas confirmação histológica é lei)</text>

    <!-- Caixa 2: Casos Atípicos ou Complexos -->
    <rect x="520" y="320" width="410" height="320" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="725" y="348" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">LESÕES COMPLEXAS / ATÍPICAS</text>
    <text x="540" y="375" font-size="11" font-weight="700" fill="#991b1b">• Suspeita de Mioma Parido (FIGO 0):</text>
    <text x="550" y="395" font-size="10" fill="#334155">- Consistência endurecida, pedículo grosso (&gt; 1-2 cm)</text>
    <text x="550" y="413" font-size="10" fill="#334155">- NUNCA tentar torção ambulatorial simples (risco de hemorragia!)</text>
    <text x="550" y="431" font-size="10" font-weight="700" fill="#15803d">- Conduta: Miomectomia vaginal em centro cirúrgico com ligadura</text>

    <text x="540" y="460" font-size="11" font-weight="700" fill="#991b1b">• Suspeita de Pólipo Endometrial Exteriorizado:</text>
    <text x="550" y="480" font-size="10" fill="#334155">- Pedículo se estende para dentro da cavidade endometrial</text>
    <text x="550" y="498" font-size="10" font-weight="700" fill="#15803d">- Conduta: Avaliação histeroscópica cirúrgica em centro cirúrgico</text>

    <text x="540" y="525" font-size="11" font-weight="700" fill="#991b1b">• Lesão Friável, Vegetante ou Ulcerada (Suspeita de CEC):</text>
    <text x="550" y="545" font-size="10" fill="#334155">- Biópsia em cunha com pinça de Gaylor / colposcopia imediata</text>
    <text x="550" y="563" font-size="10" fill="#334155">- NÃO manipular ambulatoriamente sem suporte hemostático</text>
    

  <!-- Footer -->
  <line x1="30" y1="645" x2="950" y2="645" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="662" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • ACOG • FIGO • OMS (MEC 5ª Ed)</text>
  <text x="950" y="662" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>