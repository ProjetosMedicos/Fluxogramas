roke:revert;stroke-width:revert;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .dec&gt;*{fill:rgb(254, 243, 199)!important;stroke:rgb(217, 119, 6)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .dec span{fill:rgb(254, 243, 199)!important;stroke:rgb(217, 119, 6)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .dec tspan{fill:rgb(15, 23, 42)!important;}#mermaid-svg .norm&gt;*{fill:rgb(220, 252, 231)!important;stroke:rgb(22, 163, 74)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .norm span{fill:rgb(220, 252, 231)!important;stroke:rgb(22, 163, 74)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .norm tspan{fill:rgb(15, 23, 42)!important;}#mermaid-svg .mild&gt;*{fill:rgb(254, 249, 195)!important;stroke:rgb(202, 138, 4)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .mild span{fill:rgb(254, 249, 195)!important;stroke:rgb(202, 138, 4)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .mild tspan{fill:rgb(15, 23, 42)!important;}#mermaid-svg .sev&gt;*{fill:rgb(254, 226, 226)!important;stroke:rgb(220, 38, 38)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(153, 27, 27)!important;}#mermaid-svg .sev span{fill:rgb(254, 226, 226)!important;stroke:rgb(220, 38, 38)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(153, 27, 27)!important;}#mermaid-svg .sev tspan{fill:rgb(153, 27, 27)!important;}</style><g><marker id="mermaid-svg_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="mermaid-svg_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="mermaid-svg_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="mermaid-svg_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto"><polygon points="0,7 11.5,14 11.5,0" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasha