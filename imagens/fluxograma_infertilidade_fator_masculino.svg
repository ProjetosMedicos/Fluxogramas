="url(#mermaid-svg_flowchart-v2-pointEnd)"/><path d="M538.378,374.622L574.982,397.352C611.585,420.081,684.793,465.541,721.396,495.27C758,525,758,539,758,546L758,553" id="mermaid-svg-L_B_E_0" class=" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_B_E_0" data-points="W3sieCI6NTM4LjM3ODEwOTQ1MjczNjMsInkiOjM3NC42MjE4OTA1NDcyNjM2Nn0seyJ4Ijo3NTgsInkiOjUxMX0seyJ4Ijo3NTgsInkiOjU1N31d" data-look="classic" marker-end="url(#mermaid-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_A_B_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(138, 511)"><g class="label" data-id="L_B_C_0" transform="translate(-63.8203125, -10.5)"><foreignObject width="127.640625" height="21"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "><p>Normozoospermia</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(448, 511)"><g class="label" data-id="L_B_D_0" transform="translate(-95.84375, -10.5)"><foreignObject width="191.6875" height="21"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "><p>Alteração Leve a Moderada</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(758, 511)"><g class="label" data-id="L_B_E_0" transform="translate(-100, -21)"><foreignObject width="200" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Alteração Grave ou Azoospermia</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="mermaid-svg-flowchart-A-0" data-look="classic" transform="translate(448, 65)"><rect class="basic label-container" style="" x="-130" y="-57" width="260" height="114"/><g class="label" style="" transform="translate(-100, -42)"><rect/><foreignObject width="200" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">Avaliação do Espermograma (Critérios da OMS 2021 / 6ª Edição)</tspan></p></span></div></foreignObject></g></g><g class="node default dec " id="mermaid-svg-flowchart-B-1" data-look="classic" transform="translate(448, 318.5)"><polygon points="146.5,0 293,-146.5 146.5,-293 0,-146.5" class="label-container" transform="translate(-146, 146.5)" style="fill:#fef3c7 !important;stroke:#d97706 !important;stroke-width:2px !important"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -31.5)"><rect/><foreignObject width="200" height="63"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><tspan font-weight="bold">Resultado do Exame Seminal (Abstinência de 2 a 7 dias)</tspan></p></span></div></foreignObject></g></g><g class="node default norm " id="mermaid-svg-flowchart-C-3" data-look="classic" transform="translate(138, 761)"><rect class="basic label-container" style="fill:#dcfce7 !important;stroke:#16a34a !important;stroke-width:2px !important" x="-130" y="-109.5" width="260" height="219"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -94.5)"><rect/><foreignObject width="200" height="189"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><tspan font-weight="bold">Parâmetros Normais:</tspan><br />• Volume ≥ 1,4 mL | Concentração ≥ 16 mi/mL | Total ≥ 39 mi<br />• Motilidade progressiva ≥ 30% | Kruger ≥ 4% | Vitalidade ≥ 54%<br />• <i>Conduta:</i> Fator masculino afastado no momento</p></span></div></foreignObject></g></g><g class="node default mild " id="mermaid-svg-flowchart-D-5" data-look="classic" transform="translate(448, 761)"><rect class="basic label-container" style="fill:#fef9c3 !important;stroke:#ca8a04 !important;stroke-width:2px !important" x="-130" y="-193.5" width="260" height="387"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -178.5)"><rect/><foreignObject width="200" height="357"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><tspan font-weight="bold">Oligo / Asteno / Teratozoospermia Leve a Moderada:</tspan><br />• Concentração entre 5 e 15 milhões/mL ou motilidade entre 20% e 29%<br />• <tspan font-weight="bold">Conduta Mandatória:</tspan> Repetir espermograma após 2 a 3 meses<br />• Avaliação urológica (pesquisa de varicocele clínica e infecções)<br />• <i>Opção Terapêutica:</i> <tspan font-weight="bold">Inseminação Intrauterina (IIU)</tspan> se SMR pós-capacitação ≥ 5 milhões</p></span></div></foreignObject></g></g><g class="node default sev " id="mermaid-svg-flowchart-E-7" data-look="classic" transform="translate(758, 761)"><rect class="basic label-container" style="fill:#fee2e2 !important;stroke:#dc2626 !important;stroke-width:2px !important" x="-130" y="-204" width="260" height="408"/><g class="label" style="font-size:14px !important;color:#991b1b !important" transform="translate(-100, -189)"><rect/><foreignObject width="200" height="378"><div style="font-size: 14px !important; color: rgb(153, 27, 27) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#991b1b !important" class="nodeLabel "><p><tspan font-weight="bold">Fator Masculino Severo ou Azoospermia:</tspan><br />• <tspan font-weight="bold">OAT Grave (SMR &lt; 5 milhões):</tspan> Indicação direta de <tspan font-weight="bold">FIV com ICSI</tspan><br />• <tspan font-weight="bold">Azoospermia (Ausência total de espermatozoides):</tspan><br />- <i>Obstrutiva:</i> FSH normal e testículos normais → Punção de epidídimo (PESA/MESA)<br />- <i>Não-Obstrutiva:</i> FSH elevado → Biópsia testicular (TESE/Micro-TESE) + Cariótipo e Microdeleção do Cromossomo Y</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mermaid-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mermaid-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>