<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1020" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">CRITÉRIOS DE ELEGIBILIDADE MÉDICA DA OMS PARA CONTRACEPÇÃO</text>
  <text x="990" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 70 a 76 • Organização Mundial da Saúde (MEC OMS 5ª Ed.)</text>

  <!-- Content -->
  
    <rect x="290" y="90" width="440" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="510" y="115" font-size="14" font-weight="800" fill="#0369a1" text-anchor="middle">CRITÉRIOS MÉDICOS DE ELEGIBILIDADE (OMS)</text>
    <text x="510" y="135" font-size="11" fill="#0284c7" text-anchor="middle">Estratificação de Segurança: Categorias 1, 2, 3 e 4</text>

    <!-- Legenda 4 Categorias -->
    <rect x="40" y="165" width="220" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="150" y="190" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">CATEGORIA 1</text>
    <text x="150" y="210" font-size="10.5" fill="#166534" text-anchor="middle">Sem restrição de uso. Usar método.</text>

    <rect x="280" y="165" width="220" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="390" y="190" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">CATEGORIA 2</text>
    <text x="390" y="210" font-size="10.5" fill="#1e40af" text-anchor="middle">Vantagens superam riscos. Usar.</text>

    <rect x="520" y="165" width="220" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="630" y="190" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">CATEGORIA 3</text>
    <text x="630" y="210" font-size="10.5" fill="#92400e" text-anchor="middle">Riscos superam vantagens. Evitar.</text>

    <rect x="760" y="165" width="220" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="870" y="190" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">CATEGORIA 4</text>
    <text x="870" y="210" font-size="10.5" fill="#991b1b" text-anchor="middle">Risco inaceitável. NÃO USAR!</text>

    <!-- Caixa Central: Contraindicações Absolutas aos Combinados (Estrogênio) -->
    <rect x="40" y="245" width="940" height="230" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
    <text x="510" y="275" font-size="14" font-weight="800" fill="#9f1239" text-anchor="middle">CONTRAINDICAÇÕES ABSOLUTAS (CATEGORIA 4) AOS COMBINADOS COM ESTROGÊNIO (CHCs)</text>
    <text x="510" y="295" font-size="11" fill="#be123c" text-anchor="middle">(Pílulas Combinadas • Anel Vaginal • Adesivo Transdérmico • Injetável Mensal)</text>

    <!-- 3 colunas de contraindicações -->
    <text x="65" y="325" font-size="11.5" font-weight="700" fill="#9f1239">Cardiovascular &amp; Trombose:</text>
    <text x="75" y="345" font-size="10.5" fill="#334155">• Histórico pessoal de TVP / TEP ativo ou prévio</text>
    <text x="75" y="363" font-size="10.5" fill="#334155">• Trombofilia hereditária conhecida (Fator V, Protrombina)</text>
    <text x="75" y="381" font-size="10.5" fill="#334155">• Cardiopatia isquêmica ou AVC prévio</text>
    <text x="75" y="399" font-size="10.5" fill="#334155">• HAS Descontrolada (PAS ≥ 160 ou PAD ≥ 100 mmHg)</text>
    <text x="75" y="417" font-size="10.5" fill="#334155">• HAS com vasculopatia ou diabetes > 20 anos</text>

    <text x="390" y="325" font-size="11.5" font-weight="700" fill="#9f1239">Neurológico &amp; Estilo de Vida:</text>
    <text x="400" y="345" font-size="10.5" font-weight="700" fill="#dc2626">• Enxaqueca com Aura em qualquer idade (risco AVC)</text>
    <text x="400" y="363" font-size="10.5" font-weight="700" fill="#dc2626">• Tabagismo ≥ 35 anos com ≥ 15 cigarros/dia</text>
    <text x="400" y="381" font-size="10.5" fill="#64748b">(Tabagismo ≥ 35 anos &lt; 15 cig/dia: Categoria 3)</text>
    <text x="400" y="399" font-size="10.5" fill="#334155">• Cirurgia de grande porte com imobilização prolongada</text>
    <text x="400" y="417" font-size="10.5" fill="#334155">• Pós-parto imediato &lt; 21 dias (alto risco TEV)</text>

    <text x="710" y="325" font-size="11.5" font-weight="700" fill="#9f1239">Neoplasias &amp; Hepático/Autoimune:</text>
    <text x="720" y="345" font-size="10.5" fill="#334155">• Câncer de mama atual (hormônio-dependente)</text>
    <text x="720" y="363" font-size="10.5" fill="#334155">• Cirrose hepática descompensada grave</text>
    <text x="720" y="381" font-size="10.5" fill="#334155">• Adenoma ou carcinoma hepatocelular</text>
    <text x="720" y="399" font-size="10.5" fill="#334155">• Lúpus com Anticorpo Antifosfolípide (+)</text>
    <text x="720" y="417" font-size="10.5" fill="#334155">• Valvulopatia com fibrilação atrial / hipertensão pulmonar</text>

    <!-- Linha apontando para Alternativas -->
    <path d="M 510 475 L 510 500" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Caixa Inferior: Alternativas Seguras -->
    <rect x="40" y="500" width="940" height="135" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="510" y="525" font-size="13" font-weight="800" fill="#15803d" text-anchor="middle">MÉTODOS SEGUROS (CATEGORIA 1 E 2) DIANTE DE CONTRAINDICAÇÃO AO ESTROGÊNIO</text>

    <text x="70" y="555" font-size="11" font-weight="700" fill="#166534">1. Progestagênio Isolado Oral (POPs):</text>
    <text x="80" y="573" font-size="10.5" fill="#334155">Desogestrel 75 mcg/dia (janela de 12h) ou Drospirenona 4 mg (janela de 24h, neutro cardiovascular).</text>
    <text x="70" y="595" font-size="11" font-weight="700" fill="#166534">2. Métodos de Longa Duração (LARCs):</text>
    <text x="80" y="613" font-size="10.5" fill="#334155">DIU de Cobre / Prata (Não hormonal • Categoria 1 em quase todas as comorbidades) • DIU-LNG 52 mg • Implante Etonogestrel.</text>
    

  <!-- Footer -->
  <line x1="30" y1="645" x2="990" y2="645" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="662" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • ACOG • ESHRE • OMS</text>
  <text x="990" y="662" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>