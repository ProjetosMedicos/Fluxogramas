<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • UROGINECOLOGIA AVANÇADA</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">ITU RECORRENTE, FÍSTULAS GENITURINÁRIAS &amp; CISTITE INTERSTICIAL</text>
  <text x="970" y="45" fill="#cbd5e1" font-size="13" font-weight="500" text-anchor="end">Cap. 66, 67 e 69 FEBRASGO • IUGA / ICS</text>

  <!-- 3 Colunas Principais -->
  
  <!-- Coluna 1: ITU Recorrente -->
  <rect x="30" y="90" width="300" height="505" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="90" width="300" height="28" rx="8" fill="#0284c7"/>
  <text x="180" y="109" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1. ITU RECORRENTE (ITUR)</text>

  <text x="45" y="136" font-size="10" font-weight="800" fill="#0369a1">Definição Diagnóstica:</text>
  <text x="45" y="152" font-size="9" fill="#475569">• ≥ 2 episódios em 6 meses OU</text>
  <text x="45" y="166" font-size="9" fill="#475569">• ≥ 3 episódios em 12 meses</text>
  <text x="45" y="180" font-size="9" fill="#475569">Comprovação com urocultura (&gt; 10⁵ UFC/mL)</text>

  <text x="45" y="206" font-size="10" font-weight="800" fill="#0369a1">Fatores de Risco &amp; Pós-Menopausa:</text>
  <text x="45" y="222" font-size="9" fill="#475569">• Hipoestrogenismo = perda de lactobacilos</text>
  <text x="45" y="236" font-size="9" fill="#475569">  e elevação do pH vaginal com proliferação de</text>
  <text x="45" y="250" font-size="9" font-weight="700" fill="#0f172a">  enterobactérias uropatogênicas (E. coli)</text>
  <text x="45" y="264" font-size="9" fill="#475569">• Resíduo pós-miccional elevado (prolapso)</text>

  <text x="45" y="292" font-size="10" font-weight="800" fill="#0369a1">Profilaxia Não-Antimicrobiana (1ª Linha):</text>
  <text x="45" y="308" font-size="9" font-weight="700" fill="#0284c7">• Estrogênio Tópico Vaginal (Estriol/Promestrieno):</text>
  <text x="45" y="322" font-size="9" fill="#475569">  Restaura flora de Döderlein e acidifica a vagina</text>
  <text x="45" y="338" font-size="9" font-weight="700" fill="#0284c7">• D-Manose (2g/dia VO):</text>
  <text x="45" y="352" font-size="9" fill="#475569">  Inibe aderência das fímbrias FimH ao urotélio</text>
  <text x="45" y="368" font-size="9" font-weight="700" fill="#0284c7">• Imunoprofilaxia Oral (OM-89 / Uro-Vaxom):</text>
  <text x="45" y="382" font-size="9" fill="#475569">  Lisado bacteriano de E. coli por 3 meses</text>

  <text x="45" y="410" font-size="10" font-weight="800" fill="#0369a1">Profilaxia Antimicrobiana (Refratários):</text>
  <text x="45" y="426" font-size="9" fill="#475569">• Nitrofurantoína 50-100 mg/dia à noite OU</text>
  <text x="45" y="440" font-size="9" fill="#475569">• Fosfomicina 3g a cada 10 dias por 3 a 6 meses</text>
  <text x="45" y="454" font-size="9" fill="#475569">• Profilaxia pós-coital se associada ao coito</text>

  <!-- Coluna 2: Fístulas Urogenitais -->
  <rect x="350" y="90" width="300" height="505" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="350" y="90" width="300" height="28" rx="8" fill="#e11d48"/>
  <text x="500" y="109" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2. FÍSTULAS UROGENITAIS</text>

  <text x="365" y="136" font-size="10" font-weight="800" fill="#9f1239">Quadro Clínico Típico:</text>
  <text x="365" y="152" font-size="9" fill="#475569">• Perda contínua de urina pela vagina</text>
  <text x="365" y="166" font-size="9" fill="#475569">• Surgimento 7 a 14 dias após cirurgia pélvica</text>
  <text x="365" y="180" font-size="9" fill="#475569">  (histerectomia) ou parto obstruído isquêmico</text>

  <text x="365" y="206" font-size="10" font-weight="800" fill="#9f1239">Teste do Tampão com Azul de Metileno:</text>
  <text x="365" y="222" font-size="9" fill="#475569">Colocação de gaze estéril na vagina + instilação</text>
  <text x="365" y="236" font-size="9" fill="#475569">de 150-200 mL de azul de metileno na bexiga:</text>

  <rect x="360" y="250" width="280" height="85" rx="6" fill="#fecdd3"/>
  <text x="370" y="268" font-size="9" font-weight="800" fill="#9f1239">A. Gaze corada em AZUL:</text>
  <text x="370" y="282" font-size="9" font-weight="700" fill="#0f172a">→ FÍSTULA VESICOVAGINAL (FVV)</text>
  <text x="370" y="298" font-size="8" fill="#475569">Correção cirúrgica transvaginal (Técnica de Latzko)</text>
  <text x="370" y="312" font-size="8" fill="#475569">ou abdominal com retalho de omento / Martius</text>

  <rect x="360" y="345" width="280" height="85" rx="6" fill="#fef3c7"/>
  <text x="370" y="363" font-size="9" font-weight="800" fill="#b45309">B. Gaze ÚMIDA de urina CLARA / AMARELA:</text>
  <text x="370" y="377" font-size="9" font-weight="700" fill="#0f172a">→ FÍSTULA URETEROVAGINAL (FUV)</text>
  <text x="370" y="393" font-size="8" fill="#475569">Confirmação: Urotomografia com contraste</text>
  <text x="370" y="407" font-size="8" fill="#475569">Conduta: Reimplante ureteral (Ureteroneocistostomia)</text>

  <text x="365" y="450" font-size="9" font-weight="700" fill="#9f1239">Momento Cirúrgico Ideal:</text>
  <text x="365" y="466" font-size="9" fill="#475569">Imediato (se diagnosticado nas primeiras 48h) ou</text>
  <text x="365" y="480" font-size="9" fill="#475569">tardio após 8 a 12 semanas (resolução inflamatória)</text>

  <!-- Coluna 3: Cistite Intersticial -->
  <rect x="670" y="90" width="300" height="505" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="90" width="300" height="28" rx="8" fill="#8b5cf6"/>
  <text x="820" y="109" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3. CISTITE INTERSTICIAL (SBD)</text>

  <text x="685" y="136" font-size="10" font-weight="800" fill="#6d28d9">Quadro Clínico da Bexiga Dolorosa:</text>
  <text x="685" y="152" font-size="9" fill="#475569">• Dor, pressão ou desconforto suprapúbico</text>
  <text x="685" y="166" font-size="9" font-weight="700" fill="#0f172a">  relacionado à repleção vesical</text>
  <text x="685" y="180" font-size="9" font-weight="700" fill="#15803d">• Alívio imediato após a micção</text>
  <text x="685" y="194" font-size="9" fill="#475569">• Polaciúria severa (&gt; 15-20x/dia), noctúria</text>
  <text x="685" y="208" font-size="9" fill="#e11d48">• Uroculturas persistentemente NEGATIVAS</text>

  <text x="685" y="236" font-size="10" font-weight="800" fill="#6d28d9">Cistoscopia sob Hidrodistensão:</text>
  <text x="685" y="252" font-size="9" fill="#475569">• Glomerulações (petéquias submucosas)</text>
  <text x="685" y="266" font-size="9" font-weight="700" fill="#b91c1c">• Úlcera de Hunner clássica (10-15%):</text>
  <text x="685" y="280" font-size="9" fill="#475569">  Lesão mucosa eritematosa com cicatriz central</text>
  <text x="685" y="294" font-size="9" fill="#475569">  e sangramento em cascata à distensão</text>

  <text x="685" y="322" font-size="10" font-weight="800" fill="#6d28d9">Tratamento Multimodal:</text>
  <text x="685" y="338" font-size="9" font-weight="700" fill="#0f172a">• Farmacológico Oral:</text>
  <text x="685" y="352" font-size="9" fill="#475569">  Amitriptilina (10 a 50 mg/dia) à noite</text>
  <text x="685" y="366" font-size="9" fill="#475569">  Pentosana Polissulfato de Sódio (reparo glicocálix)</text>
  <text x="685" y="380" font-size="9" font-weight="700" fill="#0f172a">• Instilação Vesical:</text>
  <text x="685" y="394" font-size="9" fill="#475569">  Ácido Hialurônico + Heparina + Lidocaína</text>
  <text x="685" y="410" font-size="9" font-weight="700" fill="#0f172a">• Fisioterapia do Assoalho Pélvico:</text>
  <text x="685" y="424" font-size="9" fill="#475569">  Liberação de pontos-gatilho e relaxamento muscular</text>

  <!-- Rodapé -->
  <rect x="30" y="610" width="940" height="52" rx="8" fill="#0f172a" filter="url(#shadow)"/>
  <text x="500" y="630" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">DIRETRIZES CONJUNTAS IUGA / FEBRASGO</text>
  <text x="500" y="648" font-size="10" fill="#f8fafc" text-anchor="middle">A investigação da perda involuntária contínua de urina pós-cirúrgica exige diferenciação rápida entre fístula vesical e ureteral para salvaguarda da função renal</text>
</svg>