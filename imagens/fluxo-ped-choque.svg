<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradChoque" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="shadowCh" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="920" height="620" fill="#f8fafc" rx="12" />

  <rect x="20" y="20" width="880" height="55" rx="8" fill="url(#gradChoque)" filter="url(#shadowCh)" />
  <text x="460" y="44" fill="#ffffff" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">MANEJO DO CHOQUE PEDIÁTRICO NA PRIMEIRA HORA (PALS / SBP 2024)</text>
  <text x="460" y="62" fill="#fee2e2" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Reconhecimento Precoce, Acesso Intraósseo, Ressuscitação Volêmica &amp; Drogas Vasoativas</text>

  <!-- Nó Inicial -->
  <rect x="230" y="95" width="460" height="50" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2" filter="url(#shadowCh)" />
  <text x="460" y="116" fill="#0f172a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Criança com Sinais de Má Perfusão Tecidual / Toxemia</text>
  <text x="460" y="133" fill="#475569" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">Taquicardia desproporcional, TEC &gt; 2-3s, pulsos periféricos finos, oligúria, letargia</text>

  <line x1="460" y1="145" x2="460" y2="175" stroke="#64748b" stroke-width="2" />
  <polygon points="455,173 465,173 460,180" fill="#64748b" />

  <!-- Estágio: Compensado vs Hipotensivo -->
  <polygon points="460,180 660,225 460,270 260,225" fill="#fef08a" stroke="#ca8a04" stroke-width="2" filter="url(#shadowCh)" />
  <text x="460" y="218" fill="#854d0e" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Avaliação da Pressão Arterial Sistólica (PAS):</text>
  <text x="460" y="236" fill="#b91c1c" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Hipotensão Presente? (PAS &lt; 70 + 2xidade)</text>

  <!-- Ramo Esquerdo: Choque Compensado -->
  <line x1="260" y1="225" x2="160" y2="225" stroke="#ea580c" stroke-width="2" />
  <line x1="160" y1="225" x2="160" y2="290" stroke="#ea580c" stroke-width="2" />
  <polygon points="155,288 165,288 160,295" fill="#ea580c" />
  <text x="180" y="217" fill="#ea580c" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">NÃO (PAS Normal)</text>

  <rect x="30" y="295" width="260" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadowCh)" />
  <text x="160" y="318" fill="#c2410c" font-size="12.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">CHOQUE COMPENSADO</text>
  <text x="160" y="336" fill="#7c2d12" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Pressão mantida por vasoconstrição</text>
  <text x="160" y="352" fill="#7c2d12" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Taquicardia, TEC prolongado, pele fria</text>
  <text x="160" y="368" fill="#b91c1c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Janela de ouro para reversão imediata!</text>

  <!-- Ramo Direito: Choque Hipotensivo -->
  <line x1="660" y1="225" x2="760" y2="225" stroke="#dc2626" stroke-width="2" />
  <line x1="760" y1="225" x2="760" y2="290" stroke="#dc2626" stroke-width="2" />
  <polygon points="755,288 765,288 760,295" fill="#dc2626" />
  <text x="690" y="217" fill="#dc2626" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">SIM (Hipotenso)</text>

  <rect x="630" y="295" width="260" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowCh)" />
  <text x="760" y="318" fill="#991b1b" font-size="12.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">CHOQUE HIPOTENSIVO</text>
  <text x="760" y="336" fill="#b91c1c" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Sinal tardio de colapso circulatório!</text>
  <text x="760" y="352" fill="#b91c1c" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Hipotensão com acidose lática grave</text>
  <text x="760" y="368" fill="#dc2626" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Risco iminente de parada cardiorrespiratória</text>

  <!-- Convergência para Ações da Primeira Hora -->
  <line x1="160" y1="385" x2="160" y2="405" stroke="#64748b" stroke-width="2" />
  <line x1="760" y1="385" x2="760" y2="405" stroke="#64748b" stroke-width="2" />
  <line x1="160" y1="405" x2="760" y2="405" stroke="#64748b" stroke-width="2" />
  <line x1="460" y1="405" x2="460" y2="425" stroke="#64748b" stroke-width="2" />
  <polygon points="455,423 465,423 460,430" fill="#64748b" />

  <rect x="50" y="430" width="820" height="175" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadowCh)" />
  <text x="460" y="454" fill="#0369a1" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">PROTOCOLO DE RESSUSCITAÇÃO DA PRIMEIRA HORA (GOLDEN HOUR)</text>

  <rect x="70" y="468" width="240" height="125" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="190" y="488" fill="#1e40af" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">1. OXIGÊNIO &amp; ACESSO</text>
  <text x="80" y="508" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• O2 a 100% máscara c/ reservatório</text>
  <text x="80" y="526" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• 2 tentativas IV em 1 minuto</text>
  <text x="80" y="544" fill="#dc2626" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Se falha: ACESSO INTRAÓSSEO (IO)</text>
  <text x="80" y="560" fill="#dc2626" font-size="9.5" font-family="system-ui, sans-serif">  imediato na tíbia proximal!</text>
  <text x="80" y="578" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">• Colher glicemia, gaso, lactato, hemo</text>

  <rect x="340" y="468" width="240" height="125" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="460" y="488" fill="#1e40af" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">2. RESSUSCITAÇÃO VOLÊMICA</text>
  <text x="350" y="508" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Cristaloides isotônicos (RL ou SF):</text>
  <text x="350" y="526" fill="#0284c7" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">  10 a 20 mL/kg em bolus rápido</text>
  <text x="350" y="542" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">  (em 10 a 20 minutos; reavaliar)</text>
  <text x="350" y="560" fill="#78350f" font-size="9.5" font-family="system-ui, sans-serif">• Reavaliar: estertores ou fígado?</text>
  <text x="350" y="578" fill="#b91c1c" font-size="9.5" font-family="system-ui, sans-serif">  Cuidado em choque cardiogênico!</text>

  <rect x="610" y="468" width="240" height="125" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="730" y="488" fill="#1e40af" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">3. DROGAS VASOATIVAS PRECOCES</text>
  <text x="620" y="508" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Se choque refratário a 40-60 mL/kg:</text>
  <text x="620" y="526" fill="#b91c1c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Choque Frio (TEC&gt;3s, pulso fino):</text>
  <text x="620" y="542" fill="#0369a1" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  Adrenalina 0,05 a 0,3 mcg/kg/min</text>
  <text x="620" y="560" fill="#b91c1c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Choque Quente (vasodilatado, PA baixa):</text>
  <text x="620" y="576" fill="#0369a1" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  Noradrenalina 0,05 a 0,5 mcg/kg/min</text>
</svg>