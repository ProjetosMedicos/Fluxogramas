<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; line-height: 1.3; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">SISTEMA DE PONTUAÇÃO PARA TUBERCULOSE INFANTIL</text>
  <text x="50" y="78" class="subtitle">Escore Diagnóstico MS / SBP 2024 para Crianças Paucibacilares</text>
  <rect x="750" y="42" width="200" height="28" rx="6" fill="#0284c7" />
  <text x="850" y="60" text-anchor="middle" class="badge-text">SBP 2024 • PNEUMO & INFECTO</text>


  <g class="card-shadow">
    <rect x="250" y="115" width="500" height="60" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="500" y="138" text-anchor="middle" class="node-bold">SISTEMA DE PONTUAÇÃO PARA TB NA INFÂNCIA (MS / SBP 2024)</text>
    <text x="500" y="158" text-anchor="middle" class="node-text">Diagnóstico em crianças e adolescentes com escarro negativo ou ausente (paucibacilares)</text>
  </g>

  <path d="M 500 175 L 500 230" class="edge" />

  <g class="card-shadow">
    <rect x="100" y="230" width="800" height="150" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <text x="500" y="252" text-anchor="middle" class="node-bold" fill="#0f172a">OS 5 CRITÉRIOS DO ESCORE DE PONTUAÇÃO (SBP 2024)</text>
    <text x="120" y="275" class="node-text">• <tspan class="node-bold">Quadro Clínico:</tspan> Febre, tosse, perda ponderal, sudorese noturna &gt; 2-3 sem (+15 pts) | Assintomático (0 pt) | Condição aguda (-10 pts)</text>
    <text x="120" y="295" class="node-text">• <tspan class="node-bold">Raio-X de Tórax:</tspan> Adenomegalia hilar, condensação &gt; 2 sem, padrão miliar, cavitação (+15 pts) | Normal (-5 pts)</text>
    <text x="120" y="315" class="node-text">• <tspan class="node-bold">Contato com TB:</tspan> Contato íntimo com adulto bacilífero nos últimos 2 anos (+10 pts) | Sem contato (0 pt)</text>
    <text x="120" y="335" class="node-text">• <tspan class="node-bold">Teste Tuberculínico (PPD) / IGRA:</tspan> PPD ≥ 10 mm (ou ≥ 5 mm se imunodeprimido/BCG &gt; 2 anos) (+15 pts) | Reator fraco (+5) | Não reator (0 pt)</text>
    <text x="120" y="355" class="node-text">• <tspan class="node-bold">Estado Nutricional:</tspan> Desnutrição grave / Escore Z &lt; -3 (+5 pts) | Eutrófico (0 pt)</text>
    <text x="500" y="372" text-anchor="middle" class="node-bold" fill="#0284c7">SOMA TOTAL DOS PONTOS</text>
  </g>

  <path d="M 250 380 L 180 435" class="edge" />
  <path d="M 500 380 L 500 435" class="edge" />
  <path d="M 750 380 L 820 435" class="edge" />

  <g class="card-shadow">
    <rect x="40" y="435" width="280" height="110" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="180" y="458" text-anchor="middle" class="node-bold" fill="#b91c1c">ESCORE ≥ 40 PONTOS</text>
    <text x="180" y="478" text-anchor="middle" class="node-bold" fill="#dc2626">TB MUITO PROVÁVEL</text>
    <text x="180" y="500" text-anchor="middle" class="node-text">• Iniciar Tratamento Imediatamente!</text>
    <text x="180" y="518" text-anchor="middle" class="node-text">• Não aguardar confirmação bacteriológica</text>
    <text x="180" y="534" text-anchor="middle" class="node-text">• Notificação compulsória no SINAN</text>
  </g>

  <g class="card-shadow">
    <rect x="360" y="435" width="280" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="500" y="458" text-anchor="middle" class="node-bold" fill="#b45309">ESCORE 30 A 35 PONTOS</text>
    <text x="500" y="478" text-anchor="middle" class="node-bold" fill="#d97706">TB POSSÍVEL</text>
    <text x="500" y="500" text-anchor="middle" class="node-text">• Aprofundar investigação diagnóstica</text>
    <text x="500" y="518" text-anchor="middle" class="node-text">• Lavado gástrico para TRM-TB e cultura</text>
    <text x="500" y="534" text-anchor="middle" class="node-text">• Tratar se piora clínica ou radiológica</text>
  </g>

  <g class="card-shadow">
    <rect x="680" y="435" width="280" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="820" y="458" text-anchor="middle" class="node-bold" fill="#15803d">ESCORE ≤ 25 PONTOS</text>
    <text x="820" y="478" text-anchor="middle" class="node-bold" fill="#16a34a">TB IMPROVÁVEL</text>
    <text x="820" y="500" text-anchor="middle" class="node-text">• Investigar diagnósticos alternativos</text>
    <text x="820" y="518" text-anchor="middle" class="node-text">• Asma, BVA, fibrose cística, aspiração de CE</text>
    <text x="820" y="534" text-anchor="middle" class="node-text">• Reavaliar clinicamente se sintomas persistirem</text>
  </g>

  <path d="M 180 545 L 300 585" class="edge" />
  <path d="M 500 545 L 500 585" class="edge" />

  <g class="card-shadow">
    <rect x="120" y="585" width="760" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="500" y="608" text-anchor="middle" class="node-bold" fill="#15803d">ESQUEMA TERAPÊUTICO PADRÃO PEDIÁTRICO (SBP / MS)</text>
    <text x="500" y="630" text-anchor="middle" class="node-text">• Crianças &lt; 10 anos: ESQUEMA RHZ por 6 meses (2 meses de Rifampicina + Isoniazida + Pirazinamida / 4 meses de RH)</text>
    <text x="500" y="648" text-anchor="middle" class="node-text">• Crianças ≥ 10 anos / Adolescentes: ESQUEMA RHZE (associa Etambutol na fase de ataque: 2 RHZE / 4 RH)</text>
    <text x="500" y="664" text-anchor="middle" class="node-text">• Meningite Tuberculosa: Esquema prolongado por 12 meses + Corticoterapia (Prednisolona 1-2 mg/kg) nas primeiras 4 a 8 semanas</text>
  </g>


  <!-- Footer Notice -->
  <rect x="30" y="700" width="940" height="35" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="722" text-anchor="middle" class="subtitle" style="font-size: 11px;">Diretriz Oficial: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>