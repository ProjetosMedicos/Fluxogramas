<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="940" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">INVESTIGAÇÃO DO SANGRAMENTO NA PÓS-MENOPAUSA (SUPM)</text>
  <text x="910" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">Tratado FEBRASGO Cap. 80 • FIGO 2023</text>

  <!-- Content -->
  
    <rect x="270" y="95" width="400" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="120" font-size="15" font-weight="800" fill="#991b1b" text-anchor="middle">SANGRAMENTO UTERINO NA PÓS-MENOPAUSA</text>
    <text x="470" y="140" font-size="12" fill="#b91c1c" text-anchor="middle">Sinal de Alerta Vermelho: Investigação Mandatória de Carcinoma</text>

    <path d="M 470 155 L 470 195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- USG TV -->
    <rect x="295" y="195" width="350" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="220" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">ULTRASSONOGRAFIA TRANSVAGINAL (USG TV)</text>
    <text x="470" y="240" font-size="12" fill="#1d4ed8" text-anchor="middle">Mensuração rigorosa da espessura endometrial em corte sagital</text>

    <!-- Decisao Pontos de Corte -->
    <path d="M 470 255 L 470 295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <polygon points="470,295 680,355 470,415 260,355" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="345" font-size="13" font-weight="800" fill="#78350f" text-anchor="middle">ESPESSURA ENDOMETRIAL ACIMA DO PONTO DE CORTE?</text>
    <text x="470" y="365" font-size="11" fill="#92400e" text-anchor="middle">Sem TRH: &gt; 4 mm  |  Com TRH contínua: &gt; 5 mm</text>

    <!-- Ramo NAO: Fino -->
    <path d="M 260 355 L 140 355 L 140 450" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="175" y="345" font-size="13" font-weight="800" fill="#16a34a">NÃO (&#8804; 4 mm)</text>

    <rect x="30" y="455" width="220" height="140" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="480" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">ATROFIA ENDOMETRIAL</text>
    <text x="45" y="505" font-size="11" fill="#15803d">• Causa mais comum de SUPM (60-80%)</text>
    <text x="45" y="525" font-size="11" fill="#15803d">• Fragilidade vascular e afinamento</text>
    <text x="45" y="550" font-size="12" font-weight="700" fill="#14532d">Conduta: Expectante /</text>
    <text x="45" y="570" font-size="12" fill="#14532d">Hidratante vaginal se SGM</text>

    <!-- Ramo SIM: Espessado -->
    <path d="M 680 355 L 800 355 L 800 450" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="700" y="345" font-size="13" font-weight="800" fill="#dc2626">SIM (&gt; 4 mm)</text>

    <rect x="690" y="455" width="220" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="800" y="480" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">BIÓPSIA ENDOMETRIAL</text>
    <text x="705" y="505" font-size="11" fill="#b91c1c">• <tspan font-weight="bold">1ª Opção Ambulatorial:</tspan></text>
    <text x="715" y="523" font-size="11" fill="#991b1b">Aspiração com Cânula de Pipelle</text>
    <text x="705" y="545" font-size="11" fill="#b91c1c">• <tspan font-weight="bold">Histeroscopia + Biópsia:</tspan></text>
    <text x="715" y="563" font-size="11" fill="#991b1b">Se Pipelle insuficiente, estenose</text>
    <text x="715" y="580" font-size="11" fill="#991b1b">cervical ou espessamento focal</text>
    

  <!-- Footer -->
  <line x1="30" y1="615" x2="910" y2="615" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="632" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • FIGO • IOTA • OMS</text>
  <text x="910" y="632" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>