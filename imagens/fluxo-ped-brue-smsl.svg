<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBrue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="shadowB" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="920" height="620" fill="#f8fafc" rx="12" />

  <rect x="20" y="20" width="880" height="55" rx="8" fill="url(#gradBrue)" filter="url(#shadowB)" />
  <text x="460" y="44" fill="#ffffff" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">BRUE (EVENTOS BREVES INEXPLICADOS) &amp; SONO SEGURO / SMSL (SBP 2024)</text>
  <text x="460" y="62" fill="#e0e7ff" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Estratificação de Baixo vs Alto Risco, Exames Racionais &amp; Prevenção da Morte Súbita</text>

  <!-- Nó Inicial -->
  <rect x="230" y="95" width="460" height="50" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadowB)" />
  <text x="460" y="116" fill="#0f172a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Lactente &lt; 1 ano com Episódio Súbito, Breve (&lt; 1 min) e Resolvido</text>
  <text x="460" y="133" fill="#475569" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">Cianose/palidez, alteração respiratória, tônus alterado e/ou resposta diminuída</text>

  <line x1="460" y1="145" x2="460" y2="175" stroke="#64748b" stroke-width="2" />
  <polygon points="455,173 465,173 460,180" fill="#64748b" />

  <!-- Triagem: Causa Óbvia? -->
  <polygon points="460,180 650,225 460,270 270,225" fill="#fef08a" stroke="#ca8a04" stroke-width="2" filter="url(#shadowB)" />
  <text x="460" y="219" fill="#854d0e" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Há Causa Evidente na História ou Exame Físico?</text>
  <text x="460" y="235" fill="#a16207" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">Febre, engasgo c/ leite, trauma, convulsão ativa, sopro, desconforto respiratório</text>

  <!-- Sim: Não é BRUE -->
  <line x1="650" y1="225" x2="770" y2="225" stroke="#dc2626" stroke-width="2" />
  <line x1="770" y1="225" x2="770" y2="295" stroke="#dc2626" stroke-width="2" />
  <polygon points="765,293 775,293 770,300" fill="#dc2626" />
  <text x="705" y="217" fill="#dc2626" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">SIM</text>

  <rect x="650" y="300" width="240" height="290" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadowB)" />
  <text x="770" y="325" fill="#991b1b" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">NÃO É BRUE!</text>
  <text x="770" y="348" fill="#b91c1c" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Evento Explicado</text>
  <text x="770" y="375" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">• Engasgo por RGE / Mamada</text>
  <text x="770" y="395" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">• Crise epiléptica / convulsão</text>
  <text x="770" y="415" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">• Infecção grave / Sepse / Meningite</text>
  <text x="770" y="435" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">• Trauma cranioencefálico / Abuso</text>
  <text x="770" y="455" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">• Cardiopatia congênita / Arritmia</text>
  <text x="770" y="475" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">• Erros Inatos do Metabolismo</text>
  <text x="770" y="515" fill="#991b1b" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Tratar a Doença de Base</text>
  <text x="770" y="535" fill="#991b1b" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">Internação e Propedêutica Específica</text>

  <!-- Não: É BRUE -> Estratificar Risco -->
  <line x1="270" y1="225" x2="160" y2="225" stroke="#16a34a" stroke-width="2" />
  <line x1="160" y1="225" x2="160" y2="295" stroke="#16a34a" stroke-width="2" />
  <polygon points="155,293 165,293 160,300" fill="#16a34a" />
  <text x="180" y="217" fill="#16a34a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">NÃO (É BRUE)</text>

  <rect x="30" y="300" width="260" height="135" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadowB)" />
  <text x="160" y="324" fill="#166534" font-size="12.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">BRUE DE BAIXO RISCO</text>
  <text x="160" y="342" fill="#15803d" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Preenche TODOS os critérios:</text>
  <text x="45" y="360" fill="#14532d" font-size="9.5" font-family="system-ui, sans-serif">✓ Idade &gt; 60 dias de vida</text>
  <text x="45" y="375" fill="#14532d" font-size="9.5" font-family="system-ui, sans-serif">✓ Prematuro: IG ≥ 32 sem e IPC ≥ 45 sem</text>
  <text x="45" y="390" fill="#14532d" font-size="9.5" font-family="system-ui, sans-serif">✓ Duração &lt; 1 min e apenas 1º evento</text>
  <text x="45" y="405" fill="#14532d" font-size="9.5" font-family="system-ui, sans-serif">✓ Sem necessidade de RCP por profissional</text>
  <text x="45" y="420" fill="#14532d" font-size="9.5" font-family="system-ui, sans-serif">✓ Exame físico rigorosamente normal</text>

  <line x1="160" y1="435" x2="160" y2="455" stroke="#16a34a" stroke-width="2" />
  <polygon points="155,453 165,453 160,460" fill="#16a34a" />

  <rect x="30" y="460" width="260" height="130" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadowB)" />
  <text x="160" y="482" fill="#166534" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">CONDUTA DE BAIXO RISCO</text>
  <text x="160" y="502" fill="#334155" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Oximetria contínua por 1 a 4 horas</text>
  <text x="160" y="518" fill="#0369a1" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">• ECG de 12 derivações (QT longo)</text>
  <text x="160" y="534" fill="#dc2626" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">NÃO solicitar hemograma / Rx / TC / EEG</text>
  <text x="160" y="550" fill="#15803d" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Alta com orientações aos pais</text>
  <text x="160" y="568" fill="#4338ca" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Treinamento em Suporte Básico (BLS)</text>

  <!-- Caixa Central: Sono Seguro (Prevenção de SMSL) -->
  <rect x="315" y="300" width="310" height="290" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" filter="url(#shadowB)" />
  <text x="470" y="324" fill="#3730a3" font-size="12.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">SONO SEGURO &amp; PREVENÇÃO DE SMSL</text>
  <text x="470" y="342" fill="#4f46e5" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">(Diretrizes Oficiais SBP / AAP 2024)</text>

  <text x="330" y="368" fill="#b91c1c" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">• 1. POSIÇÃO SUPINA MANDATÓRIA:</text>
  <text x="330" y="386" fill="#334155" font-size="10" font-family="system-ui, sans-serif">  Dormir de barriga para cima em TODAS as sonecas.</text>
  <text x="330" y="402" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">  (Reduz o risco de SMSL em mais de 70%!)</text>

  <text x="330" y="426" fill="#0369a1" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">• 2. SUPERFÍCIE DE SONO FIRME:</text>
  <text x="330" y="444" fill="#334155" font-size="10" font-family="system-ui, sans-serif">  Colchão firme com lençol bem preso.</text>
  <text x="330" y="460" fill="#dc2626" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  SEM travesseiros, cobertores soltos ou bichos.</text>

  <text x="330" y="484" fill="#0369a1" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">• 3. QUARTO COMPARTILHADO SEM CAMA:</text>
  <text x="330" y="502" fill="#334155" font-size="10" font-family="system-ui, sans-serif">  Berço ao lado da cama dos pais até 6-12 meses.</text>
  <text x="330" y="518" fill="#dc2626" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  CAMA COMPARTILHADA É CONTRAINDICADA!</text>

  <text x="330" y="542" fill="#15803d" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">• 4. Aleitamento materno &amp; Chupeta no sono</text>
  <text x="330" y="558" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">• 5. Ambiente livre de fumo e evitar superaquecimento</text>
  <text x="470" y="580" fill="#4f46e5" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Tratado de Pediatria SBP 6ª Ed. (2024)</text>
</svg>