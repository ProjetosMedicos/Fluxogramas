<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradDiarreia" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="shadowD" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="920" height="620" fill="#f8fafc" rx="12" />

  <rect x="20" y="20" width="880" height="55" rx="8" fill="url(#gradDiarreia)" filter="url(#shadowD)" />
  <text x="460" y="44" fill="#ffffff" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">MANEJO DA DOENÇA DIARREICA AGUDA &amp; TERAPIA DE REIDRATAÇÃO (SBP 2024)</text>
  <text x="460" y="62" fill="#cffafe" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Estratificação de Desidratação: Planos A, B e C da OMS &amp; Suplementação de Zinco</text>

  <!-- Nó Inicial -->
  <rect x="250" y="95" width="420" height="48" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadowD)" />
  <text x="460" y="116" fill="#0f172a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Criança com Diarreia Aguda (&lt; 14 dias de duração)</text>
  <text x="460" y="132" fill="#475569" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Avaliação clínica: estado geral, olhos, lágrimas, sede e sinal da prega</text>

  <line x1="460" y1="143" x2="460" y2="175" stroke="#64748b" stroke-width="2" />
  <polygon points="455,173 465,173 460,180" fill="#64748b" />

  <!-- 3 Ramos: Planos A, B e C -->
  <!-- Plano A -->
  <line x1="460" y1="180" x2="160" y2="180" stroke="#16a34a" stroke-width="2" />
  <line x1="160" y1="180" x2="160" y2="215" stroke="#16a34a" stroke-width="2" />
  <polygon points="155,213 165,213 160,220" fill="#16a34a" />

  <rect x="30" y="220" width="260" height="370" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadowD)" />
  <rect x="45" y="235" width="230" height="30" rx="4" fill="#16a34a" />
  <text x="160" y="255" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">PLANO A: SEM DESIDRATAÇÃO</text>
  <text x="160" y="284" fill="#166534" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Tratamento Domiciliar</text>
  <text x="45" y="306" fill="#15803d" font-size="10" font-family="system-ui, sans-serif">✓ Estado geral ativo, alerta</text>
  <text x="45" y="324" fill="#15803d" font-size="10" font-family="system-ui, sans-serif">✓ Olhos normais, com lágrimas</text>
  <text x="45" y="342" fill="#15803d" font-size="10" font-family="system-ui, sans-serif">✓ Boca úmida, bebe normalmente</text>
  <text x="45" y="360" fill="#15803d" font-size="10" font-family="system-ui, sans-serif">✓ Sinal da prega desaparece rápido</text>

  <rect x="45" y="375" width="230" height="195" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
  <text x="160" y="394" fill="#166534" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">4 REGRAS DO PLANO A:</text>
  <text x="52" y="414" fill="#334155" font-size="10" font-family="system-ui, sans-serif">1. Aumentar ingestão hídrica / SRO:</text>
  <text x="52" y="428" fill="#0369a1" font-size="9.5" font-family="system-ui, sans-serif">   • &lt; 1 ano: 50 a 100 mL pós-perda</text>
  <text x="52" y="442" fill="#0369a1" font-size="9.5" font-family="system-ui, sans-serif">   • ≥ 1 ano: 100 a 200 mL pós-perda</text>
  <text x="52" y="460" fill="#334155" font-size="10" font-family="system-ui, sans-serif">2. Manter dieta habitual e leite</text>
  <text x="52" y="480" fill="#334155" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">3. Suplementação de Zinco (10-14d):</text>
  <text x="52" y="496" fill="#0f766e" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">   • &lt; 6m: 10 mg/d | ≥ 6m: 20 mg/d</text>
  <text x="52" y="518" fill="#334155" font-size="10" font-family="system-ui, sans-serif">4. Orientar sinais de perigo / alarme:</text>
  <text x="52" y="534" fill="#dc2626" font-size="9.5" font-family="system-ui, sans-serif">   Piora, vômitos, sangue nas fezes</text>
  <text x="52" y="552" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">Evitar antidiarreicos / loperamida</text>

  <!-- Plano B -->
  <line x1="460" y1="180" x2="460" y2="215" stroke="#eab308" stroke-width="2" />
  <polygon points="455,213 465,213 460,220" fill="#eab308" />

  <rect x="330" y="220" width="260" height="370" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2" filter="url(#shadowD)" />
  <rect x="345" y="235" width="230" height="30" rx="4" fill="#ca8a04" />
  <text x="460" y="255" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">PLANO B: DESIDRATAÇÃO CLÍNICA</text>
  <text x="460" y="284" fill="#854d0e" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Terapia de Reidratação Oral (TRO)</text>
  <text x="345" y="306" fill="#a16207" font-size="10" font-family="system-ui, sans-serif">✓ Inquieto, irritável</text>
  <text x="345" y="324" fill="#a16207" font-size="10" font-family="system-ui, sans-serif">✓ Olhos fundos, sem lágrimas</text>
  <text x="345" y="342" fill="#a16207" font-size="10" font-family="system-ui, sans-serif">✓ Boca seca, bebe avidamente (sede)</text>
  <text x="345" y="360" fill="#a16207" font-size="10" font-family="system-ui, sans-serif">✓ Sinal da prega desaparece lento (&lt; 2s)</text>

  <rect x="345" y="375" width="230" height="195" rx="6" fill="#ffffff" stroke="#fde047" stroke-width="1.5" />
  <text x="460" y="394" fill="#854d0e" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">CONDUTA NA UNIDADE DE SAÚDE:</text>
  <text x="352" y="414" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Solução de SRO na unidade de saúde:</text>
  <text x="352" y="430" fill="#b45309" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">  50 a 100 mL/kg em 4 a 6 horas</text>
  <text x="352" y="448" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Administrar em colher/copinho</text>
  <text x="352" y="466" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Pausar sólidos, manter leite materno</text>
  <text x="352" y="484" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• Se vômitos: esperar 10 min e reiniciar</text>
  <text x="352" y="504" fill="#7c2d12" font-size="10" font-family="system-ui, sans-serif">• Se vômitos incoercíveis ou recusa:</text>
  <text x="352" y="518" fill="#dc2626" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  Gastróclise por SNG (20-30 mL/kg/h)</text>
  <text x="352" y="538" fill="#15803d" font-size="10" font-family="system-ui, sans-serif">• Reavaliar a cada hora: hidratou?</text>
  <text x="352" y="552" fill="#166534" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  Sim $
ightarrow$ Plano A com Zinco | Não $
ightarrow$ Plano C</text>

  <!-- Plano C -->
  <line x1="460" y1="180" x2="760" y2="180" stroke="#dc2626" stroke-width="2" />
  <line x1="760" y1="180" x2="760" y2="215" stroke="#dc2626" stroke-width="2" />
  <polygon points="755,213 765,213 760,220" fill="#dc2626" />

  <rect x="630" y="220" width="260" height="370" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowD)" />
  <rect x="645" y="235" width="230" height="30" rx="4" fill="#dc2626" />
  <text x="760" y="255" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">PLANO C: DESIDRATAÇÃO GRAVE</text>
  <text x="760" y="284" fill="#991b1b" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Reidratação Parenteral / Choque</text>
  <text x="645" y="306" fill="#b91c1c" font-size="10" font-family="system-ui, sans-serif">✓ Letárgico, torporoso ou comatoso</text>
  <text x="645" y="324" fill="#b91c1c" font-size="10" font-family="system-ui, sans-serif">✓ Olhos muito fundos, sem lágrimas</text>
  <text x="645" y="342" fill="#b91c1c" font-size="10" font-family="system-ui, sans-serif">✓ Não consegue beber (incapaz)</text>
  <text x="645" y="360" fill="#b91c1c" font-size="10" font-family="system-ui, sans-serif">✓ Sinal da prega muito lento (&gt; 2s)</text>

  <rect x="645" y="375" width="230" height="195" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
  <text x="760" y="394" fill="#991b1b" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">FASE RÁPIDA DE EXPANSÃO IV:</text>
  <text x="652" y="414" fill="#334155" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Ringer Lactato ou SF 0,9% 100 mL/kg:</text>
  <text x="652" y="432" fill="#0369a1" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  Idade &lt; 1 ano (Total 6 horas):</text>
  <text x="652" y="446" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">   • 30 mL/kg em 30 minutos</text>
  <text x="652" y="460" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">   • 70 mL/kg em 5 horas e meia</text>
  <text x="652" y="478" fill="#0369a1" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  Idade ≥ 1 ano (Total 3 horas):</text>
  <text x="652" y="492" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">   • 30 mL/kg em 30 minutos</text>
  <text x="652" y="506" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif">   • 70 mL/kg em 2 horas e meia</text>
  <text x="652" y="526" fill="#dc2626" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Se choque descompensado:</text>
  <text x="652" y="540" fill="#b91c1c" font-size="9.5" font-family="system-ui, sans-serif">  Bolus rápido 20 mL/kg em 10-20 min</text>
  <text x="652" y="556" fill="#15803d" font-size="9.5" font-family="system-ui, sans-serif">Passar para SRO assim que tolerar</text>
</svg>