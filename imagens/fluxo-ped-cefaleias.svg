<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCef" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadowCef" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="920" height="620" fill="#f8fafc" rx="8" />

  <!-- Cabeçalho -->
  <rect x="20" y="16" width="880" height="54" rx="6" fill="url(#gradCef)" filter="url(#shadowCef)" />
  <text x="40" y="42" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">ALGORITMO DECISÓRIO: CEFALEIAS NA INFÂNCIA &amp; RED FLAGS</text>
  <text x="40" y="58" fill="#e0f2fe" font-size="11" font-family="system-ui, -apple-system, sans-serif">Diretrizes Oficiais SBP 2024 (6ª Edição) • Triagem com Mnemônico SNOOP, Indicações de Neuroimagem &amp; Terapêutica</text>

  <!-- Nó Inicial: Queixa de Dor de Cabeça -->
  <rect x="250" y="85" width="420" height="50" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadowCef)" />
  <text x="460" y="106" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CRIANÇA OU ADOLESCENTE COM QUEIXA DE CEFALEIA</text>
  <text x="460" y="123" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Anamnese minuciosa (caráter, padrão temporal, gatilhos) + Exame físico e neurológico completo</text>

  <!-- Linha para Triagem de Sinais de Alarme -->
  <line x1="460" y1="135" x2="460" y2="160" stroke="#94a3b8" stroke-width="2" />
  <polygon points="460,165 456,157 464,157" fill="#94a3b8" />

  <!-- Nó de Decisão: Red Flags (SNOOP Pediátrico) -->
  <rect x="200" y="165" width="520" height="74" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text x="460" y="185" fill="#991b1b" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">TRIAGEM DE SINAIS DE ALARME (RED FLAGS / SNOOP PEDIÁTRICO)</text>
  <text x="460" y="202" fill="#b91c1c" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">• Cefaleia que acorda do sono • Vômitos matinais em jato • Piora com Valsalva/tosse • Idade &lt; 3-4 anos</text>
  <text x="460" y="217" fill="#b91c1c" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">• Déficit neurológico focal • Papiledema na fundoscopia • Alteração comportamental / declínio escolar</text>
  <text x="460" y="232" fill="#b91c1c" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">• Início abrupto em trovoada (*thunderclap*) • Aumento súbito do perímetro cefálico no lactente</text>

  <!-- Ramificações: Com Red Flags vs Sem Red Flags -->
  <line x1="200" y1="202" x2="140" y2="202" stroke="#94a3b8" stroke-width="2" />
  <line x1="140" y1="202" x2="140" y2="265" stroke="#94a3b8" stroke-width="2" />
  <polygon points="140,270 136,262 144,262" fill="#94a3b8" />

  <line x1="720" y1="202" x2="780" y2="202" stroke="#94a3b8" stroke-width="2" />
  <line x1="780" y1="202" x2="780" y2="265" stroke="#94a3b8" stroke-width="2" />
  <polygon points="780,270 776,262 784,262" fill="#94a3b8" />

  <!-- Ramo Esquerdo: Cefaleia Secundária (Red Flags Positivos) -->
  <rect x="40" y="270" width="380" height="150" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shadowCef)" />
  <rect x="40" y="270" width="380" height="26" fill="#ef4444" rx="6" />
  <text x="230" y="288" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">SUSPEITA DE CEFALEIA SECUNDÁRIA GRAVE</text>
  <text x="55" y="315" fill="#991b1b" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">Conduta Imediata Obrigatória:</text>
  <text x="55" y="333" fill="#334155" font-size="10" font-family="system-ui, sans-serif">• <tspan font-weight="bold">NEUROIMAGEM DE URGÊNCIA:</tspan></text>
  <text x="55" y="350" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  - Ressonância Magnética (RM) com contraste (método de escolha)</text>
  <text x="55" y="365" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  - TC de crânio sem contraste se emergência aguda ou trauma</text>
  <text x="55" y="382" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">• Diagnósticos a excluir: Neoplasia de SNC (fossa posterior),</text>
  <text x="55" y="397" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  hipertensão intracraniana idiopática, hidrocefalia, abscesso, DVE.</text>
  <text x="55" y="413" fill="#dc2626" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">• Internação hospitalar e avaliação neurocirúrgica imediata.</text>

  <!-- Ramo Direito: Cefaleia Primária (Red Flags Negativos) -->
  <rect x="500" y="270" width="380" height="150" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadowCef)" />
  <rect x="500" y="270" width="380" height="26" fill="#10b981" rx="6" />
  <text x="690" y="288" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CEFALEIAS PRIMÁRIAS (EXAME NORMAL)</text>
  <text x="515" y="315" fill="#065f46" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">Classificação Clínica Sistemática:</text>
  <text x="515" y="333" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <tspan font-weight="bold">MIGRÂNEA (Enxaqueca):</tspan> Pulsátil, bifrontal/unilateral,</text>
  <text x="515" y="348" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  duração de 2 a 72h, náuseas, vômitos, foto/fonofobia. Histórico familiar.</text>
  <text x="515" y="365" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <tspan font-weight="bold">CEFALEIA TENSIONAL:</tspan> Dor em pressão/aperto, holocraniana,</text>
  <text x="515" y="380" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  intensidade leve a moderada, não piora com atividade física habitual.</text>
  <text x="515" y="397" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <tspan font-weight="bold">EQUIVALENTES MIGRANOSOS:</tspan> Síndrome dos vômitos cíclicos,</text>
  <text x="515" y="412" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  vertigem paroxística benigna, migrânea abdominal.</text>

  <!-- Card Inferior: Tratamento Agudo e Profilaxia -->
  <rect x="40" y="440" width="840" height="160" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="40" y="440" width="840" height="26" fill="#f1f5f9" rx="6" />
  <text x="55" y="458" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">TRATAMENTO FARMACOLÓGICO DA CRISE AGUDA &amp; PROFILAXIA DA MIGRÂNEA (SBP 2024)</text>

  <text x="55" y="485" fill="#0369a1" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">1. Tratamento da Crise Aguda (&lt; 30 min):</text>
  <text x="55" y="502" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Ibuprofeno:</tspan> 10 mg/kg VO ou Paracetamol 15 mg/kg.</text>
  <text x="55" y="518" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Triptanos (≥ 6-12a):</tspan> Sumatriptano nasal / Rizatriptano VO.</text>
  <text x="55" y="534" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Antieméticos:</tspan> Ondansetrona (0,15 mg/kg) se náusea intensa.</text>
  <text x="55" y="550" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• Repouso em quarto escuro e silencioso com hidratação oral.</text>

  <text x="495" y="485" fill="#059669" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">2. Profilaxia (Se &gt; 3 a 4 crises graves/mês):</text>
  <text x="495" y="502" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Flunarizina:</tspan> 5 mg VO à noite (bloqueador Ca2+ em escolares).</text>
  <text x="495" y="518" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Topiramato:</tspan> 1 a 3 mg/kg/dia VO (escolha em adolescentes).</text>
  <text x="495" y="534" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Propranolol:</tspan> 1 a 2 mg/kg/dia VO (evitar se asma) ou Amitriptilina.</text>
  <text x="495" y="550" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• Não farmacológico: Higiene do sono, hidratação e diário de dor.</text>
</svg>