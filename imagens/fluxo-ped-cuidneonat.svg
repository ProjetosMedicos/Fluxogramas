<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Cabeçalho -->
  <rect x="40" y="30" width="920" height="90" rx="12" fill="url(#grad-teal)" filter="url(#shadow)"/>
  <text x="500" y="68" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">TRIAGENS NEONATAIS E CLASSIFICAÇÃO DE RISCO EM SALA DE PARTO</text>
  <text x="500" y="96" text-anchor="middle" fill="#ccfbf1" font-size="14" font-weight="600">Diretrizes da Sociedade Brasileira de Pediatria (SBP, 2024) &amp; Ministério da Saúde</text>

  <!-- 3 Pilares da Recepção Neonatal -->
  <g transform="translate(40, 150)">
    <!-- Card 1: Classificação Antropométrica -->
    <rect x="0" y="0" width="290" height="280" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="145" y="32" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="800">1. IDADE GESTACIONAL &amp; PESO</text>
    <text x="15" y="65" fill="#f8fafc" font-size="12" font-weight="700">• Idade Gestacional (DUM / USG precoce):</text>
    <text x="25" y="85" fill="#94a3b8" font-size="11">- Pré-termo: &lt; 37 semanas</text>
    <text x="25" y="102" fill="#94a3b8" font-size="11">- A termo: 37 a 41 semanas e 6 dias</text>
    <text x="25" y="120" fill="#94a3b8" font-size="11">- Pós-termo: ≥ 42 semanas</text>
    <text x="15" y="145" fill="#f8fafc" font-size="12" font-weight="700">• Métodos Clínicos (se dúvida):</text>
    <text x="25" y="165" fill="#cbd5e1" font-size="11">Capurro Somático/Neurológico ou New Ballard</text>
    <text x="15" y="195" fill="#f8fafc" font-size="12" font-weight="700">• Relação Peso x IG (Curvas Lubchenco/Fenton):</text>
    <text x="25" y="215" fill="#a7f3d0" font-size="11">AIG: Percentil 10 a 90 (Adequado)</text>
    <text x="25" y="233" fill="#fde047" font-size="11">PIG: &lt; Percentil 10 (Risco hipoglicemia/TORCH)</text>
    <text x="25" y="252" fill="#f87171" font-size="11">GIG: &gt; Percentil 90 (Risco trauma/filho mãe DM)</text>
  </g>

  <g transform="translate(355, 150)">
    <!-- Card 2: Profilaxias Obrigatórias -->
    <rect x="0" y="0" width="290" height="280" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="145" y="32" text-anchor="middle" fill="#34d399" font-size="14" font-weight="800">2. PROFILAXIAS DE SALA DE PARTO</text>
    <text x="15" y="65" fill="#f8fafc" font-size="12" font-weight="700">• Vitamina K1 (Fitomenadiona):</text>
    <text x="25" y="85" fill="#94a3b8" font-size="11">Dose: 1 mg IM (vasto lateral da coxa)</text>
    <text x="25" y="102" fill="#cbd5e1" font-size="11">Prevenção da Doença Hemorrágica do RN</text>
    <text x="15" y="132" fill="#f8fafc" font-size="12" font-weight="700">• Oftalmia Neonatal (Conjuntivite Gonocócica):</text>
    <text x="25" y="152" fill="#94a3b8" font-size="11">Nitrato de prata 1% (1 gota em cada olho) ou</text>
    <text x="25" y="170" fill="#cbd5e1" font-size="11">Pomada de Eritromicina 0,5% nas primeiras 4h</text>
    <text x="15" y="202" fill="#f8fafc" font-size="12" font-weight="700">• Imunização Inicial:</text>
    <text x="25" y="222" fill="#94a3b8" font-size="11">- Vacina Hepatite B (primeiras 12 a 24h)</text>
    <text x="25" y="240" fill="#94a3b8" font-size="11">- Vacina BCG (dose única intradérmica)</text>
    <text x="25" y="258" fill="#cbd5e1" font-size="11">(Se mãe HBsAg+: aplicar Imunoglobulina HBIG)</text>
  </g>

  <g transform="translate(670, 150)">
    <!-- Card 3: Triagem Biológica (Teste do Pezinho) -->
    <rect x="0" y="0" width="290" height="280" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
    <text x="145" y="32" text-anchor="middle" fill="#facc15" font-size="14" font-weight="800">3. TESTE DO PEZINHO (PNTN)</text>
    <text x="15" y="65" fill="#f8fafc" font-size="12" font-weight="700">• Momento Ideal de Coleta:</text>
    <text x="25" y="85" fill="#fef08a" font-size="11">Entre o 3º e 5º dia de vida (após aleitamento)</text>
    <text x="15" y="115" fill="#f8fafc" font-size="12" font-weight="700">• Doenças Rastradas no Programa Nacional:</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="11">1. Fenilcetonúria (PKU)</text>
    <text x="25" y="152" fill="#cbd5e1" font-size="11">2. Hipotireoidismo Congênito (TSH neonatal)</text>
    <text x="25" y="170" fill="#cbd5e1" font-size="11">3. Doença Falciforme e Hemoglobinopatias</text>
    <text x="25" y="188" fill="#cbd5e1" font-size="11">4. Fibrose Cística (IRT - Tripsina Imunorreativa)</text>
    <text x="25" y="206" fill="#cbd5e1" font-size="11">5. Hiperplasia Adrenal Congênita (17-OHP)</text>
    <text x="25" y="224" fill="#cbd5e1" font-size="11">6. Deficiência de Biotinidase</text>
    <text x="25" y="242" fill="#cbd5e1" font-size="11">7. Toxoplasmose Congênita (IgM)</text>
    <text x="15" y="265" fill="#94a3b8" font-size="10">*Ampliação progressiva para > 50 doenças (Lei 14.154)</text>
  </g>

  <!-- Seção 4: Triagens Universais em Maternidade -->
  <rect x="40" y="470" width="920" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="497" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="800">4 TRIAGENS FÍSICAS UNIVERSAIS OBRIGATÓRIAS ANTES DA ALTA HOSPITALAR</text>

  <!-- 4 Cards de Triagens Físicas -->
  <g transform="translate(40, 530)">
    <!-- Teste do Coraçãozinho -->
    <rect x="0" y="0" width="215" height="400" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    <text x="107" y="30" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="800">TESTE DO CORAÇÃOZINHO</text>
    <text x="107" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">Oximetria de Pulso (24 - 48h)</text>
    <text x="12" y="75" fill="#f8fafc" font-size="11" font-weight="700">Locais de medição:</text>
    <text x="12" y="93" fill="#94a3b8" font-size="11">• Membro Superior Direito (MSD)</text>
    <text x="12" y="110" fill="#94a3b8" font-size="11">• Um dos Membros Inferiores (MI)</text>
    <text x="12" y="135" fill="#a7f3d0" font-size="11" font-weight="700">Resultado Normal:</text>
    <text x="12" y="153" fill="#cbd5e1" font-size="10">• SatO2 ≥ 95% em ambos E</text>
    <text x="12" y="170" fill="#cbd5e1" font-size="10">• Diferença MSD - MI &lt; 3%</text>
    <text x="12" y="195" fill="#f87171" font-size="11" font-weight="700">Resultado Alterado:</text>
    <text x="12" y="213" fill="#cbd5e1" font-size="10">• SatO2 &lt; 95% OU dif ≥ 3%:</text>
    <text x="12" y="230" fill="#fde047" font-size="10">→ Repetir em 1 hora</text>
    <text x="12" y="250" fill="#cbd5e1" font-size="10">• Se persistir alterado:</text>
    <text x="12" y="270" fill="#fca5a5" font-size="11" font-weight="800">→ ECOCARDIOGRAMA em até 24h</text>
    <text x="12" y="295" fill="#94a3b8" font-size="10">Cardiopatias Críticas (PCA-dep.)</text>
  </g>

  <g transform="translate(275, 530)">
    <!-- Teste do Olhinho -->
    <rect x="0" y="0" width="215" height="400" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="107" y="30" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="800">TESTE DO OLHINHO</text>
    <text x="107" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">Reflexo Vermelho</text>
    <text x="12" y="75" fill="#f8fafc" font-size="11" font-weight="700">Método de realização:</text>
    <text x="12" y="93" fill="#94a3b8" font-size="11">• Oftalmoscópio a 50 cm</text>
    <text x="12" y="110" fill="#94a3b8" font-size="11">• Sala em penumbra</text>
    <text x="12" y="135" fill="#a7f3d0" font-size="11" font-weight="700">Resultado Normal:</text>
    <text x="12" y="153" fill="#cbd5e1" font-size="10">• Reflexo vermelho-alaranjado</text>
    <text x="12" y="170" fill="#cbd5e1" font-size="10">homogêneo e simétrico bilateral</text>
    <text x="12" y="195" fill="#f87171" font-size="11" font-weight="700">Resultado Alterado:</text>
    <text x="12" y="213" fill="#cbd5e1" font-size="10">• Leucocoria (reflexo branco),</text>
    <text x="12" y="230" fill="#cbd5e1" font-size="10">assimetria ou manchas escuras</text>
    <text x="12" y="255" fill="#fca5a5" font-size="11" font-weight="800">→ ENCAMINHAR OFTALMOLOGISTA IMEDIATO</text>
    <text x="12" y="295" fill="#94a3b8" font-size="9.5">Catarata, Glaucoma e Retinoblastoma</text>
  </g>

  <g transform="translate(510, 530)">
    <!-- Teste da Orelhinha -->
    <rect x="0" y="0" width="215" height="400" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="107" y="30" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="800">TESTE DA ORELHINHA</text>
    <text x="107" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">Triagem Auditiva Neonatal</text>
    <text x="12" y="75" fill="#f8fafc" font-size="11" font-weight="700">Sem Indicadores de Risco:</text>
    <text x="12" y="93" fill="#94a3b8" font-size="11">• Emissões Otoacústicas Evocadas (EOAE)</text>
    <text x="12" y="120" fill="#f8fafc" font-size="11" font-weight="700">Com Indicadores de Risco:</text>
    <text x="12" y="138" fill="#cbd5e1" font-size="9">(UTIN &gt; 5d, sepse, TORCH):</text>
    <text x="12" y="170" fill="#fde047" font-size="11" font-weight="800">• Realizar PEATE / BERA</text>
    <text x="12" y="195" fill="#f87171" font-size="11" font-weight="700">Resultado "Falha":</text>
    <text x="12" y="213" fill="#cbd5e1" font-size="10">• Reavaliar em até 30 dias</text>
    <text x="12" y="235" fill="#fca5a5" font-size="11" font-weight="800">→ Falha: PEATE / BERA</text>
  </g>

  <g transform="translate(745, 530)">
    <!-- Teste da Linguinha -->
    <rect x="0" y="0" width="215" height="400" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
    <text x="107" y="30" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="800">TESTE DA LINGUINHA</text>
    <text x="107" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">Protocolo de Freio Lingual</text>
    <text x="12" y="75" fill="#f8fafc" font-size="11" font-weight="700">Objetivo:</text>
    <text x="12" y="93" fill="#94a3b8" font-size="11">Detectar Anquiloglossia</text>
    <text x="12" y="110" fill="#94a3b8" font-size="11">(freio lingual curto)</text>
    <text x="12" y="135" fill="#f8fafc" font-size="11" font-weight="700">Impacto Clínico:</text>
    <text x="12" y="153" fill="#cbd5e1" font-size="10">• Dificuldade de pega e sucção</text>
    <text x="12" y="170" fill="#cbd5e1" font-size="10">• Dor e fissuras mamilares maternas</text>
    <text x="12" y="188" fill="#cbd5e1" font-size="10">• Baixo ganho de peso</text>
    <text x="12" y="215" fill="#fde047" font-size="11" font-weight="700">Conduta:</text>
    <text x="12" y="235" fill="#cbd5e1" font-size="10">Avaliação anatômica e funcional;</text>
    <text x="12" y="255" fill="#22d3ee" font-size="11" font-weight="800">Se alteração com prejuízo à amamentação:</text>
    <text x="12" y="280" fill="#f8fafc" font-size="11">Frenotomia lingual simples</text>
  </g>

  <!-- Algoritmo de Decisão de Alta -->
  <rect x="150" y="960" width="700" height="130" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="990" text-anchor="middle" fill="#34d399" font-size="15" font-weight="800">CRITÉRIOS PARA ALTA HOSPITALAR DO RECÉM-NASCIDO SAUDÁVEL</text>
  <text x="500" y="1015" text-anchor="middle" fill="#f8fafc" font-size="12">1. Mínimo de 48 horas de vida com estabilidade clínica, térmica e glicêmica</text>
  <text x="500" y="1035" text-anchor="middle" fill="#f8fafc" font-size="12">2. Pega e sucção eficientes no seio materno com eliminação de mecônio e diurese</text>
  <text x="500" y="1055" text-anchor="middle" fill="#f8fafc" font-size="12">3. Todas as 4 triagens físicas realizadas e normais + Coleta do Teste do Pezinho agendada/realizada</text>
  <text x="500" y="1075" text-anchor="middle" fill="#fde047" font-size="12" font-weight="700">4. Consulta de Puericultura ambulatorial agendada na 1ª semana de vida (ideal 3º ao 5º dia pós-alta)</text>

  <text x="500" y="1150" text-anchor="middle" fill="#64748b" font-size="12">Fonte Oficial de Referência: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>