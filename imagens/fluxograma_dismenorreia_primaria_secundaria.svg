<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">DISMENORREIA: FLUXO DE DECISÃO CLÍNICA E CONDUTA</text>
  <text x="950" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 34 • Manejo Escalonado</text>

  <!-- Content -->
  
    <rect x="290" y="90" width="400" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="490" y="115" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">DISMENORREIA / CÓLICA MENSTRUAL INCAPACITANTE</text>
    <text x="490" y="135" font-size="11" fill="#475569" text-anchor="middle">Avaliação clínica detalhada: Idade de início, padrão e exame pélvico</text>

    <!-- Bifurcação Primária vs Secundária -->
    <path d="M 390 150 L 250 200" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 590 150 L 730 200" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Coluna Dismenorreia Primária -->
    <rect x="50" y="210" width="410" height="420" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="255" y="238" font-size="14" font-weight="800" fill="#0369a1" text-anchor="middle">DISMENORREIA PRIMÁRIA</text>
    <text x="70" y="265" font-size="12" font-weight="700" fill="#075985">• Perfil Clínico Típico:</text>
    <text x="80" y="283" font-size="11" fill="#0369a1">- Início 6 a 24 meses após a menarca (ciclos ovulatórios)</text>
    <text x="80" y="301" font-size="11" fill="#0369a1">- Dor tipo cólica poucas horas antes ou com o fluxo menstrual</text>
    <text x="80" y="319" font-size="11" fill="#0369a1">- Duração típica de 48 a 72 horas</text>
    <text x="80" y="337" font-size="11" fill="#0369a1">- Exame ginecológico e USG pélvico normais</text>
    <text x="70" y="365" font-size="12" font-weight="700" fill="#075985">• Fisiopatologia:</text>
    <text x="80" y="383" font-size="11" fill="#0369a1">- Superprodução endometrial de PGF2α e PGE2 na descamação</text>
    <text x="80" y="401" font-size="11" fill="#0369a1">- Hipercontratilidade miometrial e isquemia tecidual transitória</text>
    <text x="70" y="430" font-size="12" font-weight="700" fill="#075985">• Tratamento de 1ª Linha (Tratamento Empírico):</text>
    <text x="80" y="450" font-size="11" font-weight="700" fill="#15803d">1. AINEs Antiprostaglandínicos:</text>
    <text x="90" y="468" font-size="10" fill="#166534">Ácido Mefenâmico 500mg 8/8h ou Ibuprofeno 600mg 8/8h (iniciar 1-2 dias antes)</text>
    <text x="80" y="490" font-size="11" font-weight="700" fill="#15803d">2. Supressão da Ovulação:</text>
    <text x="90" y="508" font-size="10" fill="#166534">Anticoncepcionais combinados contínuos, DIU-LNG 52mg ou Implante</text>
    <rect x="70" y="530" width="370" height="85" rx="6" fill="#fef2f2" stroke="#f87171"/>
    <text x="80" y="550" font-size="11" font-weight="800" fill="#991b1b">⚠️ FALHA TERAPÊUTICA APÓS 3 A 6 MESES?</text>
    <text x="80" y="570" font-size="10" fill="#7f1d1d">Reclassificar como provável Dismenorreia Secundária!</text>
    <text x="80" y="590" font-size="10" fill="#7f1d1d">Indicar investigação de imagem de alta resolução (RM de pelve / USG específico).</text>

    <!-- Coluna Dismenorreia Secundária -->
    <rect x="520" y="210" width="410" height="420" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" filter="url(#shadow)"/>
    <text x="725" y="238" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">DISMENORREIA SECUNDÁRIA</text>
    <text x="540" y="265" font-size="12" font-weight="700" fill="#7f1d1d">• Red Flags &amp; Perfil Suspeito:</text>
    <text x="550" y="283" font-size="11" fill="#991b1b">- Início tardio (&gt; 25 anos) ou dor desde a menarca que piora</text>
    <text x="550" y="301" font-size="11" fill="#991b1b">- Dor acíclica associada, dispareunia de profundidade, disquezia</text>
    <text x="550" y="319" font-size="11" fill="#991b1b">- Menorragia / SUA associado</text>
    <text x="550" y="337" font-size="11" fill="#991b1b">- Nódulo palpável em fórnice vaginal, útero fixo ou aumentado</text>
    <text x="540" y="365" font-size="12" font-weight="700" fill="#7f1d1d">• Principais Etiologias:</text>
    <text x="550" y="383" font-size="11" fill="#991b1b">1. Endometriose profunda / peritoneal (etiologia mais frequente)</text>
    <text x="550" y="401" font-size="11" fill="#991b1b">2. Adenomiose uterina (útero globular doloroso)</text>
    <text x="550" y="419" font-size="11" fill="#991b1b">3. Malformações Mullerianas obstrutivas (hímen imperfurado, septo)</text>
    <text x="550" y="437" font-size="11" fill="#991b1b">4. Miomatose uterina submucosa / intramural</text>
    <text x="550" y="455" font-size="11" fill="#991b1b">5. Doença Inflamatória Pélvica crônica / sequela aderencial</text>
    <text x="540" y="485" font-size="12" font-weight="700" fill="#7f1d1d">• Investigação e Conduta Especializada:</text>
    <text x="550" y="505" font-size="10" fill="#7f1d1d">- USG Transvaginal com preparo intestinal específico para endometriose</text>
    <text x="550" y="523" font-size="10" fill="#7f1d1d">- Ressonância Magnética da pelve (protocolo 3T)</text>
    <text x="550" y="541" font-size="10" fill="#7f1d1d">- Histeroscopia cirúrgica (se septo ou estenose cervical)</text>
    <text x="550" y="563" font-size="10" font-weight="700" fill="#15803d">- Tratamento direcionado: Cirurgia laparoscópica avançada de excisão</text>
    <text x="550" y="581" font-size="10" fill="#15803d">  ou bloqueio medicamentoso agressivo com análogos GnRH / Dienogeste</text>
    

  <!-- Footer -->
  <line x1="30" y1="645" x2="950" y2="645" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="662" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • ACOG • FIGO • OMS (MEC 5ª Ed)</text>
  <text x="950" y="662" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>