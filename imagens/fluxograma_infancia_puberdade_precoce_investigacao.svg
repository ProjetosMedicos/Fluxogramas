<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • ENDOCRINOLOGIA GINECOLÓGICA INFANTIL</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">ALGORITMO DE INVESTIGAÇÃO DA PUBERDADE PRECOCE FEMININA</text>
  <text x="970" y="45" fill="#cbd5e1" font-size="13" font-weight="500" text-anchor="end">Cap. 21 e 22 FEBRASGO • Endocrine Society</text>

  <!-- Node Topo -->
  <rect x="180" y="88" width="640" height="55" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="112" font-size="13" font-weight="800" fill="#0369a1" text-anchor="middle">CARACTERES SEXUAIS SECUNDÁRIOS &lt; 8 ANOS (OU MENARCA &lt; 9 ANOS)</text>
  <text x="500" y="131" font-size="11" fill="#0284c7" text-anchor="middle">Telarca (brotamento mamário Tanner M2) e/ou Pubarca (pelos P2) com aceleração do crescimento</text>

  <!-- Linha -->
  <line x1="500" y1="143" x2="500" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Propedeutica Inicial -->
  <rect x="200" y="172" width="600" height="50" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="194" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">PROPEDÊUTICA INICIAL COMPULSÓRIA</text>
  <text x="500" y="211" font-size="11" fill="#475569" text-anchor="middle">RX de Mão e Punho Esquerdo (Idade Óssea - IO) • USG Pélvica • LH basal ultrassensível</text>

  <!-- Bifurcação IO -->
  <path d="M 350 222 L 200 255" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 650 222 L 720 255" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caixa Esquerda: Idade Óssea Compatível -->
  <rect x="30" y="260" width="340" height="135" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="285" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">IO COMPATÍVEL COM IDADE CRONOLÓGICA</text>
  <text x="45" y="310" font-size="11" font-weight="700" fill="#166534">Variantes Normais do Desenvolvimento:</text>
  <text x="45" y="328" font-size="10" fill="#475569">• Telarca Precoce Isolada (sem pubarca, útero infantil)</text>
  <text x="45" y="344" font-size="10" fill="#475569">• Adrenarca Precoce Isolada (odor axilar, pelos pubianos)</text>
  <text x="45" y="365" font-size="10" font-weight="700" fill="#15803d">Conduta: Expectante • Acompanhar velocidade de crescimento</text>

  <!-- Caixa Direita: Idade Óssea Avançada -->
  <rect x="420" y="260" width="550" height="75" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="283" font-size="12" font-weight="800" fill="#9f1239" text-anchor="middle">IO AVANÇADA (&gt; 1 A 2 ANOS) + ÚTERO PUBERAL (VOLUME &gt; 3-4 mL)</text>
  <text x="695" y="303" font-size="11" fill="#475569" text-anchor="middle">Realizar Teste de Estímulo com GnRH sintético (ou LH basal ≥ 0,3-0,6 UI/L)</text>
  <text x="695" y="322" font-size="10" font-weight="700" fill="#be123c" text-anchor="middle">Diferenciar ativação do eixo central vs produção hormonal periférica</text>

  <!-- Ramificações Central vs Periférica -->
  <line x1="530" y1="335" x2="530" y2="370" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="335" x2="840" y2="370" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Coluna Central: Puberdade Precoce Central (PPC) -->
  <rect x="400" y="375" width="280" height="225" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="400" y="375" width="280" height="28" rx="8" fill="#7c3aed"/>
  <text x="540" y="394" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">PPC (GnRH-DEPENDENTE)</text>

  <text x="415" y="420" font-size="10" font-weight="700" fill="#5b21b6">• Pico de LH pós-GnRH &gt; 5,0 UI/L</text>
  <text x="415" y="435" font-size="10" fill="#475569">• Progressão isosexual ordenada</text>

  <text x="415" y="458" font-size="10" font-weight="800" fill="#9f1239">Exame Obrigatório:</text>
  <text x="415" y="474" font-size="10" font-weight="700" fill="#0f172a">• RNM de Encéfalo e Sela Túrcica</text>
  <text x="415" y="490" font-size="9" fill="#475569">Excluir Hamartoma hipotalâmico, gliomas</text>
  <text x="415" y="504" font-size="9" fill="#475569">85% das meninas são de causa Idiopática</text>

  <text x="415" y="528" font-size="10" font-weight="800" fill="#5b21b6">Tratamento Padrão-Ouro:</text>
  <text x="415" y="544" font-size="10" font-weight="700" fill="#0f172a">• Análogo de GnRH (Leuprorrelina)</text>
  <text x="415" y="558" font-size="9" fill="#475569">Dose: 3,75mg IM/SC a cada 28 dias</text>
  <text x="415" y="572" font-size="9" fill="#475569">Bloqueia progressão e preserva estatura</text>

  <!-- Coluna Periférica: Puberdade Precoce Periférica (PPP) -->
  <rect x="700" y="375" width="280" height="225" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="700" y="375" width="280" height="28" rx="8" fill="#d97706"/>
  <text x="840" y="394" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">PPP (GnRH-INDEPENDENTE)</text>

  <text x="715" y="420" font-size="10" font-weight="700" fill="#b45309">• LH basal &lt; 0,2 e Teste GnRH plano</text>
  <text x="715" y="435" font-size="10" fill="#475569">• Estradiol elevado autonomamente</text>

  <text x="715" y="458" font-size="10" font-weight="800" fill="#b45309">Etiologias Principais:</text>
  <text x="715" y="474" font-size="10" fill="#475569">• Cistos foliculares autônomos</text>
  <text x="715" y="488" font-size="10" fill="#475569">• Tumor da granulosa (secreta inibina/E2)</text>
  <text x="715" y="502" font-size="10" fill="#475569">• Síndrome de McCune-Albright (manchas</text>
  <text x="715" y="516" font-size="9" fill="#475569">  café-com-leite + displasia fibrosa)</text>
  <text x="715" y="530" font-size="10" fill="#475569">• Neoplasia adrenal / HAC não clássica</text>

  <text x="715" y="552" font-size="10" font-weight="800" fill="#b45309">Conduta Terapêutica:</text>
  <text x="715" y="568" font-size="9" fill="#475569">Tratamento etiológico direcionado (cirurgia,</text>
  <text x="715" y="582" font-size="9" fill="#475569">inibidores de aromatase, cirurgia adrenal)</text>

  <!-- Rodapé -->
  <rect x="30" y="610" width="940" height="52" rx="8" fill="#0f172a" filter="url(#shadow)"/>
  <text x="500" y="630" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">OBJETIVOS FUNDAMENTAIS DO TRATAMENTO</text>
  <text x="500" y="648" font-size="10" fill="#f8fafc" text-anchor="middle">1. Preservar o potencial genético de estatura adulta (evitar fusão precoce das cartilagens) • 2. Prevenir repercussões psicossociais e menarca precoce</text>
</svg>