<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; line-height: 1.3; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">ALGORITMO DA BRONQUIOLITE VIRAL AGUDA (BVA)</text>
  <text x="50" y="78" class="subtitle">Lactentes < 2 anos • Suporte Baseado em Evidências • SBP 2024</text>
  <rect x="750" y="42" width="200" height="28" rx="6" fill="#0284c7" />
  <text x="850" y="60" text-anchor="middle" class="badge-text">SBP 2024 • PNEUMOLOGIA</text>


  <g class="card-shadow">
    <rect x="300" y="115" width="400" height="60" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="500" y="138" text-anchor="middle" class="node-bold">DIAGNÓSTICO CLÍNICO DA BRONQUIOLITE (BVA)</text>
    <text x="500" y="158" text-anchor="middle" class="node-text">Lactente &lt; 2 anos, pródromos de VAS (2-3d) seguidos de taquipneia, tiragens e estertores</text>
  </g>

  <path d="M 400 175 L 230 230" class="edge" />
  <path d="M 600 175 L 770 230" class="edge" />

  <g class="card-shadow">
    <rect x="80" y="230" width="300" height="85" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
    <text x="230" y="252" text-anchor="middle" class="node-bold" fill="#15803d">BVA LEVE (AMBULATORIAL)</text>
    <text x="230" y="272" text-anchor="middle" class="node-text">• SpO2 ≥ 90-92% em ar ambiente</text>
    <text x="230" y="288" text-anchor="middle" class="node-text">• Boa aceitação de dieta e hidratação oral</text>
    <text x="230" y="304" text-anchor="middle" class="node-text">• Ausência de tiragens acentuadas ou apneia</text>
  </g>

  <g class="card-shadow">
    <rect x="620" y="230" width="300" height="85" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="770" y="252" text-anchor="middle" class="node-bold" fill="#b91c1c">BVA MODERADA A GRAVE (INTERNAÇÃO)</text>
    <text x="770" y="272" text-anchor="middle" class="node-text">• SpO2 &lt; 90-92%, gemência, tiragem subcostal/fúrcula</text>
    <text x="770" y="288" text-anchor="middle" class="node-text">• Ingestão alimentar &lt; 50% do habitual, desidratação</text>
    <text x="770" y="304" text-anchor="middle" class="node-text">• Episódio de apneia ou idade &lt; 6 a 12 semanas</text>
  </g>

  <path d="M 230 315 L 230 375" class="edge" />
  <g class="card-shadow">
    <rect x="70" y="375" width="320" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <text x="230" y="398" text-anchor="middle" class="node-bold">CONDUTA DOMICILIAR CONSERVADORA</text>
    <text x="230" y="420" text-anchor="middle" class="node-text">• Desobstrução e lavagem nasal com SF 0,9% pré-mamadas</text>
    <text x="230" y="438" text-anchor="middle" class="node-text">• Fracionamento de mamadas / hidratação oral contínua</text>
    <text x="230" y="456" text-anchor="middle" class="node-text">• Elevação da cabeceira do berço (30 graus)</text>
    <text x="230" y="474" text-anchor="middle" class="node-text">• Orientação estrita de sinais de alarme com retorno em 48h</text>
  </g>

  <path d="M 770 315 L 770 375" class="edge" />
  <g class="card-shadow">
    <rect x="610" y="375" width="320" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
    <text x="770" y="398" text-anchor="middle" class="node-bold">SUPORTE HOSPITALAR BASEADO EM EVIDÊNCIAS</text>
    <text x="770" y="420" text-anchor="middle" class="node-text">• Oxigenoterapia por cateter nasal para SpO2 &gt; 90-92%</text>
    <text x="770" y="438" text-anchor="middle" class="node-text">• Nutrição enteral por SNG ou hidratação venosa isotônica</text>
    <text x="770" y="456" text-anchor="middle" class="node-text">• Cânula Nasal de Alto Fluxo (CNAF 1 a 2 L/kg/min) se falha</text>
    <text x="770" y="474" text-anchor="middle" class="node-text">• CPAP nasal / IOT se fadiga respiratória e acidose grave</text>
  </g>

  <path d="M 230 495 L 370 540" class="edge" />
  <path d="M 770 495 L 630 540" class="edge" />

  <g class="card-shadow">
    <rect x="180" y="540" width="640" height="130" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
    <text x="500" y="565" text-anchor="middle" class="node-bold" fill="#c2410c">O QUE NÃO FAZER NA BVA (DIRETRIZES SBP / CHOOSING WISELY)</text>
    <text x="500" y="588" text-anchor="middle" class="node-text">• NÃO prescrever broncodilatadores (Salbutamol) de rotina (teste terapêutico individualizado se &gt; 6m)</text>
    <text x="500" y="606" text-anchor="middle" class="node-text">• NÃO prescrever corticoides sistêmicos (sem benefício em tempo de internação ou desfecho)</text>
    <text x="500" y="624" text-anchor="middle" class="node-text">• NÃO prescrever antibióticos (infecção é viral, principalmente VSR e Rinovírus)</text>
    <text x="500" y="642" text-anchor="middle" class="node-text">• NÃO realizar fisioterapia respiratória motora na fase aguda (risco de broncoespasmo e agitação)</text>
    <text x="500" y="658" text-anchor="middle" class="node-text">• Prevenção específica: Imunização com Palivizumabe / Nirsevimabe para grupos de alto risco</text>
  </g>


  <!-- Footer Notice -->
  <rect x="30" y="700" width="940" height="35" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="722" text-anchor="middle" class="subtitle" style="font-size: 11px;">Diretriz Oficial: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>