<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">SÍNDROME PRÉ-MENSTRUAL (SPM) E TDPM: DIAGNÓSTICO E MANEJO</text>
  <text x="970" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 31 • DSM-5-TR • ACOG</text>

  <!-- Content -->
  
    <rect x="270" y="90" width="460" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="115" font-size="14" font-weight="800" fill="#3730a3" text-anchor="middle">SUSPEITA DE SÍNDROME PRÉ-MENSTRUAL (SPM / TDPM)</text>
    <text x="500" y="135" font-size="11" fill="#4338ca" text-anchor="middle">Sintomas físicos e/ou emocionais cíclicos recorrentes na fase lútea</text>

    <!-- Linha para Diário DRSP -->
    <line x1="500" y1="150" x2="500" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="220" y="185" width="560" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="500" y="208" font-size="12" font-weight="800" fill="#1e293b" text-anchor="middle">REGISTRO PROSPECTIVO DIÁRIO OBRIGATÓRIO (DIÁRIO DRSP)</text>
    <text x="500" y="228" font-size="11" fill="#475569" text-anchor="middle">Avaliação durante pelo menos 2 ciclos menstruais consecutivos</text>

    <!-- Critério de Temporalidade -->
    <rect x="180" y="260" width="640" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="500" y="285" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">CRITÉRIO MANDATÓRIO: Intervalo livre assintomático de ≥ 7 dias na Fase Folicular (pós-menstruação)</text>

    <!-- Bifurcação Leve vs TDPM -->
    <path d="M 380 300 L 250 340" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 620 300 L 750 340" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Coluna SPM Leve / Moderada -->
    <rect x="50" y="350" width="410" height="290" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="255" y="380" font-size="13" font-weight="800" fill="#065f46" text-anchor="middle">SPM LEVE A MODERADA (CRITÉRIOS ACOG)</text>
    <text x="70" y="405" font-size="11" fill="#047857">• Pelo menos 1 sintoma somático ou afetivo na fase lútea tardia.</text>
    <text x="70" y="423" font-size="11" fill="#047857">• Discreto ou moderado impacto social/ocupacional.</text>

    <line x1="70" y1="440" x2="440" y2="440" stroke="#a7f3d0" stroke-width="1"/>
    <text x="70" y="465" font-size="12" font-weight="800" fill="#065f46">CONDUTA: MEDIDAS NÃO FARMACOLÓGICAS</text>
    <text x="80" y="488" font-size="11" fill="#065f46">1. <tspan font-weight="bold">Atividade Física Aeróbica:</tspan> 150 min/semana (liberação de endorfinas).</text>
    <text x="80" y="508" font-size="11" fill="#065f46">2. <tspan font-weight="bold">Ajustes Dietéticos:</tspan> Redução de cafeína, sal, álcool e açúcares simples.</text>
    <text x="80" y="528" font-size="11" fill="#065f46">3. <tspan font-weight="bold">Suplementação com Evidência:</tspan></text>
    <text x="95" y="546" font-size="10.5" fill="#047857">• Carbonato de Cálcio 1.200 mg/dia VO (reduz edema e labilidade).</text>
    <text x="95" y="564" font-size="10.5" fill="#047857">• Piridoxina (Vit. B6) 50 a 100 mg/dia VO (atenção para risco neurotóxico se > 100mg).</text>
    <text x="95" y="582" font-size="10.5" fill="#047857">• Magnésio quelato 200 a 400 mg/dia VO.</text>
    <text x="80" y="605" font-size="11" fill="#065f46">4. <tspan font-weight="bold">Terapia Cognitivo-Comportamental (TCC).</tspan></text>

    <!-- Coluna TDPM (Grave) -->
    <rect x="540" y="350" width="410" height="290" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="745" y="380" font-size="13" font-weight="800" fill="#3730a3" text-anchor="middle">TRANSTORNO DISFÓRICO (TDPM - DSM-5)</text>
    <text x="560" y="405" font-size="11" fill="#3730a3">• ≥ 5 de 11 sintomas com pelo menos 1 Sintoma Nuclear Afetivo:</text>
    <text x="575" y="423" font-size="10.5" fill="#4338ca">(Irritabilidade marcada, labilidade, humor deprimido ou ansiedade extrema).</text>
    <text x="560" y="441" font-size="11" fill="#dc2626">• Prejuízo funcional e ocupacional severo demonstrado.</text>

    <line x1="560" y1="450" x2="930" y2="450" stroke="#c7d2fe" stroke-width="1"/>
    <text x="560" y="475" font-size="12" font-weight="800" fill="#3730a3">1ª LINHA: ISRS (PADRÃO-OURO)</text>
    <text x="570" y="498" font-size="11" fill="#1e1b4b">• <tspan font-weight="bold">Fluoxetina:</tspan> 20 mg/dia VO (contínuo ou fase lútea D14-D1).</text>
    <text x="570" y="518" font-size="11" fill="#1e1b4b">• <tspan font-weight="bold">Sertralina:</tspan> 50 a 100 mg/dia VO (início de ação rápido em TDPM).</text>
    <text x="570" y="538" font-size="11" fill="#1e1b4b">• <tspan font-weight="bold">Escitalopram:</tspan> 10 a 20 mg/dia VO.</text>

    <text x="560" y="565" font-size="12" font-weight="800" fill="#4338ca">2ª LINHA / OPÇÃO CONTRACEPTIVA:</text>
    <text x="570" y="585" font-size="11" fill="#312e81">• <tspan font-weight="bold">Drospirenona 3 mg + Etinilestradiol 20 mcg</tspan> (regime 24+4 ou contínuo).</text>
    <text x="560" y="612" font-size="11" font-weight="700" fill="#b91c1c">Casos Ultra-Refratários: Análogos de GnRH + Add-back therapy.</text>
    

  <!-- Footer -->
  <line x1="30" y1="645" x2="970" y2="645" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="662" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • ACOG • ESHRE • OMS</text>
  <text x="970" y="662" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>