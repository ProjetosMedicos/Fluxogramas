<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="960" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">ESTADIAMENTO FIGO 2021 &amp; CONDUTA NO CÂNCER DE VULVA</text>
  <text x="930" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FIGO 2021 • FEBRASGO Cap. 78</text>

  <!-- Content -->
  
    <rect x="280" y="95" width="400" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="480" y="120" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">CARCINOMA ESPINOCELULAR DE VULVA (CONFIRMADO)</text>
    <text x="480" y="140" font-size="11" fill="#b91c1c" text-anchor="middle">Avaliação Crítica: Profundidade de Invasão Estromal e Status Inguinal</text>

    <!-- Três Colunas FIGO -->
    <rect x="40" y="180" width="270" height="420" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="175" y="210" font-size="13" font-weight="800" fill="#065f46" text-anchor="middle">ESTÁDIO IA</text>
    <text x="175" y="228" font-size="11" fill="#047857" text-anchor="middle">Microinvasor Restrito</text>
    <text x="55" y="260" font-size="11" fill="#064e3b">• Lesão &#8804; 2,0 cm</text>
    <text x="55" y="280" font-size="11" font-weight="800" fill="#047857">• Invasão estromal &#8804; 1,0 mm</text>
    <text x="55" y="300" font-size="11" fill="#064e3b">• Linfonodos negativos</text>
    <text x="55" y="340" font-size="12" font-weight="800" fill="#059669">CONDUTA CIRÚRGICA:</text>
    <text x="55" y="365" font-size="11" font-weight="800" fill="#047857">RESSECÇÃO LOCAL AMPLA</text>
    <text x="55" y="385" font-size="11" fill="#064e3b">com margem livre &#8805; 1,0 cm.</text>
    <text x="55" y="420" font-size="11" font-weight="800" fill="#065f46">Linfadenectomia Inguinal</text>
    <text x="55" y="438" font-size="11" font-weight="800" fill="#065f46">DISPENSADA</text>
    <text x="55" y="456" font-size="10" fill="#064e3b">(Risco de metástase &lt; 1%).</text>

    <rect x="345" y="180" width="270" height="420" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="480" y="210" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">ESTÁDIO IB E II</text>
    <text x="480" y="228" font-size="11" fill="#1d4ed8" text-anchor="middle">Invasão &gt; 1 mm / Sem Linfonodos</text>
    <text x="360" y="260" font-size="11" fill="#1e3a8a">• Tumor &gt; 2 cm OU</text>
    <text x="360" y="280" font-size="11" font-weight="800" fill="#1d4ed8">• Invasão estromal &gt; 1,0 mm</text>
    <text x="360" y="300" font-size="11" fill="#1e3a8a">• Sem acometimento nodal</text>
    <text x="360" y="340" font-size="12" font-weight="800" fill="#2563eb">CONDUTA CIRÚRGICA:</text>
    <text x="360" y="365" font-size="11" font-weight="800" fill="#1d4ed8">VULVECTOMIA PARCIAL / RADICAL</text>
    <text x="360" y="385" font-size="11" fill="#1e3a8a">com incisão tríplice separada.</text>
    <text x="360" y="415" font-size="11" font-weight="800" fill="#1e40af">+ MANEJO INGUINAL:</text>
    <text x="360" y="433" font-size="11" fill="#1e3a8a">• <tspan font-weight="bold">Linfonodo Sentinela (SLN)</tspan></text>
    <text x="370" y="451" font-size="10" fill="#1e3a8a">se tumor unifocal &lt; 4 cm e virilha cN0;</text>
    <text x="360" y="473" font-size="11" fill="#1e3a8a">• OU Linfadenectomia Inguinofemoral.</text>

    <rect x="650" y="180" width="270" height="420" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="785" y="210" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">ESTÁDIO III E IV</text>
    <text x="785" y="228" font-size="11" fill="#b91c1c" text-anchor="middle">Linfonodos (+) / Doença Avançada</text>
    <text x="665" y="260" font-size="11" fill="#7f1d1d">• Metástases linfonodais</text>
    <text x="665" y="280" font-size="11" fill="#7f1d1d">inguinofemorais (III)</text>
    <text x="665" y="300" font-size="11" fill="#7f1d1d">• Invasão de bexiga, reto,</text>
    <text x="665" y="318" font-size="11" fill="#7f1d1d">osso púbico ou distância (IV)</text>
    <text x="665" y="350" font-size="12" font-weight="800" fill="#dc2626">CONDUTA TERAPÊUTICA:</text>
    <text x="665" y="375" font-size="11" font-weight="800" fill="#b91c1c">QUIMIORRADIOTERAPIA</text>
    <text x="665" y="395" font-size="11" font-weight="800" fill="#b91c1c">DEFINITIVA CONCOMITANTE</text>
    <text x="665" y="415" font-size="11" fill="#7f1d1d">com Cisplatina semanal.</text>
    <text x="665" y="445" font-size="10" fill="#7f1d1d">Exenteração pélvica apenas se fístula</text>
    <text x="665" y="463" font-size="10" fill="#7f1d1d">ou doença residual pós-RT.</text>
    

  <!-- Footer -->
  <line x1="30" y1="615" x2="930" y2="615" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="632" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • SBM • FIGO • ISSVD</text>
  <text x="930" y="632" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>