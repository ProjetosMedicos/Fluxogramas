<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; line-height: 1.3; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">ALGORITMO DE ALERGIA À PROTEÍNA DO LEITE DE VACA (APLV)</text>
  <text x="50" y="78" class="subtitle">Diferenciação IgE vs Não-IgE e Manejo Nutricional • SBP 2024</text>
  <rect x="750" y="42" width="200" height="28" rx="6" fill="#0284c7" />
  <text x="850" y="60" text-anchor="middle" class="badge-text">SBP 2024 • ALERGIA &amp; GASTRO</text>


  <g class="card-shadow">
    <rect x="300" y="115" width="400" height="60" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="500" y="138" text-anchor="middle" class="node-bold">SUSPEITA DE ALERGIA AO LEITE DE VACA (APLV)</text>
    <text x="500" y="158" text-anchor="middle" class="node-text">Manifestações gastrointestinais, cutâneas ou respiratórias pós-ingestão de LV</text>
  </g>

  <path d="M 400 175 L 230 230" class="edge" />
  <path d="M 600 175 L 770 230" class="edge" />

  <g class="card-shadow">
    <rect x="80" y="230" width="300" height="85" rx="10" fill="#fdf4ff" stroke="#c026d3" stroke-width="2" />
    <text x="230" y="252" text-anchor="middle" class="node-bold" fill="#86198f">REAÇÕES IgE-MEDIADAS (IMEDIATAS)</text>
    <text x="230" y="272" text-anchor="middle" class="node-text">• Início rápido: minutos a 2 horas pós-ingestão</text>
    <text x="230" y="288" text-anchor="middle" class="node-text">• Urticária aguda, angioedema, vômitos em jato, anafilaxia</text>
    <text x="230" y="304" text-anchor="middle" class="node-text">• Diagnóstico: Prick test e IgE específica sérica positivos</text>
  </g>

  <g class="card-shadow">
    <rect x="620" y="230" width="300" height="85" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="770" y="252" text-anchor="middle" class="node-bold" fill="#b45309">REAÇÕES NÃO-IgE MEDIADAS (TARDIVAS)</text>
    <text x="770" y="272" text-anchor="middle" class="node-text">• Início insidioso: dias a semanas pós-exposição</text>
    <text x="770" y="288" text-anchor="middle" class="node-text">• Proctocolite alérgica (fezes mucossanguinolentas, lactente hígido)</text>
    <text x="770" y="304" text-anchor="middle" class="node-text">• FPIES, enteropatia, baixo ganho ponderal. Testes IgE negativos!</text>
  </g>

  <path d="M 500 315 L 500 375" class="edge" />
  <path d="M 230 315 L 400 375" class="edge" />
  <path d="M 770 315 L 600 375" class="edge" />

  <g class="card-shadow">
    <rect x="220" y="375" width="560" height="125" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <text x="500" y="398" text-anchor="middle" class="node-bold" fill="#0369a1">CONDUTA TERAPÊUTICA: DIETA DE EXCLUSÃO (SBP 2024)</text>
    <text x="500" y="420" text-anchor="middle" class="node-text">• Se em Aleitamento Materno Exclusivo (AME): MANTER O ALEITAMENTO MATERNO!</text>
    <text x="500" y="438" text-anchor="middle" class="node-text">  Dieta de exclusão rigorosa de derivados lácteos da mãe + carbonato de cálcio 1.000 mg/dia para a nutriz</text>
    <text x="500" y="456" text-anchor="middle" class="node-text">• Se em uso de Fórmula Infantil: FÓRMULA EXTENSAMENTE HIDROLISADA (FEH) como 1ª linha</text>
    <text x="500" y="474" text-anchor="middle" class="node-text">• Fórmulas à base de Aminoácidos Livres (FAA) se: anafilaxia grave, FPIES, sangramento refratário ou falha da FEH</text>
    <text x="500" y="492" text-anchor="middle" class="node-text">• Fórmula de soja permitida apenas em maiores de 6 meses com reações puramente IgE-mediadas</text>
  </g>

  <path d="M 500 500 L 500 550" class="edge" />

  <g class="card-shadow">
    <rect x="200" y="550" width="600" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="500" y="573" text-anchor="middle" class="node-bold" fill="#15803d">CONFIRMAÇÃO E DESAFIO: TESTE DE PROVOCAÇÃO ORAL (TPO)</text>
    <text x="500" y="596" text-anchor="middle" class="node-text">• O diagnóstico de certeza exige remissão dos sintomas durante a dieta de exclusão (2 a 4 semanas)</text>
    <text x="500" y="614" text-anchor="middle" class="node-text">• Seguido do Teste de Provocação Oral (TPO): reintrodução sob supervisão para comprovação causal</text>
    <text x="500" y="632" text-anchor="middle" class="node-text">• Se TPO positivo: manter dieta de exclusão estrita por 6 a 12 meses antes de nova tentativa</text>
    <text x="500" y="650" text-anchor="middle" class="node-text">• Prognóstico excelente: mais de 80 a 90% das crianças adquirem tolerância imunológica até os 3 a 5 anos</text>
  </g>


  <!-- Footer Notice -->
  <rect x="30" y="700" width="940" height="35" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="722" text-anchor="middle" class="subtitle" style="font-size: 11px;">Diretriz Oficial: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>