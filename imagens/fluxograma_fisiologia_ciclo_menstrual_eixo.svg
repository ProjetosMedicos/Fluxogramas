<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • ENDOCRINOLOGIA DA REPRODUÇÃO</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">FISIOLOGIA DO EIXO HHO &amp; TEORIA DAS DUAS CÉLULAS E DUAS GONADOTROFINAS</text>
  <text x="970" y="45" fill="#cbd5e1" font-size="13" font-weight="500" text-anchor="end">Cap. 1 a 3, 6 a 8 FEBRASGO • Yen &amp; Jaffe</text>

  <!-- Top Node: Hipotálamo &amp; Hipófise -->
  <rect x="150" y="85" width="700" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="108" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">HIPOTÁLAMO (NÚCLEO ARQUEADO) &amp; HIPÓFISE ANTERIOR (ADENO-HIPÓFISE)</text>
  <text x="500" y="128" font-size="11" fill="#475569" text-anchor="middle">GnRH pulsátil (alta frequência estimula LH; baixa frequência estimula FSH) → Liberação de Gonadotrofinas Hipofisárias</text>

  <!-- Linhas para as duas células -->
  <path d="M 330 145 L 250 175" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 670 145 L 750 175" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloco Célula da Teca (Externa) -->
  <rect x="40" y="180" width="430" height="235" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="180" width="430" height="28" rx="8" fill="#e11d48"/>
  <text x="255" y="199" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">CÉLULA DA TECA (EXTERNA) • RECEPTOR DE LH</text>

  <text x="55" y="228" font-size="11" font-weight="800" fill="#9f1239">1. Estímulo Exclusivo do LH:</text>
  <text x="55" y="244" font-size="10" fill="#475569">• Ligação do LH ao seu receptor de membrana acoplado à Proteína Gs</text>
  <text x="55" y="258" font-size="10" fill="#475569">• Ativação da Adenilato ciclase → Aumento de AMP cíclico (AMPc) e PKA</text>

  <text x="55" y="280" font-size="11" font-weight="800" fill="#9f1239">2. Captação de Colesterol &amp; Proteína StAR:</text>
  <text x="55" y="296" font-size="10" fill="#475569">• Entrada de colesterol LDL e transporte mitocondrial via proteína StAR</text>
  <text x="55" y="310" font-size="10" fill="#475569">• Clivagem da cadeia lateral pela enzima CYP11A1 (desmolase) → Pregnenolona</text>

  <text x="55" y="334" font-size="11" font-weight="800" fill="#9f1239">3. Síntese Androgênica (Ausência de Aromatase):</text>
  <text x="55" y="350" font-size="10" font-weight="700" fill="#0f172a">• Pregnenolona → 17-OH-Pregnenolona → Androstenediona &amp; Testosterona</text>
  <text x="55" y="366" font-size="10" fill="#be123c">A teca NÃO sintetiza estrogênios diretamente; difunde androgênios para a granulosa</text>

  <!-- Seta de Difusão Transmembrana de Androgênios -->
  <line x1="470" y1="295" x2="525" y2="295" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="475" y="270" width="50" height="20" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="500" y="284" font-size="9" font-weight="800" fill="#b45309" text-anchor="middle">ANDROG</text>

  <!-- Bloco Célula da Granulosa (Interna) -->
  <rect x="530" y="180" width="430" height="235" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="530" y="180" width="430" height="28" rx="8" fill="#0284c7"/>
  <text x="745" y="199" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">CÉLULA DA GRANULOSA (INTERNA) • RECEPTOR DE FSH</text>

  <text x="545" y="228" font-size="11" font-weight="800" fill="#0369a1">1. Estímulo Primário do FSH:</text>
  <text x="545" y="244" font-size="10" fill="#475569">• Ligação do FSH ao receptor → cascata do AMPc intracelular</text>
  <text x="545" y="258" font-size="10" fill="#475569">• Expressão e ativação da enzima Aromatase (complexo CYP19A1)</text>

  <text x="545" y="280" font-size="11" font-weight="800" fill="#0369a1">2. Aromatização dos Androgênios Tecais:</text>
  <text x="545" y="296" font-size="10" font-weight="700" fill="#0f172a">• Androstenediona tecal → Aromatizada em ESTRONA (E1)</text>
  <text x="545" y="310" font-size="10" font-weight="700" fill="#0f172a">• Testosterona tecal → Aromatizada em 17-β-ESTRADIOL (E2)</text>

  <text x="545" y="334" font-size="11" font-weight="800" fill="#0369a1">3. Síntese de Inibinas &amp; Seleção Folicular:</text>
  <text x="545" y="350" font-size="10" fill="#475569">• Produção de Inibina B (feedback negativo no FSH) e receptores de LH</text>
  <text x="545" y="366" font-size="10" fill="#0369a1">Folículo dominante selecionado: maior concentração de aromatase e E2</text>

  <!-- 3 Caixas das Fases Integradas do Ciclo Menstrual -->
  <rect x="40" y="430" width="290" height="165" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="430" width="290" height="26" rx="8" fill="#8b5cf6"/>
  <text x="185" y="448" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1. FASE FOLICULAR / PROLIFERATIVA</text>
  <text x="52" y="472" font-size="10" font-weight="700" fill="#6d28d9">• D1 ao D14 (duração variável):</text>
  <text x="52" y="488" font-size="9" fill="#475569">Recrutamento folicular FSH-dependente</text>
  <text x="52" y="502" font-size="9" fill="#475569">Seleção do folículo dominante de Graaf</text>
  <text x="52" y="516" font-size="9" fill="#475569">Elevação exponencial do Estradiol (E2)</text>
  <text x="52" y="532" font-size="10" font-weight="700" fill="#6d28d9">• Endométrio Proliferativo:</text>
  <text x="52" y="546" font-size="9" fill="#475569">Mitoses glandulares, estroma denso</text>
  <text x="52" y="560" font-size="9" fill="#475569">Aspecto trilaminar ao ultrassom</text>

  <rect x="355" y="430" width="290" height="165" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="355" y="430" width="290" height="26" rx="8" fill="#d97706"/>
  <text x="500" y="448" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2. PICO OVULATÓRIO DE LH (D14)</text>
  <text x="367" y="472" font-size="10" font-weight="700" fill="#b45309">• Gatilho Fisiológico Central:</text>
  <text x="367" y="488" font-size="9" fill="#475569">Estradiol &gt; 200 pg/mL por &gt; 36 a 48h</text>
  <text x="367" y="502" font-size="9" fill="#475569">converte feedback negativo em POSITIVO</text>
  <text x="367" y="516" font-size="9" font-weight="700" fill="#0f172a">Surto maciço de LH hipofisário</text>
  <text x="367" y="532" font-size="10" font-weight="700" fill="#b45309">• Ovulação Mecânica:</text>
  <text x="367" y="546" font-size="9" fill="#475569">Ocorre 32-36h após início da subida do LH</text>
  <text x="367" y="560" font-size="9" fill="#475569">(10-12h após o pico máximo de LH)</text>

  <rect x="670" y="430" width="290" height="165" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="430" width="290" height="26" rx="8" fill="#16a34a"/>
  <text x="815" y="448" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3. FASE LÚTEA / SECRETORA</text>
  <text x="682" y="472" font-size="10" font-weight="700" fill="#15803d">• D15 ao D28 (duração fixa: 14 dias):</text>
  <text x="682" y="488" font-size="9" fill="#475569">Luteinização das células da teca e granulosa</text>
  <text x="682" y="502" font-size="9" fill="#475569">Formação do Corpo Lúteo (Progesterona &gt; E2)</text>
  <text x="682" y="516" font-size="9" fill="#475569">Pico de Progesterona no D21 (7 dias pós-ovulação)</text>
  <text x="682" y="532" font-size="10" font-weight="700" fill="#15803d">• Luteólise &amp; Menstruação:</text>
  <text x="682" y="546" font-size="9" fill="#475569">Sem β-hCG embrionário → Luteólise</text>
  <text x="682" y="560" font-size="9" fill="#475569">Queda de progesterona → Descamação</text>

  <!-- Rodapé -->
  <rect x="40" y="610" width="920" height="52" rx="8" fill="#0f172a" filter="url(#shadow)"/>
  <text x="500" y="630" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">LEI FISIOLÓGICA BASILAR DO CICLO MENSTRUAL</text>
  <text x="500" y="648" font-size="10" fill="#f8fafc" text-anchor="middle">A fase folicular possui duração fisiológica variável; a fase lútea possui duração estritamente fixa de 14 dias (vida útil do corpo lúteo)</text>
</svg>