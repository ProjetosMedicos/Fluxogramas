<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="940" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">CLASSIFICAÇÃO MOLECULAR &amp; ESTADIAMENTO FIGO 2023 NO CÂNCER DE ENDOMÉTRIO</text>
  <text x="910" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FIGO 2023 &amp; Consenso ESGO/ESTRO/ESP</text>

  <!-- Content -->
  
    <rect x="270" y="95" width="400" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="120" font-size="15" font-weight="800" fill="#5b21b6" text-anchor="middle">CARCINOMA DE ENDOMÉTRIO CONFIRMADO</text>
    <text x="470" y="140" font-size="12" fill="#6d28d9" text-anchor="middle">Testagem Molecular Obrigatória Integrada ao Estadiamento Clínico-Cirúrgico</text>

    <!-- 4 Subtipos Moleculares -->
    <rect x="30" y="180" width="205" height="420" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="132" y="210" font-size="13" font-weight="800" fill="#065f46" text-anchor="middle">1. POLEmut</text>
    <text x="132" y="228" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">POLE Ultramutado</text>
    <text x="45" y="260" font-size="11" fill="#064e3b">• Prevalência: 7-10%</text>
    <text x="45" y="280" font-size="11" fill="#064e3b">• Pacientes jovens</text>
    <text x="45" y="300" font-size="11" fill="#064e3b">• Tumores de alto grau</text>
    <text x="45" y="320" font-size="11" fill="#064e3b">histológico aparente,</text>
    <text x="45" y="338" font-size="11" fill="#064e3b">mas comportamento</text>
    <text x="45" y="356" font-size="11" fill="#064e3b">altamente favorável.</text>
    <text x="45" y="390" font-size="12" font-weight="800" fill="#059669">PROGNÓSTICO:</text>
    <text x="45" y="410" font-size="12" font-weight="800" fill="#047857">EXCELENTE</text>
    <text x="45" y="440" font-size="11" fill="#064e3b">• Descalonamento de</text>
    <text x="45" y="458" font-size="11" fill="#064e3b">quimioterapia adjuvante</text>
    <text x="45" y="476" font-size="11" fill="#064e3b">nos estádios I e II.</text>

    <rect x="255" y="180" width="205" height="420" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="357" y="210" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">2. MMRd / MSI-H</text>
    <text x="357" y="228" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Instabilidade Microssatélite</text>
    <text x="270" y="260" font-size="11" fill="#1e3a8a">• Prevalência: 25-30%</text>
    <text x="270" y="280" font-size="11" fill="#1e3a8a">• Perda de MLH1, PMS2,</text>
    <text x="270" y="298" font-size="11" fill="#1e3a8a">MSH2 ou MSH6</text>
    <text x="270" y="325" font-size="11" fill="#1e3a8a">• Rastreio mandatória</text>
    <text x="270" y="343" font-size="11" fill="#1e3a8a">para <tspan font-weight="bold">Síndrome de Lynch</tspan></text>
    <text x="270" y="390" font-size="12" font-weight="800" fill="#2563eb">PROGNÓSTICO:</text>
    <text x="270" y="410" font-size="12" font-weight="800" fill="#1d4ed8">INTERMEDIÁRIO</text>
    <text x="270" y="440" font-size="11" fill="#1e3a8a">• Excelente resposta à</text>
    <text x="270" y="458" font-size="11" fill="#1e3a8a"><tspan font-weight="bold">Imunoterapia</tspan></text>
    <text x="270" y="476" font-size="11" fill="#1e3a8a">(Anti-PD-1 / Pembrolizumabe)</text>

    <rect x="480" y="180" width="205" height="420" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
    <text x="582" y="210" font-size="13" font-weight="800" fill="#6b21a8" text-anchor="middle">3. NSMP</text>
    <text x="582" y="228" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">Sem Perfil Específico</text>
    <text x="495" y="260" font-size="11" fill="#581c87">• Prevalência: 45-50%</text>
    <text x="495" y="280" font-size="11" fill="#581c87">• Maioria endometrioide</text>
    <text x="495" y="298" font-size="11" fill="#581c87">grau 1 e 2</text>
    <text x="495" y="325" font-size="11" fill="#581c87">• Receptores de estrogênio</text>
    <text x="495" y="343" font-size="11" fill="#581c87">e progesterona (RE/RP +)</text>
    <text x="495" y="390" font-size="12" font-weight="800" fill="#9333ea">PROGNÓSTICO:</text>
    <text x="495" y="410" font-size="12" font-weight="800" fill="#7e22ce">INTERMEDIÁRIO-BOM</text>
    <text x="495" y="440" font-size="11" fill="#581c87">• Decisão adjuvante por</text>
    <text x="495" y="458" font-size="11" fill="#581c87">invasão miometrial (&#8805; 50%)</text>
    <text x="495" y="476" font-size="11" fill="#581c87">e invasão vascular (LVSI)</text>

    <rect x="705" y="180" width="205" height="420" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="807" y="210" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">4. p53abn</text>
    <text x="807" y="228" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">p53 Anormal / Mutado</text>
    <text x="720" y="260" font-size="11" fill="#7f1d1d">• Prevalência: 10-15%</text>
    <text x="720" y="280" font-size="11" fill="#7f1d1d">• Carcinomas serosos,</text>
    <text x="720" y="298" font-size="11" fill="#7f1d1d">carcinossarcomas e</text>
    <text x="720" y="316" font-size="11" fill="#7f1d1d">endometrioides grau 3</text>
    <text x="720" y="343" font-size="11" fill="#7f1d1d">• Alta taxa de metástase</text>
    <text x="720" y="390" font-size="12" font-weight="800" fill="#dc2626">PROGNÓSTICO:</text>
    <text x="720" y="410" font-size="12" font-weight="800" fill="#b91c1c">DESFAVORÁVEL</text>
    <text x="720" y="440" font-size="11" fill="#7f1d1d">• Quimioterapia adjuvante</text>
    <text x="720" y="458" font-size="11" fill="#7f1d1d">sistêmica + Radioterapia</text>
    <text x="720" y="476" font-size="11" fill="#7f1d1d">mandatória em quase todos</text>
    

  <!-- Footer -->
  <line x1="30" y1="605" x2="910" y2="605" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="622" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • FIGO • IOTA • OMS</text>
  <text x="910" y="622" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>