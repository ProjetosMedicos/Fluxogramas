ient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"><path d="M293,101L293,105.167C293,109.333,293,117.667,293,125.333C293,133,293,140,293,143.5L293,147" id="mermaid-svg-L_A_B_0" class=" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_A_B_0" data-points="W3sieCI6MjkzLCJ5IjoxMDF9LHsieCI6MjkzLCJ5IjoxMjZ9LHsieCI6MjkzLCJ5IjoxNTF9XQ==" data-look="classic" marker-end="url(#mermaid-svg_flowchart-v2-pointEnd)"/><path d="M230.448,360.448L215.04,378.54C199.632,396.632,168.816,432.816,153.408,459.658C138,486.5,138,504,138,512.75L138,521.5" id="mermaid-svg-L_B_C_0" class=" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_B_C_0" data-points="W3sieCI6MjMwLjQ0ODA3MTIxNjYxNzIyLCJ5IjozNjAuNDQ4MDcxMjE2NjE3Mn0seyJ4IjoxMzgsInkiOjQ2OX0seyJ4IjoxMzgsInkiOjUyNS41fV0=" data-look="classic" marker-end="url(#mermaid-svg_flowchart-v2-pointEnd)"/><path d="M355.552,360.448L370.96,378.54C386.368,396.632,417.184,432.816,432.592,457.908C448,483,448,497,448,504L448,511" id="mermaid-svg-L_B_D_0" class=" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_B_D_0" data-points="W3sieCI6MzU1LjU1MTkyODc4MzM4MjgsInkiOjM2MC40NDgwNzEyMTY2MTcyfSx7IngiOjQ0OCwieSI6NDY5fSx7IngiOjQ0OCwieSI6NTE1fV0=" data-look="classic" marker-end="url(#mermaid-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_A_B_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(138, 469)"><g class="label" data-id="L_B_C_0" transform="translate(-100, -21)"><foreignObject width="200" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Cirurgia da Mama - Tumor Primário</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(448, 469)"><g class="label" data-id="L_B_D_0" transform="translate(-100, -21)"><foreignObject width="200" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Abordagem da Axila - Linfonodos</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="mermaid-svg-flowchart-A-0" data-look="classic" transform="translate(293, 54.5)"><rect class="basic label-container" style="" x="-130" y="-46.5" width="260" height="93"/><g class="label" style="" transform="translate(-100, -31.5)"><rect/><foreignObject width="200" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><b>Conduta Cirúrgica e Locorregional no Câncer de Mama</b></p></span></div></foreignObject></g></g><g class="node default dec " id="mermaid-svg-flowchart-B-1" data-look="classic" transform="translate(293, 287)"><polygon points="136,0 272,-136 136,-272 0,-136" class="label-container" transform="translate(-135.5, 136)" style="fill:#fef3c7 !important;stroke:#d97706 !important;stroke-width:2px !important"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -21)"><rect/><foreignObject width="200" height="42"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><b>Decisões Clínicas Integradas</b></p></span></div></foreignObject></g></g><g class="node default act " id="mermaid-svg-flowchart-C-3" data-look="classic" transform="translate(138, 803)"><rect class="basic label-container" style="fill:#f0fdf4 !important;stroke:#16a34a !important;stroke-width:2px !important" x="-130" y="-277.5" width="260" height="555"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -262.5)"><rect/><foreignObject width="200" height="525"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><b>Mama: Conservadora vs Mastectomia:</b><br />• <b>Cirurgia Conservadora (Setorectomia / Quadrantectomia):</b> Indicada se relação tumor/mama favorável. <i>Sobrevida idêntica à mastectomia (Milão / NSABP B-06)</i>. <b>Radioterapia adjuvante na mama é SEMPRE OBRIGATÓRIA!</b><br />• <b>Mastectomia (Preservadora de Pele ou CAP):</b> Indicada em tumores multicêntricos, microcalcificações difusas ou contraindicação a RT. Sempre associar reconstrução mamária imediata (direito por lei). <i>RT pós-mastectomia se tumor &gt; 5 cm ou ≥ 4 linfonodos</i>.</p></span></div></foreignObject></g></g><g class="node default alert " id="mermaid-svg-flowchart-D-5" data-look="classic" transform="translate(448, 803)"><rect class="basic label-container" style="fill:#fee2e2 !important;stroke:#dc2626 !important;stroke-width:2px !important" x="-130" y="-288" width="260" height="576"/><g class="label" style="font-size:14px !important;color:#991b1b !important" transform="translate(-100, -273)"><rect/><foreignObject width="200" height="546"><div style="font-size: 14px !important; color: rgb(153, 27, 27) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#991b1b !important" class="nodeLabel "><p><b>Axila: Linfonodo Sentinela vs Linfadenectomia:</b><br />• <b>Axila Clinicamente Negativa (cN0):</b> Realizar <b>Biópsia de Linfonodo Sentinela (BLS)</b> com corante azul e/ou tecnécio-99m. Se LS negativo: NÃO esvaziar a axila.<br />• <b>Critérios de ACOSOG Z0011:</b> Se 1 a 2 LS positivos em cirurgia conservadora + RT tangente planejada + terapia sistêmica: <b>OMITIR esvaziamento axilar radical!</b> (Sem impacto em sobrevida, reduzindo linfedema).<br />• <b>Linfadenectomia Axilar (Níveis I e II):</b> Indicada se ≥ 3 LS positivos, axila clinicamente positiva persistente ou carcinoma inflamatório.</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mermaid-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mermaid-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>