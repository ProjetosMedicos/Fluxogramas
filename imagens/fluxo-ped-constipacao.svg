<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradConst" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="shadowC" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="920" height="620" fill="#f8fafc" rx="12" />

  <rect x="20" y="20" width="880" height="55" rx="8" fill="url(#gradConst)" filter="url(#shadowC)" />
  <text x="460" y="44" fill="#ffffff" font-size="17" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">ALGORITMO DE CONSTIPAÇÃO INTESTINAL FUNCIONAL (SBP / ROMA IV 2024)</text>
  <text x="460" y="62" fill="#fef3c7" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Descarte de Causas Orgânicas (Hirschsprung), Desimpactação com PEG &amp; Manutenção</text>

  <!-- Nó Inicial -->
  <rect x="260" y="95" width="400" height="50" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2" filter="url(#shadowC)" />
  <text x="460" y="117" fill="#0f172a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Criança com Dificuldade / Dor para Evacuar ou Retenção</text>
  <text x="460" y="133" fill="#475569" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">História de fezes endurecidas, dor, escape fecal (encoprese) ou intervalo &gt; 3-4 dias</text>

  <line x1="460" y1="145" x2="460" y2="175" stroke="#64748b" stroke-width="2" />
  <polygon points="455,173 465,173 460,180" fill="#64748b" />

  <!-- Triagem de Sinais de Alarme (Hirschsprung) -->
  <polygon points="460,180 650,225 460,270 270,225" fill="#fef08a" stroke="#ca8a04" stroke-width="2" filter="url(#shadowC)" />
  <text x="460" y="219" fill="#854d0e" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Sinais de Alarme para Causa Orgânica?</text>
  <text x="460" y="235" fill="#a16207" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">Atraso mecônio (&gt;48h), vômito bilioso, ampola vazia com saída explosiva, febre</text>

  <!-- Braço SIM: Orgânico -->
  <line x1="650" y1="225" x2="770" y2="225" stroke="#dc2626" stroke-width="2" />
  <line x1="770" y1="225" x2="770" y2="295" stroke="#dc2626" stroke-width="2" />
  <polygon points="765,293 775,293 770,300" fill="#dc2626" />
  <text x="705" y="217" fill="#dc2626" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">SIM</text>

  <rect x="650" y="300" width="240" height="290" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadowC)" />
  <text x="770" y="325" fill="#991b1b" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">SUSPEITA ORGÂNICA</text>
  <text x="770" y="350" fill="#b91c1c" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">• Doença de Hirschsprung:</text>
  <text x="770" y="368" fill="#475569" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Megacólon aganglionar congênito</text>
  <text x="770" y="384" fill="#475569" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Biópsia retal por sucção (ausência</text>
  <text x="770" y="400" fill="#475569" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">de células ganglionares e AChE+)</text>
  <text x="770" y="425" fill="#b91c1c" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">• Fibrose Cística / Hipotireoidismo</text>
  <text x="770" y="450" fill="#b91c1c" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">• Espinha Bífida / Medula Presa</text>
  <text x="770" y="475" fill="#b91c1c" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">• Alergia Alimentar (APLV)</text>
  <text x="770" y="500" fill="#b91c1c" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">• Estenose / Ânus Anteriorizado</text>
  <text x="770" y="540" fill="#991b1b" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Encaminhar ao Cirurgião /</text>
  <text x="770" y="556" fill="#991b1b" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Gastropediatra para Biópsia</text>

  <!-- Braço NÃO: Constipação Funcional -->
  <line x1="270" y1="225" x2="160" y2="225" stroke="#16a34a" stroke-width="2" />
  <line x1="160" y1="225" x2="160" y2="295" stroke="#16a34a" stroke-width="2" />
  <polygon points="155,293 165,293 160,300" fill="#16a34a" />
  <text x="210" y="217" fill="#16a34a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">NÃO (&gt; 95%)</text>

  <rect x="30" y="300" width="260" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadowC)" />
  <text x="160" y="324" fill="#166534" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Constipação Funcional (Roma IV)</text>
  <text x="160" y="342" fill="#15803d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Investigar fecaloma palpável em FIE ou ampola</text>
  <text x="160" y="356" fill="#15803d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Presença de Impactação Fecal?</text>

  <!-- Linha para etapas -->
  <line x1="160" y1="370" x2="160" y2="395" stroke="#16a34a" stroke-width="2" />
  <polygon points="155,393 165,393 160,400" fill="#16a34a" />

  <rect x="30" y="400" width="260" height="90" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadowC)" />
  <text x="160" y="420" fill="#0369a1" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">ETAPA 1: DESIMPACTAÇÃO</text>
  <text x="160" y="438" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">1ª Escolha: Polietilenoglicol (PEG 4000)</text>
  <text x="160" y="454" fill="#0284c7" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">1,0 a 1,5 g/kg/dia por 3 a 6 dias</text>
  <text x="160" y="472" fill="#475569" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Alternativa: Enema fosfatado / glicerina retal</text>

  <line x1="160" y1="490" x2="160" y2="510" stroke="#0284c7" stroke-width="2" />
  <polygon points="155,508 165,508 160,515" fill="#0284c7" />

  <rect x="30" y="515" width="260" height="85" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadowC)" />
  <text x="160" y="535" fill="#166534" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">ETAPA 2: MANUTENÇÃO LAXATIVA</text>
  <text x="160" y="553" fill="#334155" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="middle">PEG 4000: 0,4 a 0,8 g/kg/dia por 2 a 6 meses</text>
  <text x="160" y="569" fill="#15803d" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Desmame lento apenas após meses sem dor</text>
  <text x="160" y="585" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif" text-anchor="middle">Alternativa: Lactulose 1-2 mL/kg/dia</text>

  <!-- Caixa Central: Medidas Não Farmacológicas -->
  <rect x="320" y="300" width="300" height="290" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#shadowC)" />
  <text x="470" y="325" fill="#0f172a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">PILAR NÃO FARMACOLÓGICO MANDATÓRIO</text>
  <text x="470" y="352" fill="#0369a1" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">1. Treinamento de Hábitos e Posicionamento:</text>
  <text x="470" y="370" fill="#334155" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Sentar no vaso 5 a 10 min pós-refeições (reflexo)</text>
  <text x="470" y="388" fill="#0284c7" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">• APOIO PARA OS PÉS FUNDAMENTAL</text>
  <text x="470" y="404" fill="#475569" font-size="9.5" font-family="system-ui, sans-serif" text-anchor="middle">(Flexão de quadril retifica ângulo anorretal)</text>

  <text x="470" y="432" fill="#0369a1" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">2. Fibras e Hidratação Adequada:</text>
  <text x="470" y="450" fill="#334155" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Regra de ingestão de fibras: Idade + 5 gramas/dia</text>
  <text x="470" y="468" fill="#334155" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Estimular água, frutas com casca e legumes</text>
  <text x="470" y="486" fill="#dc2626" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Fibras NÃO resolvem sem laxativo na fase aguda!</text>

  <text x="470" y="516" fill="#0369a1" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">3. Desmistificação &amp; Apoio Psicológico:</text>
  <text x="470" y="534" fill="#334155" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Não punir a criança pelo escape (encoprese)</text>
  <text x="470" y="552" fill="#334155" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Interromper o ciclo: Dor $ightarrow$ Retenção $ightarrow$ Fecaloma</text>
  <text x="470" y="574" fill="#0284c7" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Tratado de Pediatria SBP 6ª Ed. (2024)</text>
</svg>