<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="940" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">MANEJO DE PROCESSOS INFLAMATÓRIOS E INFECCIOSOS DA MAMA</text>
  <text x="910" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 82 • Diretrizes de Mastologia</text>

  <!-- Content -->
  
    <rect x="270" y="95" width="400" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="120" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">SINAIS FLOGÍSTICOS MAMÁRIOS (DOR, CALOR, RUBOR)</text>
    <text x="470" y="140" font-size="11" fill="#b91c1c" text-anchor="middle">Diferenciação Crítica: Mastite Puerperal (Lactacional) vs Não Puerperal</text>

    <path d="M 370 155 L 230 205" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 570 155 L 710 205" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Coluna Puerperal -->
    <rect x="50" y="215" width="360" height="380" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="230" y="245" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">MASTITE PUERPERAL AGUDA</text>
    <text x="230" y="265" font-size="11" fill="#15803d" text-anchor="middle">Etiologia: Staphylococcus aureus (porta de entrada: fissura mamilar)</text>

    <text x="70" y="300" font-size="12" font-weight="700" fill="#14532d">• Medida Primária e Essencial:</text>
    <text x="80" y="320" font-size="11" font-weight="800" fill="#15803d">MANTER A AMAMENTAÇÃO / ESVAZIAMENTO</text>
    <text x="80" y="338" font-size="11" fill="#166534">Não suspender o aleitamento! O esvaziamento contínuo</text>
    <text x="80" y="356" font-size="11" fill="#166534">previne a estase e a formação de abscesso.</text>

    <text x="70" y="390" font-size="12" font-weight="700" fill="#14532d">• Antibioticoterapia Oral (10 a 14 dias):</text>
    <text x="80" y="410" font-size="11" fill="#166534"><tspan font-weight="bold">Cefalexina 500 mg VO 6/6h</tspan> OU</text>
    <text x="80" y="428" font-size="11" fill="#166534"><tspan font-weight="bold">Amoxicilina + Clavulanato 875/125 mg VO 12/12h</tspan></text>

    <text x="70" y="460" font-size="12" font-weight="700" fill="#b91c1c">• Suspeita de Abscesso Mamário (Flutuação):</text>
    <text x="80" y="480" font-size="11" fill="#991b1b">Ecografia mamária mandatória.</text>
    <text x="80" y="498" font-size="11" fill="#7f1d1d">Padrão-ouro: <tspan font-weight="bold">Punções ecoguiadas repetidas</tspan> com agulha grossa</text>
    <text x="80" y="516" font-size="11" fill="#7f1d1d">associadas a antibiótico (evita cicatriz e deformidade da incisão).</text>

    <!-- Coluna Nao Puerperal -->
    <rect x="530" y="215" width="360" height="380" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="710" y="245" font-size="14" font-weight="800" fill="#78350f" text-anchor="middle">MASTITE NÃO PUERPERAL / PERIDUCTAL</text>
    <text x="710" y="265" font-size="11" fill="#92400e" text-anchor="middle">Etiologia: Ectasia ductal + Anaeróbios em tabagistas</text>

    <text x="550" y="300" font-size="12" font-weight="700" fill="#78350f">• Fator de Risco Principal: TABAGISMO</text>
    <text x="560" y="320" font-size="11" fill="#92400e">Necrose epitelial ductal subareolar induzida por fumo,</text>
    <text x="560" y="338" font-size="11" fill="#92400e">obstrução por plugue de queratina e infecção mista.</text>

    <text x="550" y="375" font-size="12" font-weight="700" fill="#78350f">• Esquema Antimicrobiano de Amplo Espectro:</text>
    <text x="560" y="395" font-size="11" fill="#92400e"><tspan font-weight="bold">Amoxicilina-Clavulanato 875/125 mg VO 12/12h</tspan> OU</text>
    <text x="560" y="413" font-size="11" fill="#92400e"><tspan font-weight="bold">Clindamicina 300 mg VO 6/6h</tspan> por 14 dias.</text>

    <text x="550" y="450" font-size="12" font-weight="700" fill="#b91c1c">• Abscesso Subareolar Recidivante / Fístula:</text>
    <text x="560" y="470" font-size="11" fill="#991b1b">Alta taxa de cronicidade e recidiva.</text>
    <text x="560" y="488" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">Tratamento Definitivo:</tspan> Cessação do tabagismo +</text>
    <text x="560" y="506" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">Ressecção cirúrgica de todos os ductos subareolares</tspan></text>
    <text x="560" y="524" font-size="11" fill="#7f1d1d">(Cirurgia de Hadfield / Urban) em fase quiescente.</text>
    

  <!-- Footer -->
  <line x1="30" y1="605" x2="910" y2="605" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="622" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • SBM • FIGO • ISSVD</text>
  <text x="910" y="622" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>