<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • MEDICINA REPRODUTIVA &amp; OBSTETRÍCIA</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">INVESTIGAÇÃO SISTEMATIZADA DA PERDA GESTACIONAL RECORRENTE (PGR)</text>
  <text x="970" y="45" fill="#cbd5e1" font-size="13" font-weight="500" text-anchor="end">Cap. 53 e 61 FEBRASGO • ASRM • Critérios de Sydney</text>

  <!-- Top Node -->
  <rect x="180" y="85" width="640" height="55" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="108" font-size="13" font-weight="800" fill="#9f1239" text-anchor="middle">PERDA GESTACIONAL RECORRENTE (PGR): ≥ 2 PERDAS GESTACIONAIS CONSECUTIVAS</text>
  <text x="500" y="127" font-size="11" fill="#be123c" text-anchor="middle">Definição contemporânea de consenso ASRM / ESHRE • Avaliação estruturada de ambos os cônjuges</text>

  <!-- Linha -->
  <line x1="500" y1="140" x2="500" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 Colunas Diagnósticas -->
  <rect x="25" y="175" width="225" height="420" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="25" y="175" width="225" height="26" rx="8" fill="#e11d48"/>
  <text x="137" y="193" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">1. SAAF (CAUSA ADQUIRIDA)</text>
  <text x="35" y="218" font-size="10" font-weight="800" fill="#9f1239">Critérios Sydney de SAAF:</text>
  <text x="35" y="234" font-size="9" fill="#475569">• ≥ 3 perdas &lt; 10 semanas OU</text>
  <text x="35" y="248" font-size="9" fill="#475569">• ≥ 1 perda morfológica ≥ 10 sem OU</text>
  <text x="35" y="262" font-size="9" fill="#475569">• Parto prematuro &lt; 34 sem por PE grave</text>

  <text x="35" y="288" font-size="10" font-weight="800" fill="#9f1239">Anticorpos (2x c/ intervalo ≥ 12 sem):</text>
  <text x="35" y="304" font-size="9" font-weight="700" fill="#0f172a">• Anticoagulante Lúpico (LAC)</text>
  <text x="35" y="318" font-size="9" font-weight="700" fill="#0f172a">• Anticardiolipina (aCL) IgG/IgM</text>
  <text x="35" y="332" font-size="9" font-weight="700" fill="#0f172a">• Anti-β2-glicoproteína I IgG/IgM</text>

  <rect x="33" y="360" width="209" height="150" rx="6" fill="#fecdd3"/>
  <text x="137" y="380" font-size="10" font-weight="800" fill="#9f1239" text-anchor="middle">Tratamento na Gestação:</text>
  <text x="40" y="400" font-size="9" font-weight="700" fill="#0f172a">• AAS 100 mg/dia</text>
  <text x="40" y="414" font-size="8" fill="#475569">  (iniciar pré-concepção)</text>
  <text x="40" y="432" font-size="9" font-weight="700" fill="#0f172a">• Enoxaparina 40 mg/dia SC</text>
  <text x="40" y="446" font-size="8" fill="#475569">  (iniciar com saco gestacional)</text>
  <text x="40" y="460" font-size="8" fill="#475569">  manter até 6 sem pós-parto</text>
  <text x="40" y="482" font-size="9" font-weight="800" fill="#9f1239">Nascidos vivos &gt; 75-80%</text>

  <!-- Coluna 2: Fatores Anatômicos Uterinos -->
  <rect x="265" y="175" width="225" height="420" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="265" y="175" width="225" height="26" rx="8" fill="#0284c7"/>
  <text x="377" y="193" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">2. FATORES ANATÔMICOS</text>
  <text x="275" y="218" font-size="10" font-weight="800" fill="#0369a1">Exames Propedêuticos:</text>
  <text x="275" y="234" font-size="9" fill="#475569">• Histeroscopia diagnóstica ambulatorial</text>
  <text x="275" y="248" font-size="9" fill="#475569">• Ultrassonografia pélvica 3D / RNM</text>

  <text x="275" y="278" font-size="10" font-weight="800" fill="#0369a1">Etiologias Anatômicas:</text>
  <text x="275" y="294" font-size="9" font-weight="700" fill="#0f172a">• Útero Septado (Mais prevalente):</text>
  <text x="275" y="308" font-size="8" fill="#475569">  Septo avascular = falha nidação</text>
  <text x="275" y="322" font-size="8" font-weight="700" fill="#0284c7">  → Septoplastia Histeroscópica</text>
  <text x="275" y="342" font-size="9" font-weight="700" fill="#0f172a">• Sinéquias Intrauterinas:</text>
  <text x="275" y="356" font-size="8" fill="#475569">  Síndrome de Asherman pós-curetagem</text>
  <text x="275" y="376" font-size="9" font-weight="700" fill="#0f172a">• Mioma Submucoso / Pólipos:</text>
  <text x="275" y="390" font-size="8" fill="#475569">  Interferência mecânica e inflamatória</text>
  <text x="275" y="410" font-size="9" font-weight="700" fill="#0f172a">• Incompetência Cervicoistímica:</text>
  <text x="275" y="424" font-size="8" fill="#475569">  Perdas tardias (2º tri) sem contração</text>
  <text x="275" y="438" font-size="8" font-weight="700" fill="#0369a1">  → Cerclagem eletiva com 12-14 sem</text>

  <!-- Coluna 3: Fatores Genéticos do Casal -->
  <rect x="505" y="175" width="225" height="420" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="505" y="175" width="225" height="26" rx="8" fill="#8b5cf6"/>
  <text x="617" y="193" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">3. GENÉTICA DO CASAL</text>
  <text x="515" y="218" font-size="10" font-weight="800" fill="#6d28d9">Cariótipo do Casal com Bandas:</text>
  <text x="515" y="234" font-size="9" fill="#475569">• Rastreio de aberrações cromossômicas</text>
  <text x="515" y="248" font-size="9" fill="#475569">  balanceadas em ambos os pais (3 a 5%)</text>
  <text x="515" y="268" font-size="9" font-weight="700" fill="#0f172a">• Translocação Recíproca</text>
  <text x="515" y="286" font-size="9" font-weight="700" fill="#0f172a">• Translocação Robertsoniana</text>
  <text x="515" y="300" font-size="9" fill="#475569">  (comum entre cromossomos 13, 14, 15, 21)</text>

  <text x="515" y="330" font-size="10" font-weight="800" fill="#6d28d9">Repercussão Reprodutiva:</text>
  <text x="515" y="346" font-size="9" fill="#475569">Segregação meiótica anormal gerando</text>
  <text x="515" y="360" font-size="9" fill="#475569">gametas desbalanceados com aneuploidias</text>
  <text x="515" y="374" font-size="9" fill="#475569">letais embrionárias precoces</text>

  <text x="515" y="405" font-size="10" font-weight="800" fill="#6d28d9">Conduta Especializada:</text>
  <text x="515" y="420" font-size="9" font-weight="700" fill="#0f172a">FIV com Teste Genético</text>
  <text x="515" y="434" font-size="9" font-weight="700" fill="#0f172a">Pré-Implantacional (PGT-SR)</text>
  <text x="515" y="448" font-size="9" fill="#475569">Seleção de embriões euploides</text>

  <!-- Coluna 4: Trombofilias &amp; Não Recomendados -->
  <rect x="745" y="175" width="230" height="420" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="745" y="175" width="230" height="26" rx="8" fill="#64748b"/>
  <text x="860" y="193" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">4. TROMBOFILIAS &amp; LIMITES</text>
  <text x="755" y="218" font-size="10" font-weight="800" fill="#334155">Trombofilias Hereditárias:</text>
  <text x="755" y="234" font-size="9" fill="#475569">• Mutação do Fator V de Leiden</text>
  <text x="755" y="248" font-size="9" fill="#475569">• Mutação do gene da Protrombina</text>
  <text x="755" y="262" font-size="9" fill="#475569">• Deficiência de Proteína C, S e AT-III</text>
  <text x="755" y="278" font-size="9" fill="#334155">Impacto principal: TEV materno (HBPM)</text>

  <text x="755" y="306" font-size="10" font-weight="800" fill="#334155">Endócrino-Metabólico:</text>
  <text x="755" y="322" font-size="9" fill="#475569">• TSH e T4L (meta TSH &lt; 2,5 mUI/L)</text>
  <text x="755" y="336" font-size="9" fill="#475569">• Glicemia de jejum / HbA1c</text>

  <rect x="752" y="365" width="216" height="150" rx="6" fill="#f1f5f9"/>
  <text x="860" y="385" font-size="9" font-weight="800" fill="#b91c1c" text-anchor="middle">NÃO RECOMENDADOS (CHOOSING WISELY):</text>
  <text x="760" y="405" font-size="8" fill="#475569">• Pesquisa de células NK periféricas</text>
  <text x="760" y="420" font-size="8" fill="#475569">• Tipagem HLA e crossmatch parental</text>
  <text x="760" y="435" font-size="8" fill="#475569">• Imunização com leucócitos paternos</text>
  <text x="760" y="450" font-size="8" fill="#475569">• Anticorpos antinucleares (FAN) de rotina</text>
  <text x="760" y="468" font-size="8" font-weight="700" fill="#b91c1c">Sem benefício comprovado em ensaios</text>

  <!-- Rodapé -->
  <rect x="25" y="610" width="950" height="52" rx="8" fill="#0f172a" filter="url(#shadow)"/>
  <text x="500" y="630" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">PROGNÓSTICO REPRODUTIVO GERAL</text>
  <text x="500" y="648" font-size="10" fill="#f8fafc" text-anchor="middle">Mesmo após 3 perdas idiopáticas consecutivas sem causa identificada, a chance de sucesso na próxima gestação com suporte de pré-natal cuidadoso supera 65 a 70%</text>
</svg>