<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="940" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">MANEJO CLÍNICO DO LÍQUEN ESCLEROSO VULVAR (LEV)</text>
  <text x="910" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">ISSVD &amp; FEBRASGO Cap. 38/77</text>

  <!-- Content -->
  
    <rect x="270" y="95" width="400" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="120" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">SUSPEITA DE LÍQUEN ESCLEROSO VULVAR</text>
    <text x="470" y="140" font-size="11" fill="#1d4ed8" text-anchor="middle">Prurido crônico intratável + placas branco-nacaradas em "figura em oito" perianal</text>

    <path d="M 470 155 L 470 195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="285" y="195" width="370" height="55" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="220" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">BIÓPSIA VULVAR COM PUNCH (3-4 mm)</text>
    <text x="470" y="238" font-size="11" fill="#475569" text-anchor="middle">Recomendada para confirmação histopatológica e afastar dVIN / Neoplasia</text>

    <path d="M 470 250 L 470 290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Protocolo Clobetasol -->
    <rect x="120" y="290" width="700" height="280" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="320" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">TRATAMENTO DE 1ª LINHA: PROPIONATO DE CLOBETASOL 0,05% POMADA</text>

    <text x="150" y="355" font-size="12" font-weight="700" fill="#14532d">Fase de Ataque (Indução de Remissão):</text>
    <text x="160" y="375" font-size="11" fill="#166534">• <tspan font-weight="bold">Mês 1:</tspan> Aplicar fina camada 1x ao dia à noite (30 dias);</text>
    <text x="160" y="393" font-size="11" fill="#166534">• <tspan font-weight="bold">Mês 2:</tspan> Aplicar em noites alternadas (3x por semana por 30 dias);</text>
    <text x="160" y="411" font-size="11" fill="#166534">• <tspan font-weight="bold">Mês 3:</tspan> Aplicar 2x por semana (manutenção inicial).</text>

    <text x="150" y="445" font-size="12" font-weight="700" fill="#14532d">Fase de Manutenção Contínua (Prevenção de Recidiva e Câncer):</text>
    <text x="160" y="465" font-size="11" fill="#166534">• Clobetasol pomada 1 a 2x por semana a longo prazo OU Tacrolimo 0,1% pomada;</text>
    <text x="160" y="483" font-size="11" fill="#166534">• Uso diário de emolientes e hidratantes neutros (óleo de coco / vaselina sólida);</text>
    <text x="160" y="501" font-size="11" fill="#b91c1c">• <tspan font-weight="bold">Alerta Oncológico:</tspan> Risco de 4-5% de Carcinoma Espinocelular de Vulva;</text>
    <text x="160" y="519" font-size="11" fill="#b91c1c">Exame clínico dermatológico vulvar semestral a anual obrigatório.</text>
    

  <!-- Footer -->
  <line x1="30" y1="585" x2="910" y2="585" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="602" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • SBM • FIGO • ISSVD</text>
  <text x="910" y="602" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>