<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCardio" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadowCardio" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="920" height="620" fill="#f8fafc" rx="8" />

  <!-- Cabeçalho -->
  <rect x="20" y="16" width="880" height="54" rx="6" fill="url(#gradCardio)" filter="url(#shadowCardio)" />
  <text x="40" y="42" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">ALGORITMO DECISÓRIO: CARDIOPATIAS CONGÊNITAS &amp; HIPERTENSÃO PEDIÁTRICA</text>
  <text x="40" y="58" fill="#e0f2fe" font-size="11" font-family="system-ui, -apple-system, sans-serif">Diretrizes Oficiais SBP 2024 (6ª Edição) • Triagem Neonatal com Teste do Coraçãozinho, Shunts, Cianose &amp; HAS</text>

  <!-- Bloco Central: Teste do Coraçãozinho -->
  <rect x="180" y="85" width="560" height="52" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadowCardio)" />
  <text x="460" y="105" fill="#0369a1" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">TRIAGEM NEONATAL: TESTE DO CORAÇÃOZINHO (OXIMETRIA DE PULSO 24-48H)</text>
  <text x="460" y="122" fill="#0f172a" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Oximetria no Membro Superior Direito (MSD) e em um dos Membros Inferiores (MMII): Normal se SpO2 &ge; 95% e dif &le; 3%</text>

  <!-- Linha divisória -->
  <line x1="460" y1="137" x2="460" y2="155" stroke="#94a3b8" stroke-width="2" />
  <line x1="240" y1="155" x2="680" y2="155" stroke="#94a3b8" stroke-width="2" />

  <line x1="240" y1="155" x2="240" y2="175" stroke="#94a3b8" stroke-width="2" />
  <polygon points="240,180 236,172 244,172" fill="#94a3b8" />
  <line x1="680" y1="155" x2="680" y2="175" stroke="#94a3b8" stroke-width="2" />
  <polygon points="680,180 676,172 684,172" fill="#94a3b8" />

  <!-- Ramo Esquerdo: Cardiopatias Acianogênicas -->
  <rect x="40" y="180" width="400" height="240" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadowCardio)" />
  <rect x="40" y="180" width="400" height="28" rx="6" fill="#10b981" />
  <text x="240" y="199" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CARDIOPATIAS ACIANOGÊNICAS (SHUNT E &rarr; D)</text>

  <text x="55" y="225" fill="#065f46" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">1. Com Hiperfluxo Pulmonar (Shunt Esquerda-Direita):</text>
  <text x="55" y="242" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <strong>CIV (Comunicação Interventricular):</strong> Mais comum de todas;</text>
  <text x="55" y="256" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  sopro holossistólico em borda esternal esquerda baixa. IC congestiva no lactente.</text>
  <text x="55" y="272" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <strong>CIA (Comunicação Interatrial):</strong> Desdobramento fixo de B2;</text>
  <text x="55" y="286" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  geralmente assintomática na infância.</text>
  <text x="55" y="302" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <strong>PCA (Persistência do Canal Arterial):</strong> Típico do prematuro;</text>
  <text x="55" y="316" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  sopro contínuo em maquinaria (Gibson) e pulsos amplos. Fechamento com ibuprofeno IV.</text>
  <text x="55" y="332" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <strong>DSAV (Defeito do Septo Atrioventricular):</strong> Associação marcante com Síndrome de Down.</text>

  <text x="55" y="355" fill="#065f46" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">2. Com Fluxo Pulmonar Normal (Lesões Obstrutivas):</text>
  <text x="55" y="372" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <strong>Coarctação da Aorta:</strong> Hipertensão em MMSS e pulsos femorais</text>
  <text x="55" y="386" fill="#b91c1c" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  diminuídos/ausentes com gradiente pressórico MMSS &gt; MMII (&gt; 20 mmHg).</text>
  <text x="55" y="405" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">• Estenose Pulmonar e Estenose Aórtica valvar.</text>

  <!-- Ramo Direito: Cardiopatias Cianogênicas -->
  <rect x="480" y="180" width="400" height="240" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadowCardio)" />
  <rect x="480" y="180" width="400" height="28" rx="6" fill="#0284c7" />
  <text x="680" y="199" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CARDIOPATIAS CIANOGÊNICAS (SHUNT D &rarr; E)</text>

  <text x="495" y="225" fill="#0369a1" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">1. Com Hipofluxo Pulmonar (Coração Oligoêmico no Rx):</text>
  <text x="495" y="242" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <strong>TETRALOGIA DE FALLOT:</strong> Cardiopatia cianogênica mais comum</text>
  <text x="495" y="256" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  após o 1º mês. Tétrade: Estenose pulmonar, CIV, cavalgamento da aorta e HVD.</text>
  <text x="495" y="270" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  Radiografia: Coração em "tamanco holandês" (*coeur en sabot*).</text>
  <text x="495" y="286" fill="#b91c1c" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  Crise Hipoxêmica de Fallot: Posição genupeitoral, O2, Morfina e Propranolol.</text>
  <text x="495" y="302" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• Atresia Pulmonar e Atresia Tricúspide.</text>

  <text x="495" y="325" fill="#0369a1" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">2. Com Hiperfluxo Pulmonar (Coração Congestivo):</text>
  <text x="495" y="342" fill="#0f172a" font-size="10" font-family="system-ui, sans-serif">• <strong>TRANSPOSIÇÃO DAS GRANDES ARTÉRIAS (TGA):</strong></text>
  <text x="495" y="356" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  Causa mais comum de cianose neonatal precoce (&lt; 24h). Coração em "ovo deitado".</text>
  <text x="495" y="372" fill="#dc2626" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  Lesão Canal-Dependente: Prostaglandina E1 (Alprostadil) IV imediata</text>
  <text x="495" y="386" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  para manter canal aberto até atriosseptostomia de Rashkind e cirurgia de Jatene.</text>
  <text x="495" y="405" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">• Truncus Arteriosus e Drenagem Anômala Total de Veias Pulmonares (DATVP).</text>

  <!-- Bloco Inferior: Hipertensão Arterial Pediátrica -->
  <rect x="40" y="440" width="840" height="160" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="40" y="440" width="840" height="26" fill="#f1f5f9" rx="6" />
  <text x="55" y="458" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">DIAGNÓSTICO E MANEJO DA HIPERTENSÃO ARTERIAL PEDIÁTRICA (SBP 2024 / AAP)</text>

  <text x="55" y="485" fill="#0f172a" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Classificação por Percentis (Sexo, Idade e Estatura):</text>
  <text x="55" y="502" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">• <strong>PA Normal:</strong> &lt; Percentil 90.</text>
  <text x="55" y="518" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">• <strong>PA Elevada:</strong> &ge; P90 até &lt; P95 (ou 120/80 mmHg).</text>
  <text x="55" y="534" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">• <strong>HAS Estágio 1:</strong> &ge; P95 até &lt; P95 + 12 mmHg.</text>
  <text x="55" y="550" fill="#dc2626" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">• <strong>HAS Estágio 2:</strong> &ge; P95 + 12 mmHg (ou &ge; 140/90 mmHg).</text>

  <text x="475" y="485" fill="#0f172a" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Investigação Etiológica &amp; Terapêutica Racional:</text>
  <text x="475" y="502" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">• <strong>Crianças &lt; 6-10 anos: HAS é 90% SECUNDÁRIA!</strong> Investigar parênquima renal</text>
  <text x="475" y="516" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  (USG renal com Doppler), estenose de artéria renal, coarctação de aorta e HAC.</text>
  <text x="475" y="534" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">• Adolescentes &ge; 12 anos e obesidade: Predomínio de HAS Primária (essencial).</text>
  <text x="475" y="550" fill="#059669" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">• Fármacos de 1ª linha: Enalapril (IECA), Losartana (BRA) ou Anlodipino (BCC).</text>
</svg>