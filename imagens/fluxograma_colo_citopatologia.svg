ine-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(138, 440.328125)"><g class="label" data-id="L_B_C_0" transform="translate(-100, -21)"><foreignObject width="200" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Alterações de Baixo Risco: ASC-US e LSIL</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(448, 440.328125)"><g class="label" data-id="L_B_D_0" transform="translate(-100, -21)"><foreignObject width="200" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Alterações de Alto Risco: ASC-H, HSIL e AGC</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="mermaid-svg-flowchart-A-0" data-look="classic" transform="translate(293, 54.5)"><rect class="basic label-container" style="" x="-130" y="-46.5" width="260" height="93"/><g class="label" style="" transform="translate(-100, -31.5)"><rect/><foreignObject width="200" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><b>Laudo Citopatológico Alterado (Bethesda / Nomenclatura Brasileira)</b></p></span></div></foreignObject></g></g><g class="node default dec " id="mermaid-svg-flowchart-B-1" data-look="classic" transform="translate(293, 272.6640625)"><polygon points="121.6640625,0 243.328125,-121.6640625 121.6640625,-243.328125 0,-121.6640625" class="label-container" transform="translate(-121.1640625, 121.6640625)" style="fill:#fef3c7 !important;stroke:#d97706 !important;stroke-width:2px !important"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-96.1640625, -10.5)"><rect/><foreignObject width="192.328125" height="21"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><b>Grau de Risco Citológico</b></p></span></div></foreignObject></g></g><g class="node default b1 " id="mermaid-svg-flowchart-C-3" data-look="classic" transform="translate(138, 753.328125)"><rect class="basic label-container" style="fill:#f0fdf4 !important;stroke:#16a34a !important;stroke-width:2px !important" x="-130" y="-246" width="260" height="492"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -231)"><rect/><foreignObject width="200" height="462"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><b>CONDUTA ESTRATIFICADA POR IDADE (REPETIÇÃO CITOLÓGICA):</b><br />• <b>ASC-US (Significado Indeterminado):</b><br />- <i>&lt; 25 anos:</i> Manter rotina e rastrear aos 25 anos<br />- <i>25 a 29 anos:</i> <b>Repetir em 12 meses</b> (se 2º exame ≥ ASC-US → Colposcopia)<br />- <i>≥ 30 anos:</i> <b>Repetir em 6 meses</b> (se 2º exame ≥ ASC-US → Colposcopia)<br />• <b>LSIL (Baixo Grau / Efeito do HPV):</b><br />- <i>&lt; 25 anos:</i> Conduta conservadora aos 3 anos<br />- <i>≥ 25 anos:</i> <b>Repetir em 6 meses</b> (se persistir LSIL no 2º exame → Colposcopia)</p></span></div></foreignObject></g></g><g class="node default b2 " id="mermaid-svg-flowchart-D-5" data-look="classic" transform="translate(448, 753.328125)"><rect class="basic label-container" style="fill:#fee2e2 !important;stroke:#dc2626 !important;stroke-width:2px !important" x="-130" y="-267" width="260" height="534"/><g class="label" style="font-size:14px !important;color:#991b1b !important" transform="translate(-100, -252)"><rect/><foreignObject width="200" height="504"><div style="font-size: 14px !important; color: rgb(153, 27, 27) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#991b1b !important" class="nodeLabel "><p><b>ENCAMINHAMENTO IMEDIATO PARA COLPOSCOPIA (QUALQUER IDADE):</b><br />• <b>ASC-H (Não se afasta alto grau):</b> Colposcopia imediata com biópsia dirigida se lesão acetobranca<br />• <b>HSIL (Lesão de Alto Grau / NIC 2-3):</b> Colposcopia imediata. Se ≥ 25 anos com ZT 1 ou 2 visível: opção de estratégia <i>Ver e Tratar</i> (EZT ambulatorial)<br />• <b>AGC / AGUS (Atipias Glandulares):</b> Colposcopia + Avaliação do Canal Endocervical (escovado ou curetagem) + Avaliação Endometrial se ≥ 35 anos ou sangramento anormal</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mermaid-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mermaid-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>