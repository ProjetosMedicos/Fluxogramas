<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">MANEJO METÓDICO DO SANGRAMENTO DE ESCAPE (SPOTTING) EM LARCs</text>
  <text x="970" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 19 e 20 • Protocolo Clínico Passo a Passo</text>

  <!-- Content -->
  
    <rect x="270" y="90" width="460" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="115" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">SANGRAMENTO DE ESCAPE / IRREGULAR COM LARC OU POP</text>
    <text x="500" y="135" font-size="11" fill="#7f1d1d" text-anchor="middle">Usuária de Implante (Implanon), DIU-LNG (Mirena/Kyleena) ou POP (Desogestrel/Drospirenona)</text>

    <!-- Passo 1: Investigação e Exclusão -->
    <path d="M 500 150 L 500 185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="150" y="185" width="700" height="85" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="500" y="210" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">PASSO 1: EXCLUSÃO DE CAUSAS ORGÂNICAS E ERROS DE USO</text>
    <text x="500" y="230" font-size="11" fill="#475569" text-anchor="middle">• Teste de Gravidez (β-hCG) • Rastreio de ISTs/Cervicite (Chlamydia e Gonococo) • Citopatologia cervical</text>
    <text x="500" y="250" font-size="11" fill="#475569" text-anchor="middle">• Exame especular e USG TV (excluir expulsão parcial ou mau posicionamento do DIU e pólipos)</text>

    <!-- Passo 2: Tempo de Uso -->
    <path d="M 500 270 L 500 305" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Bifurcação Adaptação vs Persistente -->
    <path d="M 330 305 L 230 345" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 670 305 L 770 345" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Caixa Primeiros 3 a 6 Meses -->
    <rect x="60" y="350" width="410" height="290" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="265" y="378" font-size="13" font-weight="800" fill="#0369a1" text-anchor="middle">PRIMEIROS 3 A 6 MESES (ADAPTAÇÃO)</text>
    <text x="80" y="405" font-size="11" font-weight="700" fill="#075985">• Fisiologia do Processo:</text>
    <text x="90" y="425" font-size="10" fill="#334155">- Atrofia endometrial inicial desigual e fragilidade capilar</text>
    <text x="90" y="443" font-size="10" fill="#334155">- Padrão de sangramento esperado em até 70-80% das pacientes</text>
    <text x="80" y="470" font-size="11" font-weight="700" fill="#075985">• Conduta Preferencial:</text>
    <text x="90" y="490" font-size="11" font-weight="700" fill="#15803d">Aconselhamento e Reasseguramento Focado:</text>
    <text x="90" y="510" font-size="10" fill="#334155">- Explicação detalhada da benignidade do quadro</text>
    <text x="90" y="528" font-size="10" fill="#334155">- Taxa de retenção do método sobe para &gt; 90% com bom acolhimento</text>
    <text x="90" y="550" font-size="10" font-weight="700" fill="#0369a1">Se Sangramento Incomodar a Paciente:</text>
    <text x="90" y="570" font-size="10" fill="#0369a1">AINEs: Ácido Mefenâmico 500mg 8/8h por 5 a 7 dias</text>
    <text x="90" y="588" font-size="10" fill="#0369a1">(Inibe prostaglandinas endometriais e estanca o sangramento)</text>

    <!-- Caixa Sangramento Persistente > 6 Meses -->
    <rect x="530" y="350" width="410" height="290" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
    <text x="735" y="378" font-size="13" font-weight="800" fill="#c2410c" text-anchor="middle">SANGRAMENTO PERSISTENTE &gt; 6 MESES</text>
    <text x="550" y="405" font-size="11" font-weight="700" fill="#9a3412">• Protocolos Farmacológicos Escalonados:</text>

    <text x="550" y="430" font-size="10" font-weight="700" fill="#c2410c">1ª OPÇÃO: AINEs Antiprostaglandínicos:</text>
    <text x="560" y="448" font-size="10" fill="#334155">Ácido Mefenâmico 500mg VO 8/8h por 5 a 7 dias OU Ibuprofeno 600-800mg 8/8h</text>

    <text x="550" y="475" font-size="10" font-weight="700" fill="#c2410c">2ª OPÇÃO: Ácido Tranexâmico (Antifibrinolítico):</text>
    <text x="560" y="493" font-size="10" fill="#334155">500mg a 1.000mg VO 8/8h por 4 a 5 dias (estabiliza o coágulo endometrial)</text>

    <text x="550" y="520" font-size="10" font-weight="700" fill="#c2410c">3ª OPÇÃO: Terapia Estrogênica de Resgate (se sem contraindicação):</text>
    <text x="560" y="538" font-size="10" fill="#334155">Valerato de Estradiol 2mg/dia VO ou ACO combinado por 10 a 21 dias</text>
    <text x="560" y="556" font-size="10" fill="#334155">(Promove proliferação endotelial e regeneração da mucosa atrófica)</text>

    <text x="550" y="585" font-size="10" font-weight="700" fill="#991b1b">⚠️ Se refratário a todas as etapas e insatisfação inaceitável:</text>
    <text x="560" y="603" font-size="10" fill="#7f1d1d">Discutir substituição de método (ex: troca de implante por DIU-LNG ou DIU Cobre).</text>
    

  <!-- Footer -->
  <line x1="30" y1="645" x2="970" y2="645" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="662" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • ACOG • FIGO • OMS (MEC 5ª Ed)</text>
  <text x="970" y="662" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>