<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; line-height: 1.3; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">CALENDÁRIO VACINAL DA CRIANÇA E DO ADOLESCENTE</text>
  <text x="50" y="78" class="subtitle">Diretrizes SBP / PNI 2024 • Esquemas, Atrasos e Condutas</text>
  <rect x="750" y="42" width="200" height="28" rx="6" fill="#0284c7" />
  <text x="850" y="60" text-anchor="middle" class="badge-text">SBP 2024 • INFECTOLOGIA</text>


  <g class="card-shadow">
    <rect x="250" y="115" width="500" height="60" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="500" y="138" text-anchor="middle" class="node-bold">CALENDÁRIO VACINAL DA SBP / PNI (ATUALIZAÇÃO 2024)</text>
    <text x="500" y="158" text-anchor="middle" class="node-text">Imunização Primária, Doses de Reforço e Vacinas Especiais (SBP 2024)</text>
  </g>

  <path d="M 280 175 L 180 230" class="edge" />
  <path d="M 500 175 L 500 230" class="edge" />
  <path d="M 720 175 L 820 230" class="edge" />

  <g class="card-shadow">
    <rect x="40" y="230" width="280" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="180" y="252" text-anchor="middle" class="node-bold" fill="#1e40af">PRIMEIRO SEMESTRE (1-6 MESES)</text>
    <text x="180" y="272" text-anchor="middle" class="node-text">• Ao nascer: BCG (dose única) + Hepatite B</text>
    <text x="180" y="290" text-anchor="middle" class="node-text">• 2 meses: Penta (DTP/Hib/HepB) + VIP (polio inativada) + Pneumocócica 10/13 + Rotavírus</text>
    <text x="180" y="312" text-anchor="middle" class="node-text">• 3 meses: Meningocócica C ou ACWY (1ª dose)</text>
    <text x="180" y="330" text-anchor="middle" class="node-text">• 4 meses: 2ª dose das vacinas de 2 meses</text>
    <text x="180" y="348" text-anchor="middle" class="node-text">• 5 meses: 2ª dose de Meningo C ou ACWY</text>
    <text x="180" y="366" text-anchor="middle" class="node-text">• 6 meses: 3ª dose de Penta e VIP + Covid-19</text>
  </g>

  <g class="card-shadow">
    <rect x="360" y="230" width="280" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="500" y="252" text-anchor="middle" class="node-bold" fill="#15803d">SEGUNDO ANO (9-24 MESES)</text>
    <text x="500" y="272" text-anchor="middle" class="node-text">• 9 meses: Febre Amarela (dose inicial)</text>
    <text x="500" y="290" text-anchor="middle" class="node-text">• 12 meses: Tríplice Viral (Sarampo/Caxumba/Rubéola) + Reforço Pneumo + Reforço Meningo ACWY</text>
    <text x="500" y="318" text-anchor="middle" class="node-text">• 15 meses: DTP (1º reforço) + VIP (reforço)</text>
    <text x="500" y="334" text-anchor="middle" class="node-text">  Hepatite A (dose única no PNI / 2 doses SBP)</text>
    <text x="500" y="350" text-anchor="middle" class="node-text">  Tetraviral (SCR + Varicela)</text>
    <text x="500" y="366" text-anchor="middle" class="node-text">• CRIE: Indicação para prematuros e cardiopatas</text>
  </g>

  <g class="card-shadow">
    <rect x="680" y="230" width="280" height="150" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="820" y="252" text-anchor="middle" class="node-bold" fill="#701a75">PRÉ-ESCOLAR &amp; ADOLESCENTE</text>
    <text x="820" y="272" text-anchor="middle" class="node-text">• 4 anos: DTP (2º reforço) + VIP (reforço)</text>
    <text x="820" y="290" text-anchor="middle" class="node-text">  Varicela (2ª dose) + Febre Amarela (reforço)</text>
    <text x="820" y="310" text-anchor="middle" class="node-text">• 9 a 14 anos: Vacina HPV nonavalente/quadrivalente:</text>
    <text x="820" y="328" text-anchor="middle" class="node-text">  Dose Única no SUS (Meninas e Meninos)</text>
    <text x="820" y="346" text-anchor="middle" class="node-text">• 11 a 14 anos: Meningocócica ACWY (reforço)</text>
    <text x="820" y="364" text-anchor="middle" class="node-text">• dTpa a cada 10 anos (ou 5 anos se ferimento)</text>
  </g>

  <path d="M 500 380 L 500 435" class="edge" />

  <g class="card-shadow">
    <rect x="150" y="435" width="700" height="120" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
    <text x="500" y="458" text-anchor="middle" class="node-bold" fill="#c2410c">REGRAS DE OURO EM VACINAÇÃO &amp; CONDUTA EM ATRASOS (SBP 2024)</text>
    <text x="500" y="480" text-anchor="middle" class="node-text">• NÃO SE REINICIA ESQUEMA VACINAL ATRASADO: Apenas completam-se as doses faltantes!</text>
    <text x="500" y="498" text-anchor="middle" class="node-text">• Intervalo mínimo entre doses da mesma vacina: 30 dias (respeitar para garantir maturação imunológica)</text>
    <text x="500" y="516" text-anchor="middle" class="node-text">• Vacinas de vírus vivos atenuados parenterais (ex: Febre Amarela e Tríplice Viral): aplicar simultaneamente OU com intervalo de 30 dias</text>
    <text x="500" y="534" text-anchor="middle" class="node-text">• Falso contraindicações: Resfriado leve, febre baixa, uso de antibióticos comuns ou desnutrição leve NÃO contraindicam vacinar</text>
  </g>

  <path d="M 500 555 L 500 595" class="edge" />

  <g class="card-shadow">
    <rect x="180" y="595" width="640" height="75" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="500" y="618" text-anchor="middle" class="node-bold" fill="#b91c1c">CONTRAINDICAÇÕES VERDADEIRAS A VACINAS DE VÍRUS VIVOS</text>
    <text x="500" y="638" text-anchor="middle" class="node-text">• Gestação e Imunodeficiências primárias ou secundárias graves (quimioterapia, imunossupressores, CD4 baixo)</text>
    <text x="500" y="654" text-anchor="middle" class="node-text">• Histórico prévio de anafilaxia confirmada a componente vacinal (ex: ovo em vacinas específicas)</text>
  </g>


  <!-- Footer Notice -->
  <rect x="30" y="700" width="940" height="35" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="722" text-anchor="middle" class="subtitle" style="font-size: 11px;">Diretriz Oficial: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>