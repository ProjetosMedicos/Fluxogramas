<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="960" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">AVALIAÇÃO DE NÓDULOS E CISTOS MAMÁRIOS BENIGNOS</text>
  <text x="930" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 82 • SBM / CBR</text>

  <!-- Content -->
  
    <rect x="280" y="95" width="400" height="60" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
    <text x="480" y="120" font-size="14" font-weight="800" fill="#9d174d" text-anchor="middle">NÓDULO OU CISTO MAMÁRIO PALPÁVEL / USG</text>
    <text x="480" y="140" font-size="11" fill="#be185d" text-anchor="middle">Caracterização ecográfica estrita: Conteúdo Líquido vs Sólido</text>

    <!-- Bifurcação Líquido vs Sólido -->
    <path d="M 380 155 L 240 205" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 580 155 L 720 205" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Coluna Cistos -->
    <rect x="50" y="215" width="380" height="390" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="240" y="245" font-size="14" font-weight="800" fill="#0369a1" text-anchor="middle">LESÕES CÍSTICAS (LÍQUIDAS)</text>

    <text x="70" y="280" font-size="12" font-weight="700" fill="#075985">• Cisto Simples (BI-RADS 2):</text>
    <text x="80" y="298" font-size="11" fill="#0369a1">Anecoico, paredes finas regulares, reforço acústico posterior.</text>
    <text x="80" y="316" font-size="11" fill="#15803d"><tspan font-weight="bold">Conduta:</tspan> Conservadora. PAAF apenas se doloroso ou volumoso.</text>

    <text x="70" y="348" font-size="12" font-weight="700" fill="#075985">• Cisto Complicado (BI-RADS 3):</text>
    <text x="80" y="366" font-size="11" fill="#0369a1">Ecos internos em suspensão (detritos/debris proteicos) sem vegetação.</text>
    <text x="80" y="384" font-size="11" fill="#b45309"><tspan font-weight="bold">Conduta:</tspan> Controle ecográfico em 6 meses (risco &lt; 2%).</text>

    <text x="70" y="418" font-size="12" font-weight="700" fill="#b91c1c">• Cisto Complexo Cístico-Sólido (BI-RADS 4):</text>
    <text x="80" y="436" font-size="11" fill="#991b1b">Paredes espessadas (&gt; 0,5 mm), septos espessos ou nódulo mural.</text>
    <text x="80" y="454" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">Conduta:</tspan> Biópsia por Agulha Grossa (Core Biopsy) ou Exérese.</text>

    <text x="70" y="490" font-size="12" font-weight="700" fill="#075985">• Critérios do Líquido na PAAF de Cisto:</text>
    <text x="80" y="508" font-size="11" fill="#0369a1">- Líquido amarelo/esverdeado límpido + colapso total: desprezar.</text>
    <text x="80" y="526" font-size="11" fill="#b91c1c">- Líquido hemático OU massa residual palpável pós-punção:</text>
    <text x="90" y="544" font-size="11" fill="#991b1b">Encaminhar para citologia oncótica e biópsia excisional.</text>

    <!-- Coluna Sólidos -->
    <rect x="530" y="215" width="380" height="390" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
    <text x="720" y="245" font-size="14" font-weight="800" fill="#9d174d" text-anchor="middle">LESÕES SÓLIDAS BENIGNAS</text>

    <text x="550" y="280" font-size="12" font-weight="700" fill="#9d174d">• Fibroadenoma Típico (BI-RADS 3):</text>
    <text x="560" y="298" font-size="11" fill="#831843">Nódulo oval circunscrito, eixo paralelo à pele ("mais largo"), móvel.</text>
    <text x="560" y="316" font-size="11" fill="#831843">Tumor mamário mais comum em jovens &lt; 35 anos.</text>
    <text x="560" y="338" font-size="11" fill="#15803d"><tspan font-weight="bold">Conduta:</tspan> Seguimento semestral por 2 anos se estável e &lt; 2-3 cm.</text>

    <text x="550" y="372" font-size="12" font-weight="700" fill="#9d174d">• Indicações Cirúrgicas do Fibroadenoma:</text>
    <text x="560" y="390" font-size="11" fill="#831843">- Crescimento rápido (&gt; 20% no diâmetro em 6 meses);</text>
    <text x="560" y="408" font-size="11" fill="#831843">- Dimensões volumosas (&gt; 3,0 cm - risco de tumor filodes);</text>
    <text x="560" y="426" font-size="11" fill="#831843">- Idade &gt; 35-40 anos na primeira apresentação;</text>
    <text x="560" y="444" font-size="11" fill="#831843">- Desejo expressivo da paciente por cancerofobia.</text>

    <text x="550" y="480" font-size="12" font-weight="700" fill="#b91c1c">• Tumor Filodes (Diagnóstico Diferencial):</text>
    <text x="560" y="498" font-size="11" fill="#991b1b">Hipercelularidade estromal atípica. Crescimento expansivo rápido.</text>
    <text x="560" y="516" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">Conduta Mandatória:</tspan> Ressecção cirúrgica ampla com margem livre &#8805; 1 cm.</text>
    

  <!-- Footer -->
  <line x1="30" y1="625" x2="930" y2="625" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="642" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • SBM • FIGO • ISSVD</text>
  <text x="930" y="642" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>