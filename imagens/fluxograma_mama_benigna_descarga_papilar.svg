<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="940" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">ALGORITMO DIAGNÓSTICO DA DESCARGA PAPILAR (FLUXO MAMILAR)</text>
  <text x="910" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 82 • Diretrizes de Rastreamento</text>

  <!-- Content -->
  
    <rect x="270" y="95" width="400" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="120" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">QUEIXA DE DESCARGA PAPILAR (SAÍDA DE SECREÇÃO)</text>
    <text x="470" y="140" font-size="11" fill="#475569" text-anchor="middle">Classificação em Suspeita (Patológica) vs Não Suspeita (Fisiológica)</text>

    <path d="M 370 155 L 230 205" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 570 155 L 710 205" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Nao Suspeita -->
    <rect x="50" y="215" width="360" height="360" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="230" y="245" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">DESCARGA NÃO SUSPEITA / FISIOLÓGICA</text>
    <text x="70" y="275" font-size="12" fill="#15803d">• <tspan font-weight="bold">Características:</tspan> Bilateral, multiductal, provocada</text>
    <text x="80" y="293" font-size="11" fill="#166534">(à compressão), esverdeada, amarelada ou leitosa.</text>

    <text x="70" y="325" font-size="12" font-weight="700" fill="#14532d">• Descarga Leitosa (Galactorreia):</text>
    <text x="80" y="343" font-size="11" fill="#166534">- Dosar Prolactina sérica e TSH</text>
    <text x="80" y="361" font-size="11" fill="#166534">- Investigar fármacos (antipsicóticos, metoclopramida)</text>
    <text x="80" y="379" font-size="11" fill="#166534">- RNM de sela túrcica se prolactinoma suspeito.</text>

    <text x="70" y="415" font-size="12" font-weight="700" fill="#14532d">• Descarga Multicolorida (Verde, Marrom, Amarela):</text>
    <text x="80" y="433" font-size="11" fill="#166534">Típica de <tspan font-weight="bold">Ectasia Ductal Mamária</tspan> ou AFBM.</text>
    <text x="80" y="451" font-size="11" fill="#166534">Conduta: Tranquilização e orientação para cessar</text>
    <text x="80" y="469" font-size="11" fill="#166534">a autoexpressão repetida da papila (estímulo mecânico).</text>

    <!-- Suspeita -->
    <rect x="530" y="215" width="360" height="360" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="710" y="245" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">DESCARGA SUSPEITA / PATOLÓGICA</text>
    <text x="550" y="275" font-size="12" fill="#b91c1c">• <tspan font-weight="bold">Características de Alarme (Red Flags):</tspan></text>
    <text x="560" y="295" font-size="11" font-weight="800" fill="#7f1d1d">UNILATERAL • UNIDUCTAL • ESPONTÂNEA</text>
    <text x="560" y="315" font-size="11" fill="#991b1b">Aspecto: <tspan font-weight="bold">Sanguinolento</tspan> ou <tspan font-weight="bold">Aquoso ("Água de Rocha")</tspan></text>

    <text x="550" y="348" font-size="12" font-weight="700" fill="#7f1d1d">• Etiologias Frequentes:</text>
    <text x="560" y="366" font-size="11" fill="#991b1b">- <tspan font-weight="bold">Papiloma Intraductal Benigno:</tspan> Causa mais comum (50-70%)</text>
    <text x="560" y="384" font-size="11" fill="#991b1b">- Carcinoma Ductal In Situ (CDIS) ou Invasor: 10 a 15%</text>

    <text x="550" y="420" font-size="12" font-weight="700" fill="#7f1d1d">• Propedêutica e Conduta:</text>
    <text x="560" y="438" font-size="11" fill="#991b1b">1. Mamografia diagnóstica + USG de alta resolução;</text>
    <text x="560" y="456" font-size="11" fill="#991b1b">2. Ressonância Magnética se exames normais;</text>
    <text x="560" y="474" font-size="11" font-weight="800" fill="#7f1d1d">3. RESSECÇÃO DO DUCTO PRINCIPAL</text>
    <text x="570" y="492" font-size="10" fill="#7f1d1d">(Cirurgia diagnóstica e terapêutica obrigatória).</text>
    

  <!-- Footer -->
  <line x1="30" y1="585" x2="910" y2="585" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="602" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • SBM • FIGO • ISSVD</text>
  <text x="910" y="602" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>