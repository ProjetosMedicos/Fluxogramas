<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #1e293b; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" />
  <text x="50" y="55" class="title">ALGORITMO DE ESTRATIFICAÇÃO E CONDUTA NA OBESIDADE INFANTIL</text>
  <text x="50" y="78" class="subtitle">Critérios Antropométricos da OMS, Rastreio de Síndrome Metabólica e Intervenção Escalonada • SBP 2024</text>
  <rect x="790" y="42" width="160" height="28" rx="6" fill="#a16207" />
  <text x="870" y="60" text-anchor="middle" class="badge-text">SBP 2024 • NUTROLOGIA</text>

  <!-- WHO Classification Grid -->
  <g class="card-shadow">
    <rect x="40" y="115" width="440" height="150" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <text x="260" y="140" text-anchor="middle" class="node-bold" fill="#0369a1">CRIANÇAS &lt; 5 ANOS (Critérios OMS / SBP)</text>
    <text x="60" y="165" class="node-text">• <tspan font-weight="700">Z &gt; +1 (Percentil &gt; 85):</tspan> Risco de sobrepeso.</text>
    <text x="60" y="190" class="node-text">• <tspan font-weight="700" fill="#b45309">Z &gt; +2 (Percentil &gt; 97):</tspan> SOBREPESO.</text>
    <text x="60" y="215" class="node-text">• <tspan font-weight="700" fill="#dc2626">Z &gt; +3 (Percentil &gt; 99.9):</tspan> OBESIDADE.</text>
    <text x="60" y="240" class="node-text">• Índice antropométrico prioritário: <tspan font-weight="700">Peso/Estatura</tspan> ou IMC/Idade.</text>
  </g>

  <g class="card-shadow">
    <rect x="520" y="115" width="440" height="150" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" />
    <text x="740" y="140" text-anchor="middle" class="node-bold" fill="#a16207">CRIANÇAS ≥ 5 ANOS & ADOLESCENTES</text>
    <text x="540" y="165" class="node-text">• <tspan font-weight="700" fill="#b45309">Z &gt; +1 (p85 a p97):</tspan> SOBREPESO.</text>
    <text x="540" y="190" class="node-text">• <tspan font-weight="700" fill="#dc2626">Z &gt; +2 (p97 a p99.9):</tspan> OBESIDADE.</text>
    <text x="540" y="215" class="node-text">• <tspan font-weight="700" fill="#7f1d1d">Z &gt; +3 (p &gt; 99.9):</tspan> OBESIDADE GRAVE.</text>
    <text x="540" y="240" class="node-text">• Índice antropométrico padrão: <tspan font-weight="700">IMC para Idade</tspan>.</text>
  </g>

  <!-- Lab Screening Box -->
  <g class="card-shadow">
    <rect x="40" y="285" width="920" height="170" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="60" y="310" class="node-bold" fill="#0f172a">RASTREIO LABORATORIAL DE COMORBIDADES (INDICADO SE Z IMC &gt; +2 OU SE Z &gt; +1 COM FATORES DE RISCO)</text>
    <text x="60" y="340" class="node-text">1. <tspan font-weight="700">Perfil Lipídico Completo:</tspan> Colesterol Total, HDL, LDL e Triglicerídeos (Dislipidemia aterogênica: HDL &lt; 40 mg/dL e Triglicerídeos &gt; 100-130 mg/dL).</text>
    <text x="60" y="365" class="node-text">2. <tspan font-weight="700">Glicemia de Jejum &amp; HbA1c:</tspan> Rastreio de Pré-Diabetes (Glicemia 100-125 mg/dL ou HbA1c 5.7-6.4%) e DM2 (Glicemia ≥ 126 ou HbA1c ≥ 6.5%).</text>
    <text x="60" y="390" class="node-text">3. <tspan font-weight="700">Enzimas Hepáticas (ALT/TGP e AST/TGO):</tspan> Rastreio de Doença Hepática Esteatótica Associada à Disfunção Metabólica (MASLD/NASH).</text>
    <text x="60" y="415" class="node-text">4. <tspan font-weight="700">Pressão Arterial:</tspan> Aferir em todas as consultas usando manguito adequado (largura 40% da circunferência braquial e comprimento 80-100%).</text>
    <text x="60" y="440" class="node-text">5. <tspan font-weight="700">Exclusão de Causa Endócrina/Genética:</tspan> TSH/T4L (hipotireoidismo), Cortisol livre urinário (Cushing se baixa estatura + obesidade), Cariótipo/painel genético.</text>
  </g>

  <!-- Management Protocol 5-2-1-0 -->
  <g class="card-shadow">
    <rect x="40" y="475" width="920" height="245" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="60" y="505" class="node-bold" fill="#047857">ESTRATÉGIA NÃO FARMACOLÓGICA DA SBP: DIRETRIZ 5-2-1-0 & ACOMPANHAMENTO</text>

    <!-- 4 Pills of 5-2-1-0 -->
    <rect x="60" y="525" width="200" height="75" rx="6" fill="#f0fdf4" stroke="#10b981" />
    <text x="160" y="550" text-anchor="middle" class="node-bold" fill="#15803d">5 ou mais</text>
    <text x="160" y="570" text-anchor="middle" class="node-text">Porções de frutas e legumes</text>
    <text x="160" y="585" text-anchor="middle" class="node-text">frescos todos os dias.</text>

    <rect x="290" y="525" width="200" height="75" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="390" y="550" text-anchor="middle" class="node-bold" fill="#1d4ed8">2 horas ou menos</text>
    <text x="390" y="570" text-anchor="middle" class="node-text">De tempo recreativo de tela</text>
    <text x="390" y="585" text-anchor="middle" class="node-text">(&lt; 2 anos = ZERO telas).</text>

    <rect x="520" y="525" width="200" height="75" rx="6" fill="#fffbeb" stroke="#f59e0b" />
    <text x="620" y="550" text-anchor="middle" class="node-bold" fill="#b45309">1 hora ou mais</text>
    <text x="620" y="570" text-anchor="middle" class="node-text">De atividade física moderada</text>
    <text x="620" y="585" text-anchor="middle" class="node-text">a vigorosa diariamente.</text>

    <rect x="750" y="525" width="200" height="75" rx="6" fill="#fef2f2" stroke="#ef4444" />
    <text x="850" y="550" text-anchor="middle" class="node-bold" fill="#b91c1c">0 bebidas açucaradas</text>
    <text x="850" y="570" text-anchor="middle" class="node-text">Zero refrigerante, suco de caixa,</text>
    <text x="850" y="585" text-anchor="middle" class="node-text">achocolatados e chás doces.</text>

    <text x="60" y="630" class="node-bold" fill="#0f172a">FARMACOTERAPIA & CONDUTA AVANÇADA NO ADOLESCENTE (SBP 2024):</text>
    <text x="60" y="655" class="node-text">• Indicada apenas após falha documentada de mudança de estilo de vida intensiva em &gt; 12 anos com Obesidade Grave ou comorbidades graves.</text>
    <text x="60" y="675" class="node-text">• Fármacos aprovados pela ANVISA em adolescentes ≥ 12 anos: <tspan font-weight="700">Liraglutida</tspan> (análogo GLP-1 3.0 mg/dia SC) e <tspan font-weight="700">Orlistate</tspan> (120 mg VO junto às refeições).</text>
    <text x="60" y="695" class="node-text">• <tspan font-weight="700">Cirurgia Bariátrica:</tspan> Apenas para adolescentes com maturidade óssea (Tanner 4-5) e IMC &gt; 35 com comorbidades graves ou IMC &gt; 40 refratários.</text>
  </g>
</svg>