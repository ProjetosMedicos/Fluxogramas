t-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(138, 500.5)"><g class="label" data-id="L_B_C_0" transform="translate(-100, -31.5)"><foreignObject width="200" height="63"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Estádio I: Tumor Rigorosamente Confinado ao Colo Uterino</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(448, 500.5)"><g class="label" data-id="L_B_D_0" transform="translate(-100, -31.5)"><foreignObject width="200" height="63"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Estádios II, III e IV: Extensão Parametrial, Pélvica ou a Distância</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="mermaid-svg-flowchart-A-0" data-look="classic" transform="translate(293, 65)"><rect class="basic label-container" style="" x="-130" y="-57" width="260" height="114"/><g class="label" style="" transform="translate(-100, -42)"><rect/><foreignObject width="200" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><b>Carcinoma Invasor do Colo Uterino: Estadiamento Clínico e por Imagem (FIGO 2018)</b></p></span></div></foreignObject></g></g><g class="node default dec " id="mermaid-svg-flowchart-B-1" data-look="classic" transform="translate(293, 308)"><polygon points="136,0 272,-136 136,-272 0,-136" class="label-container" transform="translate(-135.5, 136)" style="fill:#fef3c7 !important;stroke:#d97706 !important;stroke-width:2px !important"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -21)"><rect/><foreignObject width="200" height="42"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><b>Volume e Extensão Anatômica da Doença</b></p></span></div></foreignObject></g></g><g class="node default early " id="mermaid-svg-flowchart-C-3" data-look="classic" transform="translate(138, 803)"><rect class="basic label-container" style="fill:#dcfce7 !important;stroke:#16a34a !important;stroke-width:2px !important" x="-130" y="-204" width="260" height="408"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -189)"><rect/><foreignObject width="200" height="378"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><b>ESTÁDIO I (DOENÇA INICIAL):</b><br />• <b>IA (Microscópico):</b><br />- IA1: invasão estromal ≤ 3 mm de profundidade<br />- IA2: invasão estromal &gt; 3 mm e ≤ 5 mm<br />• <b>IB (Lesão Clinicamente Visível ou &gt; 5 mm):</b><br />- IB1: Diâmetro ≤ 2 cm (elegível para cirurgia preservadora de fertilidade)<br />- IB2: Diâmetro &gt; 2 cm e ≤ 4 cm (elegível para cirurgia radical de Wertheim-Meigs)<br />- IB3: Diâmetro &gt; 4 cm (Localmente avançada: Quimiorradioterapia!)</p></span></div></foreignObject></g></g><g class="node default locadv " id="mermaid-svg-flowchart-D-5" data-look="classic" transform="translate(448, 803)"><rect class="basic label-container" style="fill:#fee2e2 !important;stroke:#dc2626 !important;stroke-width:2px !important" x="-130" y="-246" width="260" height="492"/><g class="label" style="font-size:14px !important;color:#991b1b !important" transform="translate(-100, -231)"><rect/><foreignObject width="200" height="462"><div style="font-size: 14px !important; color: rgb(153, 27, 27) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#991b1b !important" class="nodeLabel "><p><b>ESTÁDIOS II A IV (LOCALMENTE AVANÇADOS / SISTÊMICOS):</b><br />• <b>Estádio II (Extensão além do útero sem parede pélvica nem 1/3 inf da vagina):</b><br />- IIA: Invade 2/3 superiores da vagina (IIA1 ≤ 4 cm | IIA2 &gt; 4 cm)<br />- IIB: Invasão evidente de paramétrios (sem atingir a parede óssea)<br />• <b>Estádio III:</b> IIIA (1/3 inf da vagina) | IIIB (parede pélvica ou hidronefrose) | IIIC (linfonodos pélvicos IIIC1 ou para-aórticos IIIC2)<br />• <b>Estádio IV:</b> IVA (mucosa de bexiga ou reto) | IVB (metástases a distância)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mermaid-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mermaid-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>