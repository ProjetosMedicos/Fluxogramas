<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; line-height: 1.3; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">DIAGNÓSTICO DIFERENCIAL DAS DOENÇAS EXANTEMÁTICAS</text>
  <text x="50" y="78" class="subtitle">Morfologia, Sinais Patognomônicos e Complicações • SBP 2024</text>
  <rect x="750" y="42" width="200" height="28" rx="6" fill="#0284c7" />
  <text x="850" y="60" text-anchor="middle" class="badge-text">SBP 2024 • INFECTOLOGIA</text>


  <g class="card-shadow">
    <rect x="260" y="115" width="480" height="60" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="500" y="138" text-anchor="middle" class="node-bold">DIAGNÓSTICO DIFERENCIAL DOS EXANTEMAS INFANTIS</text>
    <text x="500" y="158" text-anchor="middle" class="node-text">Morfologia das lesões, pródromos, sinais patognomônicos e evolução temporal (SBP 2024)</text>
  </g>

  <path d="M 330 175 L 180 230" class="edge" />
  <path d="M 500 175 L 500 230" class="edge" />
  <path d="M 670 175 L 820 230" class="edge" />

  <!-- Morbiliformes -->
  <g class="card-shadow">
    <rect x="40" y="230" width="280" height="180" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="180" y="252" text-anchor="middle" class="node-bold" fill="#1e40af">MACULOPAPULAR CONFLUENTE</text>
    <text x="180" y="272" text-anchor="middle" class="node-bold">• SARAMPO (Morbillivirus):</text>
    <text x="180" y="290" text-anchor="middle" class="node-text">  Pródromos: tosse, coriza, conjuntivite fotofóbica</text>
    <text x="180" y="306" text-anchor="middle" class="node-bold" fill="#b91c1c">  MANCHAS DE KOPLIK patognomônicas</text>
    <text x="180" y="322" text-anchor="middle" class="node-text">  Progressão craniocaudal com descamação furfurácea</text>
    <text x="180" y="338" text-anchor="middle" class="node-text">  Tratamento: Vitamina A em 2 doses consecutivas</text>
    <text x="180" y="356" text-anchor="middle" class="node-bold">• RUBÉOLA (Togavirus):</text>
    <text x="180" y="372" text-anchor="middle" class="node-text">  Linfonodomegalia suboccipital dolorosa</text>
    <text x="180" y="388" text-anchor="middle" class="node-text">  Exantema róseo não confluente sem descamação</text>
    <text x="180" y="404" text-anchor="middle" class="node-text">  Manchas de Forchheimer no palato</text>
  </g>

  <!-- Vesiculares e Escarlatina -->
  <g class="card-shadow">
    <rect x="360" y="230" width="280" height="180" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="500" y="252" text-anchor="middle" class="node-bold" fill="#701a75">VESICULARES &amp; MICROPAPULARES</text>
    <text x="500" y="272" text-anchor="middle" class="node-bold">• VARICELA (Catapora - VVZ):</text>
    <text x="500" y="290" text-anchor="middle" class="node-text">  Polimorfismo regional (mácula, pápula, vesícula,</text>
    <text x="500" y="306" text-anchor="middle" class="node-text">  pústula e crosta simultâneas) e prurido intenso</text>
    <text x="500" y="322" text-anchor="middle" class="node-text">  Aciclovir se &gt; 12 anos, segundo caso ou imunodeprimido</text>
    <text x="500" y="340" text-anchor="middle" class="node-bold">• ESCARLATINA (S. pyogenes):</text>
    <text x="500" y="358" text-anchor="middle" class="node-text">  Faringoamigdalite purulenta prévia</text>
    <text x="500" y="374" text-anchor="middle" class="node-text">  Exantema em "lixa" (micropapular áspero)</text>
    <text x="500" y="390" text-anchor="middle" class="node-text">  Língua em framboesa, Sinal de Filatov e Pastia</text>
    <text x="500" y="404" text-anchor="middle" class="node-bold">  Penicilina Benzatina IM dose única</text>
  </g>

  <!-- Roséola, Parvovírus e Kawasaki -->
  <g class="card-shadow">
    <rect x="680" y="230" width="280" height="180" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
    <text x="820" y="252" text-anchor="middle" class="node-bold" fill="#b45309">OUTROS EXANTEMAS CARACTERÍSTICOS</text>
    <text x="820" y="272" text-anchor="middle" class="node-bold">• EXANTEMA SÚBITO (Roséola - HHV-6):</text>
    <text x="820" y="290" text-anchor="middle" class="node-text">  Lactente 6m-2a: febre alta de 3-4 dias que CESSA</text>
    <text x="820" y="306" text-anchor="middle" class="node-text">  em crise e surge exantema maculopapular em tronco</text>
    <text x="820" y="324" text-anchor="middle" class="node-bold">• ERITEMA INFECCIOSO (Parvovírus B19):</text>
    <text x="820" y="340" text-anchor="middle" class="node-text">  Fácies em "bofetada" (eritema malar)</text>
    <text x="820" y="356" text-anchor="middle" class="node-text">  Seguido de exantema rendilhado em extremidades</text>
    <text x="820" y="372" text-anchor="middle" class="node-bold" fill="#dc2626">• DOENÇA DE KAWASAKI (VASCULITE):</text>
    <text x="820" y="388" text-anchor="middle" class="node-text">  Febre ≥ 5 dias + 4 critérios clínicos</text>
    <text x="820" y="404" text-anchor="middle" class="node-bold">  Imunoglobulina IV 2g/kg + AAS precoce</text>
  </g>

  <path d="M 500 410 L 500 460" class="edge" />

  <g class="card-shadow">
    <rect x="150" y="460" width="700" height="110" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="500" y="482" text-anchor="middle" class="node-bold" fill="#b91c1c">RED FLAG IMEDIATO: EXANTEMA PETEQUIAL / PURPÚRICO</text>
    <text x="500" y="504" text-anchor="middle" class="node-text">• Lesões purpúricas que NÃO somem à digitopressão = EMERGÊNCIA MÉDICA ABSOLUTA!</text>
    <text x="500" y="522" text-anchor="middle" class="node-text">• Hipótese prioritária: MENINGOCOCCEMIA / SEPSE GRAVE (Neisseria meningitidis)</text>
    <text x="500" y="540" text-anchor="middle" class="node-text">• Coleta de hemoculturas e início imediato de Ceftriaxona 100 mg/kg IV (sem atrasar para exames)</text>
    <text x="500" y="556" text-anchor="middle" class="node-text">• Diagnósticos diferenciais purpúricos: Púrpura de Henoch-Schönlein (IgA), PTI e Leucemia</text>
  </g>

  <path d="M 500 570 L 500 605" class="edge" />

  <g class="card-shadow">
    <rect x="200" y="605" width="600" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="500" y="627" text-anchor="middle" class="node-bold">ISOLAMENTO &amp; NOTIFICAÇÃO COMPULSÓRIA</text>
    <text x="500" y="647" text-anchor="middle" class="node-text">• Notificação imediata: Sarampo, Rubéola e Meningococcemia (bloqueio vacinal em até 72h)</text>
    <text x="500" y="663" text-anchor="middle" class="node-text">• Varicela: afastamento escolar até que TODAS as lesões estejam em fase de crosta!</text>
  </g>


  <!-- Footer Notice -->
  <rect x="30" y="700" width="940" height="35" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="722" text-anchor="middle" class="subtitle" style="font-size: 11px;">Diretriz Oficial: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>