<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="940" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">ESCORE RMI (RISK OF MALIGNANCY INDEX) &amp; MARCADORES TUMORAIS</text>
  <text x="910" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">Tratado FEBRASGO Cap. 81 • RCOG &amp; FIGO</text>

  <!-- Content -->
  
    <rect x="250" y="95" width="440" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="120" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">MASSA ANEXIAL COM SUSPEITA DE NEOPLASIA</text>
    <text x="470" y="140" font-size="12" fill="#475569" text-anchor="middle">Cálculo do RMI = USG (U) × Estado Menopáusico (M) × CA-125 Sérico</text>

    <!-- Formula RMI -->
    <rect x="150" y="180" width="640" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="205" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">PARÂMETROS DA FÓRMULA DE JACOBS (RMI-1)</text>
    <text x="170" y="232" font-size="11" fill="#1d4ed8">• <tspan font-weight="bold">USG (U):</tspan> 5 achados (multilocular, sólido, bilateral, ascite, metástase). 0 = escore 0; 1 achado = 1; &#8805; 2 achados = <tspan font-weight="bold">3</tspan></text>
    <text x="170" y="254" font-size="11" fill="#1d4ed8">• <tspan font-weight="bold">Menopausa (M):</tspan> Pré-menopausa = <tspan font-weight="bold">1</tspan>; Pós-menopausa (amenorreia &gt; 1 ano ou &gt; 50a histerectomizada) = <tspan font-weight="bold">3</tspan></text>
    <text x="170" y="276" font-size="11" fill="#1d4ed8">• <tspan font-weight="bold">CA-125:</tspan> Valor absoluto em UI/mL</text>

    <path d="M 470 290 L 470 330" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <polygon points="470,330 630,380 470,430 310,380" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="375" font-size="13" font-weight="800" fill="#78350f" text-anchor="middle">VALOR DO ESCORE RMI?</text>
    <text x="470" y="393" font-size="11" fill="#92400e" text-anchor="middle">Ponto de corte de consenso internacional: 200</text>

    <!-- Ramo RMI < 200 -->
    <path d="M 310 380 L 180 380 L 180 465" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="215" y="370" font-size="13" font-weight="800" fill="#16a34a">RMI &lt; 200 (Baixo Risco)</text>

    <rect x="50" y="470" width="260" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="180" y="495" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">BAIXA PROBABILIDADE MALIGNA (&lt; 3%)</text>
    <text x="65" y="520" font-size="11" fill="#15803d">• Risco de malignidade muito baixo</text>
    <text x="65" y="540" font-size="11" fill="#15803d">• Conduta por Ginecologista Geral</text>
    <text x="65" y="560" font-size="11" fill="#15803d">• Cirurgia conservadora / Laparoscopia</text>

    <!-- Ramo RMI >= 200 -->
    <path d="M 630 380 L 760 380 L 760 465" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="650" y="370" font-size="13" font-weight="800" fill="#dc2626">RMI &#8805; 200 (Alto Risco)</text>

    <rect x="630" y="470" width="260" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="760" y="495" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">ALTO RISCO DE CARCINOMA (75%)</text>
    <text x="645" y="520" font-size="11" fill="#b91c1c">• Encaminhar para <tspan font-weight="bold">Ginecologista Oncológico</tspan></text>
    <text x="645" y="540" font-size="11" fill="#b91c1c">• TC / RM de Abdome e Pelve para estadiamento</text>
    <text x="645" y="560" font-size="11" fill="#b91c1c">• Laparotomia exploradora com congelação</text>
    

  <!-- Footer -->
  <line x1="30" y1="585" x2="910" y2="585" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="602" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • FIGO • IOTA • OMS</text>
  <text x="910" y="602" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>