,432.592,480.658C448,507.5,448,525,448,533.75L448,542.5" id="mermaid-svg-L_B_D_0" class=" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_B_D_0" data-points="W3sieCI6MzU1LjU1MTkyODc4MzM4MjgsInkiOjM4MS40NDgwNzEyMTY2MTcyfSx7IngiOjQ0OCwieSI6NDkwfSx7IngiOjQ0OCwieSI6NTQ2LjV9XQ==" data-look="classic" marker-end="url(#mermaid-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_A_B_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(138, 490)"><g class="label" data-id="L_B_C_0" transform="translate(-90.4921875, -10.5)"><foreignObject width="180.984375" height="21"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "><p>Situações de Risco Crítico</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(448, 490)"><g class="label" data-id="L_B_D_0" transform="translate(-100, -21)"><foreignObject width="200" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Situações Frequentes com Total Segurança</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="mermaid-svg-flowchart-A-0" data-look="classic" transform="translate(293, 65)"><rect class="basic label-container" style="" x="-130" y="-57" width="260" height="114"/><g class="label" style="" transform="translate(-100, -42)"><rect/><foreignObject width="200" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">Triagem de Elegibilidade Médica dos LARCs (Critérios OMS / FEBRASGO)</tspan></p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-B-1" data-look="classic" transform="translate(293, 308)"><polygon points="136,0 272,-136 136,-272 0,-136" class="label-container" transform="translate(-135.5, 136)"/><g class="label" style="" transform="translate(-100, -21)"><rect/><foreignObject width="200" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">Avaliação do Perfil Clínico da Paciente</tspan></p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-C-3" data-look="classic" transform="translate(138, 740)"><rect class="basic label-container" style="" x="-130" y="-204" width="260" height="408"/><g class="label" style="" transform="translate(-100, -189)"><rect/><foreignObject width="200" height="378"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">CONTRAINDICAÇÕES ABSOLUTAS (Categoria 4 OMS):</tspan><br />• <tspan font-weight="bold">Câncer de Mama Atual:</tspan> Contraindicação a hormonais → <i>Apenas DIU de Cobre (Cat 1)</i><br />• <tspan font-weight="bold">DIP Ativa ou Cervicite Purulenta:</tspan> Não inserir DIU → <i>Indicar Implante (Cat 1)</i><br />• <tspan font-weight="bold">Sangramento Uterino Inexplicado:</tspan> Investigar histologia antes de qualquer DIU/SIU<br />• <tspan font-weight="bold">Mioma com Distorção Cavitária:</tspan> Risco de expulsão de DIU → <i>Indicar Implante (Cat 1)</i></p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-D-5" data-look="classic" transform="translate(448, 740)"><rect class="basic label-container" style="" x="-130" y="-193.5" width="260" height="387"/><g class="label" style="" transform="translate(-100, -178.5)"><rect/><foreignObject width="200" height="357"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">TOTALMENTE ELEGÍVEIS (Categorias 1 e 2 OMS):</tspan><br />• <tspan font-weight="bold">Nuliparidade &amp; Adolescência:</tspan> Implante (Cat 1) e SIU/DIU (Cat 2) - Totalmente indicados!<br />• <tspan font-weight="bold">TEV Prévio / Trombofilias:</tspan> DIU-Cu (Cat 1), SIU-LNG (Cat 2) e Implante (Cat 2)<br />• <tspan font-weight="bold">Enxaqueca com Aura:</tspan> DIU-Cu (Cat 1), SIU-LNG (Cat 2) e Implante (Cat 2)<br />• <tspan font-weight="bold">Pós-Parto Imediato (&lt;= 48h) &amp; Lactação:</tspan> Implante (Cat 1) e DIU/SIU (Cat 1/2)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mermaid-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mermaid-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>