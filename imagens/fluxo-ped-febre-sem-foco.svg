<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; line-height: 1.3; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">ALGORITMO DA FEBRE SEM FOCO (FSF) NO LACTENTE</text>
  <text x="50" y="78" class="subtitle">Estratificação de Risco de Infecção Bacteriana Grave • SBP 2024</text>
  <rect x="750" y="42" width="200" height="28" rx="6" fill="#0284c7" />
  <text x="850" y="60" text-anchor="middle" class="badge-text">SBP 2024 • INFECTO &amp; EMERGÊNCIA</text>


  <g class="card-shadow">
    <rect x="260" y="115" width="480" height="60" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="500" y="138" text-anchor="middle" class="node-bold">AVALIAÇÃO DA FEBRE SEM FOCO (FSF) NO LACTENTE</text>
    <text x="500" y="158" text-anchor="middle" class="node-text">Temperatura axilar ≥ 37,8°C (ou retal ≥ 38,0°C) sem causa evidente à anamnese e exame físico completo</text>
  </g>

  <path d="M 330 175 L 180 230" class="edge" />
  <path d="M 500 175 L 500 230" class="edge" />
  <path d="M 670 175 L 820 230" class="edge" />

  <!-- Grupo 1: < 28 dias -->
  <g class="card-shadow">
    <rect x="40" y="230" width="280" height="150" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="180" y="252" text-anchor="middle" class="node-bold" fill="#b91c1c">NEONATOS (&lt; 28 DIAS)</text>
    <text x="180" y="272" text-anchor="middle" class="node-bold" fill="#dc2626">ALTO RISCO POR DEFINIÇÃO</text>
    <text x="180" y="292" text-anchor="middle" class="node-text">• Internação hospitalar mandatória</text>
    <text x="180" y="308" text-anchor="middle" class="node-text">• Sepse screen completo obrigatório:</text>
    <text x="180" y="324" text-anchor="middle" class="node-text">  Hemograma + Hemoculturas</text>
    <text x="180" y="340" text-anchor="middle" class="node-text">  EAS + Urocultura por punção ou sonda</text>
    <text x="180" y="356" text-anchor="middle" class="node-text">  Punção lombar (LCR) + Rx tórax</text>
    <text x="180" y="372" text-anchor="middle" class="node-bold">• Ampicilina + Gentamicina IV imediata</text>
  </g>

  <!-- Grupo 2: 29 a 60/90 dias -->
  <g class="card-shadow">
    <rect x="350" y="230" width="300" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="500" y="252" text-anchor="middle" class="node-bold" fill="#b45309">LACTENTES DE 29 A 60/90 DIAS</text>
    <text x="500" y="272" text-anchor="middle" class="node-bold" fill="#d97706">CRITÉRIOS DE ROCHESTER / FILADÉLFIA</text>
    <text x="500" y="292" text-anchor="middle" class="node-text">• Bom estado geral / Escala de Yale normal</text>
    <text x="500" y="308" text-anchor="middle" class="node-text">• Previamente hígido, a termo, sem infecção prévia</text>
    <text x="500" y="324" text-anchor="middle" class="node-text">• Leucócitos: 5.000 a 15.000 (bastões &lt; 1.500)</text>
    <text x="500" y="340" text-anchor="middle" class="node-text">• EAS normal (&lt; 10 leucócitos/campo)</text>
    <text x="500" y="356" text-anchor="middle" class="node-text">• Procalcitonina &lt; 0,5 ng/mL e PCR &lt; 20 mg/L</text>
    <text x="500" y="372" text-anchor="middle" class="node-text">• Se fezes com sangue: leucócitos fezes &lt; 5</text>
  </g>

  <!-- Grupo 3: 3 a 36 meses -->
  <g class="card-shadow">
    <rect x="680" y="230" width="280" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="820" y="252" text-anchor="middle" class="node-bold" fill="#15803d">LACTENTES DE 3 A 36 MESES</text>
    <text x="820" y="272" text-anchor="middle" class="node-bold" fill="#16a34a">FOCO PRINCIPAL: ITU OCULTA</text>
    <text x="820" y="292" text-anchor="middle" class="node-text">• Com vacinação em dia (Pneumo/Meningo):</text>
    <text x="820" y="308" text-anchor="middle" class="node-text">  Bacteremia oculta rara (&lt; 0,5%)</text>
    <text x="820" y="324" text-anchor="middle" class="node-text">• Solicitar EAS + Urocultura se:</text>
    <text x="820" y="340" text-anchor="middle" class="node-text">  Meninas &lt; 24 meses</text>
    <text x="820" y="356" text-anchor="middle" class="node-text">  Meninos não circuncidados &lt; 12 meses</text>
    <text x="820" y="372" text-anchor="middle" class="node-text">  Febre &gt; 39°C com duração &gt; 24 a 48h</text>
  </g>

  <path d="M 400 380 L 300 440" class="edge-yes" />
  <path d="M 600 380 L 700 440" class="edge-no" />

  <g class="card-shadow">
    <rect x="100" y="440" width="380" height="120" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
    <text x="290" y="462" text-anchor="middle" class="node-bold" fill="#15803d">SE TODOS OS CRITÉRIOS DE BAIXO RISCO PRESENTES</text>
    <text x="290" y="482" text-anchor="middle" class="node-text">• Conduta ambulatorial segura com família confiável</text>
    <text x="290" y="500" text-anchor="middle" class="node-text">• Observação sem antibióticos OU Ceftriaxona 50 mg/kg IM dose única</text>
    <text x="290" y="518" text-anchor="middle" class="node-text">• Retorno obrigatório em 24 horas para reavaliação clínica</text>
    <text x="290" y="536" text-anchor="middle" class="node-text">• Orientação rigorosa de sinais de alerta (hipoatividade, recusa, vômitos)</text>
  </g>

  <g class="card-shadow">
    <rect x="520" y="440" width="380" height="120" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="710" y="462" text-anchor="middle" class="node-bold" fill="#b91c1c">SE QUALQUER CRITÉRIO DE RISCO ALTERADO</text>
    <text x="710" y="482" text-anchor="middle" class="node-text">• Internação hospitalar mandatória</text>
    <text x="710" y="500" text-anchor="middle" class="node-text">• Punção lombar para análise de LCR (descartar meningite)</text>
    <text x="710" y="518" text-anchor="middle" class="node-text">• Antibioticoterapia parenteral: Ceftriaxona 50-100 mg/kg/dia IV</text>
    <text x="710" y="536" text-anchor="middle" class="node-text">• Monitorização de sinais de sepse e choque séptico</text>
  </g>

  <path d="M 500 560 L 500 600" class="edge" />

  <g class="card-shadow">
    <rect x="200" y="600" width="600" height="75" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <text x="500" y="622" text-anchor="middle" class="node-bold">COLETA DE URINA NO LACTENTE SEM CONTROLE ESFINCTERIANO</text>
    <text x="500" y="642" text-anchor="middle" class="node-text">• SACO COLETOR: Aceitável APENAS para triagem se resultado estritamente NEGATIVO</text>
    <text x="500" y="658" text-anchor="middle" class="node-bold" fill="#b91c1c">• Se EAS alterado no saco coletor: CONFIRMAR OBRIGATORIAMENTE por Cateterismo Vesical ou Punção Suprapúbica!</text>
  </g>


  <!-- Footer Notice -->
  <rect x="30" y="700" width="940" height="35" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="722" text-anchor="middle" class="subtitle" style="font-size: 11px;">Diretriz Oficial: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>