<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradEnu" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadowEnu" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="920" height="620" fill="#f8fafc" rx="8" />

  <!-- Cabeçalho -->
  <rect x="20" y="16" width="880" height="54" rx="6" fill="url(#gradEnu)" filter="url(#shadowEnu)" />
  <text x="40" y="42" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">ALGORITMO CLÍNICO: ENURESE NOTURNA NA INFÂNCIA</text>
  <text x="40" y="58" fill="#e0e7ff" font-size="11" font-family="system-ui, -apple-system, sans-serif">Diretrizes Oficiais SBP 2024 • Estratificação Monossintomática, Alarme Noturno &amp; Desmopressina</text>

  <!-- Definição e Classificação -->
  <rect x="40" y="85" width="410" height="235" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadowEnu)" />
  <rect x="40" y="85" width="410" height="26" fill="#4f46e5" rx="6" />
  <text x="245" y="103" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. CRITÉRIOS DIAGNÓSTICOS &amp; CLASSIFICAÇÃO</text>
  <text x="55" y="127" fill="#4338ca" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Definição SBP 2024 / ICCS:</text>
  <text x="55" y="142" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  Perda involuntária de urina durante o sono em criança &gt;= 5 anos,</text>
  <text x="55" y="156" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  com frequência mínima de 1 a 2 vezes por semana por &gt;= 3 meses.</text>
  <text x="55" y="176" fill="#4338ca" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Classificação Fundamental:</text>
  <text x="55" y="192" fill="#0f172a" font-size="9.5" font-family="system-ui, sans-serif">  - <strong>Monossintomática:</strong> Apenas perda noturna, sem nenhum sintoma diurno.</text>
  <text x="55" y="208" fill="#b91c1c" font-size="9.5" font-family="system-ui, sans-serif">  - <strong>Não Monossintomática:</strong> Associada a sintomas miccionais diurnos</text>
  <text x="55" y="222" fill="#475569" font-size="8.5" font-family="system-ui, sans-serif">    (urgência, incontinência diurna, manobras de contenção, disúria).</text>
  <text x="55" y="238" fill="#0f172a" font-size="9.5" font-family="system-ui, sans-serif">  - <strong>Primária:</strong> Nunca alcançou 6 meses contínuos de continência seca.</text>
  <text x="55" y="254" fill="#0f172a" font-size="9.5" font-family="system-ui, sans-serif">  - <strong>Secundária:</strong> Retorno da enurese após período seco &gt;= 6 meses.</text>

  <!-- Propedêutica e Alarme -->
  <rect x="470" y="85" width="410" height="235" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="2" filter="url(#shadowEnu)" />
  <rect x="470" y="85" width="410" height="26" fill="#4338ca" rx="6" />
  <text x="675" y="103" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. PROPEDÊUTICA MÍNIMA &amp; MEDIDAS INICIAIS</text>
  <text x="485" y="127" fill="#4338ca" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Exames Laboratoriais Iniciais:</text>
  <text x="485" y="142" fill="#0f172a" font-size="9.5" font-family="system-ui, sans-serif">  - <strong>EAS e Urocultura:</strong> Descartar ITU, glicosúria (diabetes) e densidade.</text>
  <text x="485" y="156" fill="#0f172a" font-size="9.5" font-family="system-ui, sans-serif">  - <strong>Diário Miccional (3 a 7 dias):</strong> Avaliação da capacidade funcional.</text>
  <text x="485" y="174" fill="#047857" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Terapia Comportamental &amp; Uroterapia Padrão:</text>
  <text x="485" y="190" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  - Evitar ingestão de líquidos nas 2 horas antes de dormir.</text>
  <text x="485" y="204" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  - Esvaziamento vesical programado logo antes de deitar.</text>
  <text x="485" y="218" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  - Evitar cafeína, refrigerantes e excesso de sódio à noite.</text>
  <text x="485" y="232" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  - Tratamento agressivo de eventual constipação intestinal coexistente.</text>

  <!-- Abordagem Terapêutica -->
  <rect x="40" y="335" width="840" height="265" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="40" y="335" width="840" height="28" fill="#f1f5f9" rx="6" />
  <text x="55" y="354" fill="#0f172a" font-size="11.5" font-weight="bold" font-family="system-ui, sans-serif">3. TRATAMENTOS DE PRIMEIRA LINHA PARA ENURESE MONOSSINTOMÁTICA</text>

  <rect x="55" y="375" width="375" height="135" rx="5" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="65" y="395" fill="#166534" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">Opção 1: Alarme Noturno (Tratamento Padrão-Ouro Curativo):</text>
  <text x="65" y="415" fill="#1e293b" font-size="9.5" font-family="system-ui, sans-serif">• Dispositivo sensor de umidade acoplado à roupa íntima.</text>
  <text x="65" y="430" fill="#1e293b" font-size="9" font-family="system-ui, sans-serif">• Mecanismo: Condicionamento comportamental do centro do despertar.</text>
  <text x="65" y="445" fill="#1e293b" font-size="9" font-family="system-ui, sans-serif">• Maior taxa de resposta sustentada e menor índice de recidiva.</text>
  <text x="65" y="460" fill="#166534" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">• Duração mínima: 3 meses ou até 14 noites secas consecutivas.</text>

  <rect x="450" y="375" width="415" height="135" rx="5" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="460" y="395" fill="#1d4ed8" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">Opção 2: Desmopressina (Acetato de Desmopressina / DDAVP):</text>
  <text x="460" y="415" fill="#1e293b" font-size="9.5" font-family="system-ui, sans-serif">• Indicado se poliúria noturna ou necessidade de resposta rápida (acampamentos).</text>
  <text x="460" y="430" fill="#1e293b" font-size="9" font-family="system-ui, sans-serif">• Dose: Comprimido 0,2 mg a 0,4 mg ou Melt liofilizado 120 mcg a 240 mcg 1h antes de deitar.</text>
  <text x="460" y="445" fill="#b91c1c" font-size="9" font-weight="bold" font-family="system-ui, sans-serif">• ALERTA CRÍTICO: Restringir rigorosamente líquidos 1h antes e 8h após!</text>
  <text x="460" y="460" fill="#475569" font-size="8.5" font-family="system-ui, sans-serif">  Risco de intoxicação hídrica, convulsão e hiponatremia grave se ingerir água.</text>

  <rect x="55" y="520" width="810" height="65" rx="5" fill="#fffbeb" stroke="#fef3c7" />
  <text x="65" y="538" fill="#92400e" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">CASOS REFRATÁRIOS OU ENURESE NÃO-MONOSSINTOMÁTICA:</text>
  <text x="65" y="555" fill="#78350f" font-size="9" font-family="system-ui, sans-serif">Investigar Bexiga Hiperativa / Disfunção Vesical. Associar anticolinérgicos (Oxibutinina 0,1 a 0,2 mg/kg/dose 2x/dia) e encaminhar ao Nefrologista Pediátrico.</text>
</svg>