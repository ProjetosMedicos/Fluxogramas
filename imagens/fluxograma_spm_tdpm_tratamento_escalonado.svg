<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">TRATAMENTO ESCALONADO DA SPM E DO TDPM</text>
  <text x="970" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 32 • Algoritmo Farmacológico</text>

  <!-- Content -->
  
    <!-- Nível 1: Não Farmacológico -->
    <rect x="80" y="90" width="840" height="95" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="115" font-size="14" font-weight="800" fill="#15803d" text-anchor="middle">ETAPA 1: MEDIDAS NÃO FARMACOLÓGICAS &amp; SUPLEMENTAÇÃO (TODAS AS PACIENTES)</text>
    <text x="500" y="137" font-size="11" fill="#166534" text-anchor="middle">• Exercício aeróbico regular (liberação de endorfinas e neuroplasticidade) • Redução de sal, cafeína e álcool</text>
    <text x="500" y="157" font-size="11" fill="#166534" text-anchor="middle">• Carbonato de Cálcio (1.000 a 1.200 mg/dia) • Piridoxina / Vitamina B6 (50 a 100 mg/dia) • Psicoterapia TCC</text>

    <!-- Seta para Nível 2 -->
    <path d="M 500 185 L 500 220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Nível 2: 1ª Linha TDPM (ISRS) e Hormonal (Drospirenona) -->
    <rect x="80" y="225" width="840" height="230" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="252" font-size="14" font-weight="800" fill="#6d28d9" text-anchor="middle">ETAPA 2: TRATAMENTO DE PRIMEIRA LINHA FARMACOLÓGICO</text>

    <!-- Caixa A: ISRS -->
    <rect x="105" y="270" width="375" height="165" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="292" y="293" font-size="12" font-weight="800" fill="#5b21b6" text-anchor="middle">A. ISRS (PADRÃO-OURO PARA TDPM)</text>
    <text x="120" y="315" font-size="11" font-weight="700" fill="#4c1d95">Esquemas Validados:</text>
    <text x="120" y="333" font-size="10" fill="#334155">• Sertralina: 50 a 100 mg/dia</text>
    <text x="120" y="351" font-size="10" fill="#334155">• Fluoxetina: 20 mg/dia</text>
    <text x="120" y="369" font-size="10" fill="#334155">• Escitalopram: 10 a 20 mg/dia</text>
    <text x="120" y="393" font-size="10" font-weight="700" fill="#059669">Modalidade de Administração:</text>
    <text x="120" y="411" font-size="10" fill="#059669">- Uso contínuo diário OU Intermitente na Fase Lútea</text>
    <text x="125" y="425" font-size="9" fill="#059669">(iniciar no 14º dia e suspender no 1º dia do fluxo - resposta rápida!)</text>

    <!-- Caixa B: Hormonal com Drospirenona -->
    <rect x="520" y="270" width="375" height="165" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="707" y="293" font-size="12" font-weight="800" fill="#5b21b6" text-anchor="middle">B. SUPRESSÃO OVULATÓRIA COM DROSPIRENONA</text>
    <text x="535" y="315" font-size="11" font-weight="700" fill="#4c1d95">Opção Preferencial se Desejo Contraceptivo:</text>
    <text x="535" y="335" font-size="10" fill="#334155">• Etinilestradiol 20 mcg + Drospirenona 3 mg (Regime 24/4)</text>
    <text x="535" y="353" font-size="10" fill="#334155">• Regime contínuo estendido (elimina a flutuação hormonal)</text>
    <text x="535" y="375" font-size="11" font-weight="700" fill="#4c1d95">Mecanismo Único:</text>
    <text x="535" y="393" font-size="10" fill="#334155">- Drospirenona é análoga da espironolactona com ação</text>
    <text x="535" y="409" font-size="10" fill="#334155">  antimineralocorticoide e antiandrogênica potente.</text>

    <!-- Seta para Nível 3 -->
    <path d="M 500 455 L 500 490" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Nível 3: Sintomas Específicos &amp; Casos Refratários -->
    <rect x="80" y="495" width="840" height="145" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="522" font-size="14" font-weight="800" fill="#c2410c" text-anchor="middle">ETAPA 3: REFRATARIEDADE, ADJUVÂNCIA &amp; CASOS GRAVES</text>
    <text x="110" y="550" font-size="11" font-weight="700" fill="#9a3412">• Sintomas Somáticos Refratários (Edema / Mastalgia grave):</text>
    <text x="120" y="568" font-size="10" fill="#431407">Espironolactona 25 a 100 mg/dia administrada exclusivamente na fase lútea (dias 14 ao 28 do ciclo).</text>
    <text x="110" y="595" font-size="11" font-weight="700" fill="#9a3412">• Falha de ISRS e Drospirenona em Casos Incapacitantes Extremos:</text>
    <text x="120" y="613" font-size="10" fill="#431407">Análogos de GnRH (Goserelina / Leuprorrelina) com add-back therapy obrigatória (tibolona ou estrogênio+progestagênio).</text>
    <text x="120" y="629" font-size="9" fill="#991b1b">Ooforoplastia / Ooforectomia bilateral: reservada a cenários excepcionais sem resposta após esgotamento de todas as etapas.</text>
    

  <!-- Footer -->
  <line x1="30" y1="645" x2="970" y2="645" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="662" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • ACOG • FIGO • OMS (MEC 5ª Ed)</text>
  <text x="970" y="662" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>