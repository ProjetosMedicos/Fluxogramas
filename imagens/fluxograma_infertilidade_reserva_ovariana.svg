63"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Alta Reserva Ovariana / Síndrome dos Ovários Policísticos</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="mermaid-svg-flowchart-A-0" data-look="classic" transform="translate(448, 54.5)"><rect class="basic label-container" style="" x="-130" y="-46.5" width="260" height="93"/><g class="label" style="" transform="translate(-100, -31.5)"><rect/><foreignObject width="200" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">Avaliação da Reserva Ovariana e Fator Ovulatório</tspan></p></span></div></foreignObject></g></g><g class="node default dec " id="mermaid-svg-flowchart-B-1" data-look="classic" transform="translate(448, 308)"><polygon points="157,0 314,-157 157,-314 0,-157" class="label-container" transform="translate(-156.5, 157)" style="fill:#fef3c7 !important;stroke:#d97706 !important;stroke-width:2px !important"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -42)"><rect/><foreignObject width="200" height="84"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><tspan font-weight="bold">Hormônio Antimülleriano (AMH) &amp; Contagem de Folículos Antrais (CFA)</tspan></p></span></div></foreignObject></g></g><g class="node default good " id="mermaid-svg-flowchart-C-3" data-look="classic" transform="translate(138, 750.5)"><rect class="basic label-container" style="fill:#dcfce7 !important;stroke:#16a34a !important;stroke-width:2px !important" x="-130" y="-120" width="260" height="240"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -105)"><rect/><foreignObject width="200" height="210"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><tspan font-weight="bold">Estratificação Normal:</tspan><br />• <tspan font-weight="bold">AMH:</tspan> 1,0 a 3,5 ng/mL<br />• <tspan font-weight="bold">CFA (USTV no D2-D4):</tspan> 8 a 15 folículos antrais no total dos ovários<br />• <tspan font-weight="bold">FSH Basal:</tspan> &lt; 10 UI/L<br />• <i>Prognóstico:</i> Resposta ovariana fisiológica e excelente probabilidade de sucesso</p></span></div></foreignObject></g></g><g class="node default low " id="mermaid-svg-flowchart-D-5" data-look="classic" transform="translate(448, 750.5)"><rect class="basic label-container" style="fill:#fee2e2 !important;stroke:#dc2626 !important;stroke-width:2px !important" x="-130" y="-151.5" width="260" height="303"/><g class="label" style="font-size:14px !important;color:#991b1b !important" transform="translate(-100, -136.5)"><rect/><foreignObject width="200" height="273"><div style="font-size: 14px !important; color: rgb(153, 27, 27) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#991b1b !important" class="nodeLabel "><p><tspan font-weight="bold">Baixa Reserva Ovariana:</tspan><br />• <tspan font-weight="bold">AMH:</tspan> &lt; 1,0 ng/mL (crítico se &lt; 0,5 ng/mL)<br />• <tspan font-weight="bold">CFA:</tspan> &lt; 5 a 7 folículos antrais totais<br />• <tspan font-weight="bold">FSH Basal:</tspan> &gt; 10 a 12 UI/L<br />• <i>Conduta:</i> Não postergar o tratamento! Agilizar tratamentos de alta complexidade (FIV) ou considerar óvulos doados (ovodoação)</p></span></div></foreignObject></g></g><g class="node default sop " id="mermaid-svg-flowchart-E-7" data-look="classic" transform="translate(758, 750.5)"><rect class="basic label-container" style="fill:#fef9c3 !important;stroke:#ca8a04 !important;stroke-width:2px !important" x="-130" y="-172.5" width="260" height="345"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -157.5)"><rect/><foreignObject width="200" height="315"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><tspan font-weight="bold">Alta Reserva Ovariana / Perfil SOP:</tspan><br />• <tspan font-weight="bold">AMH:</tspan> &gt; 3,5 a 5,0 ng/mL<br />• <tspan font-weight="bold">CFA:</tspan> &gt; 20 folículos antrais totais<br />• <i>Conduta de Indução:</i> <tspan font-weight="bold">Letrozol</tspan> é a primeira linha para coito programado<br />• <i>Alerta na FIV:</i> Risco elevado de Síndrome de Hiperestímulo Ovariano (SHO) → usar gatilho com agonista de GnRH e transferência congelada (freeze-all)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mermaid-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mermaid-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>