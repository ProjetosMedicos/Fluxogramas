 transform="translate(609, 1007.5)"><g class="label" data-id="L_E_G_0" transform="translate(-26.4140625, -10.5)"><foreignObject width="52.828125" height="21"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "><p>Crônico</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="mermaid-svg-flowchart-A-0" data-look="classic" transform="translate(296, 54.5)"><rect class="basic label-container" style="" x="-130" y="-46.5" width="260" height="93"/><g class="label" style="" transform="translate(-100, -31.5)"><rect/><foreignObject width="200" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">Mulher com Sangramento Uterino Anormal (SUA)</tspan></p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-B-1" data-look="classic" transform="translate(296, 208)"><rect class="basic label-container" style="" x="-130" y="-57" width="260" height="114"/><g class="label" style="" transform="translate(-100, -42)"><rect/><foreignObject width="200" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">Passo Zero Obrigatório:</tspan><br />Solicitar Beta-hCG para afastar gravidez ou causas obstétricas</p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-C-3" data-look="classic" transform="translate(296, 461.5)"><polygon points="146.5,0 293,-146.5 146.5,-293 0,-146.5" class="label-container" transform="translate(-146, 146.5)"/><g class="label" style="" transform="translate(-100, -31.5)"><rect/><foreignObject width="200" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">Beta-hCG Negativo?<br />Avaliar Estabilidade Hemodinâmica</tspan></p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-D-5" data-look="classic" transform="translate(138, 836)"><rect class="basic label-container" style="" x="-130" y="-109.5" width="260" height="219"/><g class="label" style="" transform="translate(-100, -94.5)"><rect/><foreignObject width="200" height="189"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">SUA AGUDO GRAVE (EMERGÊNCIA):</tspan><br />1. 2 Acessos calibrosos 14 ou 16G + Cristaloide + Hemotransfusão<br />2. Ácido Tranexâmico 1g EV<br />3. Tamponamento com Balão de Foley (30 a 50 mL) / Cirurgia</p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-E-7" data-look="classic" transform="translate(454, 836)"><polygon points="136,0 272,-136 136,-272 0,-136" class="label-container" transform="translate(-135.5, 136)"/><g class="label" style="" transform="translate(-100, -21)"><rect/><foreignObject width="200" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">Apresentação Clínica Temporal</tspan></p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-F-9" data-look="classic" transform="translate(299, 1152.5)"><rect class="basic label-container" style="" x="-130" y="-78" width="260" height="156"/><g class="label" style="" transform="translate(-100, -63)"><rect/><foreignObject width="200" height="126"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">SUA Agudo Estável (Tabela 45.4 FEBRASGO):</tspan><br />Terapia hormonal oral de ataque e desmame<br />(ACO 30-35mcg EE OU Medroxiprogesterona)</p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-G-11" data-look="classic" transform="translate(609, 1152.5)"><rect class="basic label-container" style="" x="-130" y="-109.5" width="260" height="219"/><g class="label" style="" transform="translate(-100, -94.5)"><rect/><foreignObject width="200" height="189"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><tspan font-weight="bold">SUA Crônico: Investigação PALM-COEIN</tspan><br />1. Exame físico pélvico + Hemograma + Ferritina<br />2. Ultrassonografia Transvaginal (USTV)<br />3. Biópsia Endometrial com Pipelle se indicada</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mermaid-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mermaid-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>