<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; line-height: 1.3; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">MANEJO ESCALONADO DA ASMA INFANTIL & CRISE AGUDA</text>
  <text x="50" y="78" class="subtitle">Etapas GINA / Diretrizes da Sociedade Brasileira de Pediatria (SBP 2024)</text>
  <rect x="750" y="42" width="200" height="28" rx="6" fill="#0284c7" />
  <text x="850" y="60" text-anchor="middle" class="badge-text">SBP 2024 • PNEUMOLOGIA</text>


  <!-- Node 1: Triagem e Gravidade -->
  <g class="card-shadow">
    <rect x="320" y="115" width="360" height="60" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="500" y="138" text-anchor="middle" class="node-bold">AVALIAÇÃO DA CRISE AGUDA DE ASMA (SBP 2024)</text>
    <text x="500" y="158" text-anchor="middle" class="node-text">Frequência respiratória, tiragens, sibilância, fala e SpO2 em ar ambiente</text>
  </g>

  <path d="M 400 175 L 230 230" class="edge" />
  <path d="M 600 175 L 770 230" class="edge" />

  <!-- Branch Left: Leve a Moderada -->
  <g class="card-shadow">
    <rect x="80" y="230" width="300" height="90" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
    <text x="230" y="252" text-anchor="middle" class="node-bold" fill="#15803d">CRISE LEVE A MODERADA (SpO2 ≥ 92-95%)</text>
    <text x="230" y="272" text-anchor="middle" class="node-text">• Fala frases completas / choro mantido</text>
    <text x="230" y="288" text-anchor="middle" class="node-text">• Tiragens intercostais leves, FR discretamente aumentada</text>
    <text x="230" y="304" text-anchor="middle" class="node-text">• Sibilos expiratórios difusos sem esforço exaustivo</text>
  </g>

  <!-- Branch Right: Grave a Muito Grave -->
  <g class="card-shadow">
    <rect x="620" y="230" width="300" height="90" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="770" y="252" text-anchor="middle" class="node-bold" fill="#b91c1c">CRISE GRAVE / AMEAÇADORA (SpO2 &lt; 92%)</text>
    <text x="770" y="272" text-anchor="middle" class="node-text">• Frases truncadas / palavras isoladas / gemência</text>
    <text x="770" y="288" text-anchor="middle" class="node-text">• Tiragem subcostal grave, batimento de asa de nariz</text>
    <text x="770" y="304" text-anchor="middle" class="node-text">• Tórax silencioso (ausência de sibilos por broncoespasmo grave)</text>
  </g>

  <!-- Conduta Leve -->
  <path d="M 230 320 L 230 370" class="edge" />
  <g class="card-shadow">
    <rect x="70" y="370" width="320" height="125" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <text x="230" y="392" text-anchor="middle" class="node-bold">CONDUTA: PROTOCOLO DE RESGATE (1ª HORA)</text>
    <text x="230" y="412" text-anchor="middle" class="node-text">• Salbutamol spray 100 mcg com espaçador valvulado:</text>
    <text x="230" y="428" text-anchor="middle" class="node-text">  4 a 8 jatos a cada 20 minutos (3 ciclos na 1ª hora)</text>
    <text x="230" y="444" text-anchor="middle" class="node-text">• Corticoide Oral Precoce se não alívio imediato:</text>
    <text x="230" y="460" text-anchor="middle" class="node-text">  Prednisolona 1 a 2 mg/kg/dia (máx 40-50 mg) por 3 a 5 dias</text>
    <text x="230" y="476" text-anchor="middle" class="node-text">• Oxigenoterapia suplementar se SpO2 &lt; 93-94%</text>
  </g>

  <!-- Conduta Grave -->
  <path d="M 770 320 L 770 370" class="edge" />
  <g class="card-shadow">
    <rect x="610" y="370" width="320" height="135" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
    <text x="770" y="392" text-anchor="middle" class="node-bold">CONDUTA: SALA DE EMERGÊNCIA / UTI</text>
    <text x="770" y="412" text-anchor="middle" class="node-text">• Oxigênio em alto fluxo para manter SpO2 93 a 95%</text>
    <text x="770" y="428" text-anchor="middle" class="node-text">• Salbutamol (10 jatos) + Ipratrópio (20-40 gts / 4-8 jatos) 20/20m</text>
    <text x="770" y="444" text-anchor="middle" class="node-text">• Metilprednisolona 1-2 mg/kg IV ou Hidrocortisona 5 mg/kg IV</text>
    <text x="770" y="460" text-anchor="middle" class="node-text">• Sulfato de Magnésio IV (40 a 50 mg/kg em 20-30 min, máx 2g)</text>
    <text x="770" y="476" text-anchor="middle" class="node-text">• Considerar VNI (CPAP/BiPAP) e preparar sequência rápida</text>
    <text x="770" y="492" text-anchor="middle" class="node-text">• Adrenalina 0,01 mg/kg IM se anafilaxia associada</text>
  </g>

  <!-- Conexões para Desfecho -->
  <path d="M 230 495 L 360 550" class="edge" />
  <path d="M 770 505 L 640 550" class="edge" />

  <!-- Desfecho e Manutenção -->
  <g class="card-shadow">
    <rect x="220" y="550" width="560" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <text x="500" y="572" text-anchor="middle" class="node-bold" fill="#1e40af">PLANO DE AÇÃO E TRATAMENTO DE MANUTENÇÃO (GINA / SBP)</text>
    <text x="500" y="594" text-anchor="middle" class="node-text">• Alta após estabilidade clínica, SpO2 &gt; 94% em ar ambiente e espaçamento de SABA para 4/4h</text>
    <text x="500" y="612" text-anchor="middle" class="node-text">• Corticoterapia inalatória (CI) profilática diária mandatória: Budesonida ou Fluticasona</text>
    <text x="500" y="630" text-anchor="middle" class="node-text">• Crianças ≥ 6 anos: CI em dose baixa + Formoterol como alívio e manutenção preferencial</text>
    <text x="500" y="648" text-anchor="middle" class="node-text">• Lactente sibilante: Investigar fenótipos (transitório precoce vs atópico) e calcular IPA</text>
  </g>


  <!-- Footer Notice -->
  <rect x="30" y="700" width="940" height="35" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="722" text-anchor="middle" class="subtitle" style="font-size: 11px;">Diretriz Oficial: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>