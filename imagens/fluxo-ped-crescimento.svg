<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #1e293b; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; stroke-dasharray: none; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.5; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">ALGORITMO DE INVESTIGAÇÃO DA BAIXA ESTATURA INFANTIL</text>
  <text x="50" y="78" class="subtitle">Estatura/Idade &lt; Escore Z -2 (ou &lt; Percentil 3) • Tratado de Pediatria SBP 6ª Edição (2024)</text>
  <rect x="790" y="42" width="160" height="28" rx="6" fill="#0284c7" />
  <text x="870" y="60" text-anchor="middle" class="badge-text">SBP 2024 • PUERICULTURA</text>

  <!-- Node 1: Triagem -->
  <g class="card-shadow">
    <rect x="350" y="120" width="300" height="65" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="500" y="145" text-anchor="middle" class="node-bold">AVALIAÇÃO DA VELOCIDADE DE CRESCIMENTO</text>
    <text x="500" y="168" text-anchor="middle" class="node-text">Medir em intervalo mínimo de 6 meses (cm/ano)</text>
  </g>

  <!-- Edges from Node 1 -->
  <path d="M 400 185 L 250 240" class="edge" />
  <path d="M 600 185 L 750 240" class="edge" />

  <!-- Branch Left: VC Normal -->
  <g class="card-shadow">
    <rect x="100" y="240" width="300" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
    <text x="250" y="265" text-anchor="middle" class="node-bold" fill="#15803d">VELOCIDADE NORMAL (&gt; p25)</text>
    <text x="250" y="285" text-anchor="middle" class="node-text">Variante Normal do Crescimento</text>
    <text x="250" y="300" text-anchor="middle" class="node-text">Solicitar Radiografia de Mão/Punho (Idade Óssea)</text>
  </g>

  <!-- Branch Right: VC Diminuída -->
  <g class="card-shadow">
    <rect x="600" y="240" width="300" height="70" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="750" y="265" text-anchor="middle" class="node-bold" fill="#b91c1c">VELOCIDADE ANORMAL (&lt; p25)</text>
    <text x="750" y="285" text-anchor="middle" class="node-text">Baixa Estatura Patológica Provável</text>
    <text x="750" y="300" text-anchor="middle" class="node-text">Investigação laboratorial e genética mandatória</text>
  </g>

  <!-- Sub-branches Left: CDRN vs Familiar -->
  <path d="M 180 310 L 120 380" class="edge" />
  <path d="M 320 310 L 380 380" class="edge" />

  <g class="card-shadow">
    <rect x="30" y="380" width="220" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="140" y="405" text-anchor="middle" class="node-bold">Baixa Estatura Familiar</text>
    <text x="140" y="425" text-anchor="middle" class="node-text">• Idade Óssea = Idade Cronológica</text>
    <text x="140" y="445" text-anchor="middle" class="node-text">• Estatura Compatível com Alvo Parental</text>
    <text x="140" y="465" text-anchor="middle" class="node-text">• Puberdade e Menarca na idade usual</text>
    <text x="140" y="480" text-anchor="middle" class="node-bold" fill="#15803d">Conduta: Expectante / Acompanhar</text>
  </g>

  <g class="card-shadow">
    <rect x="270" y="380" width="230" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="385" y="405" text-anchor="middle" class="node-bold">Retardo Constitucional (CDRN)</text>
    <text x="385" y="425" text-anchor="middle" class="node-text">• Idade Óssea ATRASADA (&gt; 2 DP)</text>
    <text x="385" y="445" text-anchor="middle" class="node-text">• História familiar de puberdade tardia</text>
    <text x="385" y="465" text-anchor="middle" class="node-text">• Estirão tardio e estatura final normal</text>
    <text x="385" y="480" text-anchor="middle" class="node-bold" fill="#0284c7">Conduta: Tranquilizar a família</text>
  </g>

  <!-- Sub-branches Right: Proporcionada vs Desproporcionada -->
  <path d="M 680 310 L 610 380" class="edge" />
  <path d="M 820 310 L 890 380" class="edge" />

  <g class="card-shadow">
    <rect x="520" y="380" width="210" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="625" y="405" text-anchor="middle" class="node-bold">Desproporcionada</text>
    <text x="625" y="425" text-anchor="middle" class="node-text">• Relação Segmento Sup/Inf alterada</text>
    <text x="625" y="445" text-anchor="middle" class="node-text">• Displasias ósseas (Acondroplasia)</text>
    <text x="625" y="465" text-anchor="middle" class="node-text">• Raquitismo carencial/hipofosfatêmico</text>
    <text x="625" y="480" text-anchor="middle" class="node-bold" fill="#dc2626">Rx de esqueleto completo</text>
  </g>

  <g class="card-shadow">
    <rect x="750" y="380" width="220" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text x="860" y="405" text-anchor="middle" class="node-bold">Proporcionada Patológica</text>
    <text x="860" y="425" text-anchor="middle" class="node-text">• Doenças crônicas (Celíaca, DRC)</text>
    <text x="860" y="445" text-anchor="middle" class="node-text">• Endocrinopatias (Hipotireoidismo, GH)</text>
    <text x="860" y="465" text-anchor="middle" class="node-text">• Cromossomopatias (Síndrome de Turner)</text>
    <text x="860" y="480" text-anchor="middle" class="node-bold" fill="#7c3aed">Cariótipo se menina / IGF-1 / TSH</text>
  </g>

  <!-- Bottom: Roteiro Laboratorial de 1ª Linha -->
  <g class="card-shadow">
    <rect x="50" y="525" width="900" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="70" y="555" class="node-bold" fill="#0f172a">ROTEIRO PROPEDÊUTICO LABORATORIAL DE 1ª LINHA NA BAIXA ESTATURA PATOLÓGICA (SBP 2024)</text>
    <text x="70" y="585" class="node-text">1. <tspan font-weight="700">Triagem Geral:</tspan> Hemograma, VHS/PCR, Creatinina, Eletrólitos (Na, K, Ca, P, FA), Gasometria venosa (rastreio de ATR).</text>
    <text x="70" y="610" class="node-text">2. <tspan font-weight="700">Rastreio de Doença Celíaca:</tspan> Anti-tTG IgA + IgA total (causa insidiosa de baixa estatura sem diarreia clássica).</text>
    <text x="70" y="635" class="node-text">3. <tspan font-weight="700">Endocrinológico:</tspan> TSH e T4L (hipotireoidismo), IGF-1 e IGFBP-3 (avaliação do eixo GH/IGF-1).</text>
    <text x="70" y="660" class="node-text">4. <tspan font-weight="700">Cariótipo Obrigatório:</tspan> Banda G <tspan font-weight="700" fill="#dc2626">em TODA MENINA com baixa estatura sem causa evidente</tspan> (rastreio de Turner 45,X).</text>
    <text x="70" y="685" class="node-text">5. <tspan font-weight="700">Alvo Genético (Tanner):</tspan> Meninos: [Altura Pai + (Altura Mãe + 13)] / 2 ± 5 cm | Meninas: [(Altura Pai - 13) + Altura Mãe] / 2 ± 5 cm.</text>
  </g>
</svg>