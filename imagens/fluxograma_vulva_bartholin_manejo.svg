<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="940" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">ALGORITMO DE MANEJO DA GLÂNDULA DE BARTHOLIN</text>
  <text x="910" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">FEBRASGO Cap. 38 • Patologia Vulvar</text>

  <!-- Content -->
  
    <rect x="270" y="95" width="400" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="120" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">PATOLOGIA DA GLÂNDULA VESTIBULAR MAIOR (BARTHOLIN)</text>
    <text x="470" y="140" font-size="11" fill="#475569" text-anchor="middle">Localização: Terço inferior do grande lábio (posições 4h ou 8h do intróito)</text>

    <path d="M 370 155 L 230 205" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 570 155 L 710 205" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Cisto -->
    <rect x="50" y="215" width="360" height="360" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="230" y="245" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">CISTO DE BARTHOLIN (NÃO INFECCIOSO)</text>
    <text x="70" y="275" font-size="12" fill="#15803d">• Obstrução ductal com retenção estéril de muco.</text>
    <text x="70" y="295" font-size="12" fill="#15803d">• Nódulo indolor, móvel, flácido, sem calor/rubor.</text>

    <text x="70" y="335" font-size="12" font-weight="700" fill="#14532d">Conduta Clínica Baseada em Sintomas:</text>
    <text x="80" y="355" font-size="11" fill="#166534">- <tspan font-weight="bold">Assintomático pequeno:</tspan> Conduta expectante.</text>
    <text x="80" y="375" font-size="11" fill="#166534">- <tspan font-weight="bold">Volumoso / Desconforto ao coito/sentar:</tspan></text>
    <text x="90" y="393" font-size="11" fill="#166534">Marsupialização cirúrgica eletiva.</text>

    <text x="70" y="435" font-size="12" font-weight="700" fill="#b91c1c">• ALERTA EM MULHERES &gt; 40 ANOS:</text>
    <text x="80" y="455" font-size="11" fill="#991b1b">Aparecimento de massa de Bartholin após os 40 anos</text>
    <text x="80" y="473" font-size="11" fill="#7f1d1d">exige <tspan font-weight="bold">Biópsia da parede</tspan> para exclusão mandatória</text>
    <text x="80" y="491" font-size="11" fill="#7f1d1d">de Adenocarcinoma primário da glândula de Bartholin.</text>

    <!-- Abscesso -->
    <rect x="530" y="215" width="360" height="360" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="710" y="245" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">ABSCESSO DE BARTHOLIN (AGUDO)</text>
    <text x="550" y="275" font-size="12" fill="#b91c1c">• Infecção polimicrobiana aguda com supuração.</text>
    <text x="550" y="295" font-size="12" fill="#b91c1c">• Dor lancinante, edema tenso, eritema e flutuação.</text>

    <text x="550" y="335" font-size="12" font-weight="700" fill="#7f1d1d">Terapêutica Cirúrgica Imediata:</text>
    <text x="560" y="355" font-size="11" font-weight="800" fill="#b91c1c">1. CATETER DE WORD (PADRÃO-OURO):</text>
    <text x="570" y="373" font-size="11" fill="#991b1b">Incisão de 5 mm na mucosa, drenagem e inserção</text>
    <text x="570" y="391" font-size="11" fill="#991b1b">do cateter inflado com 2-3 mL de SF. Manter por</text>
    <text x="570" y="409" font-size="11" fill="#7f1d1d"><tspan font-weight="bold">4 a 6 semanas</tspan> para epitelização permanente do óstio.</text>

    <text x="560" y="435" font-size="11" font-weight="800" fill="#b91c1c">2. MARSUPIALIZAÇÃO CIRÚRGICA:</text>
    <text x="570" y="453" font-size="11" fill="#991b1b">Eversão das bordas da cápsula com pontos absorvíveis.</text>

    <text x="550" y="485" font-size="11" fill="#64748b">*Simples incisão e drenagem tem recidiva &gt; 50%!</text>
    

  <!-- Footer -->
  <line x1="30" y1="585" x2="910" y2="585" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="602" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • SBM • FIGO • ISSVD</text>
  <text x="910" y="602" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>