<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Cabeçalho -->
  <rect x="40" y="30" width="920" height="90" rx="12" fill="url(#grad-indigo)" filter="url(#shadow)"/>
  <text x="500" y="68" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">MANEJO DA HIPOGLICEMIA E DISTÚRBIOS METABÓLICOS DO RN</text>
  <text x="500" y="96" text-anchor="middle" fill="#c7d2fe" font-size="14" font-weight="600">Diretrizes da Sociedade Brasileira de Pediatria (SBP, 2024) — Seção 10 (Neonatologia)</text>

  <!-- Seção 1: Hipoglicemia Neonatal -->
  <rect x="40" y="150" width="920" height="520" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="180" text-anchor="middle" fill="#818cf8" font-size="16" font-weight="800">PROTOCOLO DE RASTREIO E MANEJO DA HIPOGLICEMIA NEONATAL</text>

  <!-- População de Risco -->
  <g transform="translate(60, 205)">
    <rect x="0" y="0" width="410" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="205" y="24" text-anchor="middle" fill="#fde047" font-size="12" font-weight="800">POPULAÇÃO ALVO PARA RASTREAMENTO GLICÊMICO</text>
    <text x="15" y="45" fill="#f8fafc" font-size="11">• Filhos de Mães Diabéticas (DMG ou prévio) ou GIG</text>
    <text x="15" y="63" fill="#f8fafc" font-size="11">• Pequenos para Idade Gestacional (PIG) ou Prematuros (&lt; 37 sem)</text>
    <text x="15" y="81" fill="#f8fafc" font-size="11">• Asfixia perinatal, hipotermia ou suspeita de sepse</text>
  </g>

  <!-- Valores de Corte SBP -->
  <g transform="translate(500, 205)">
    <rect x="0" y="0" width="440" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="220" y="24" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="800">VALORES DE CORTE DE GLICEMIA (SBP 2024)</text>
    <text x="15" y="45" fill="#cbd5e1" font-size="11">• Primeiras 4 horas de vida: meta ≥ 40 mg/dL (alerta se &lt; 25 mg/dL)</text>
    <text x="15" y="63" fill="#cbd5e1" font-size="11">• 4 a 24 horas de vida: meta ≥ 45 mg/dL (alerta se &lt; 35 mg/dL)</text>
    <text x="15" y="81" fill="#a7f3d0" font-size="11" font-weight="700">• Após 24 horas de vida: meta mantida ≥ 45 a 50 mg/dL</text>
  </g>

  <!-- Fluxo Assintomático vs Sintomático -->
  <g transform="translate(60, 320)">
    <!-- Assintomático -->
    <rect x="0" y="0" width="410" height="320" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <text x="205" y="28" text-anchor="middle" fill="#34d399" font-size="13" font-weight="800">RN ASSINTOMÁTICO COM GLICEMIA &lt; 40-45 mg/dL</text>
    <text x="15" y="55" fill="#f8fafc" font-size="11" font-weight="700">1. Oferecer Seio Materno Imediato / Fórmula:</text>
    <text x="25" y="73" fill="#cbd5e1" font-size="11">• Estimular sucção vigorosa no peito</text>
    <text x="25" y="90" fill="#cbd5e1" font-size="11">• Se sucção ineficaz: Fórmula láctea ou leite ordenhado</text>
    <text x="15" y="120" fill="#f8fafc" font-size="11" font-weight="700">2. Reavaliar Glicemia em 30 a 60 minutos:</text>
    <text x="25" y="140" fill="#a7f3d0" font-size="11" font-weight="700">• Se glicemia normalizou (≥ 45 mg/dL):</text>
    <text x="35" y="158" fill="#cbd5e1" font-size="11">Manter aleitamento livre demanda a cada 2-3h</text>
    <text x="25" y="185" fill="#f87171" font-size="11" font-weight="700">• Se persistir &lt; 40 mg/dL apesar da dieta OU &lt; 25 mg/dL:</text>
    <text x="35" y="205" fill="#ffffff" font-size="11" font-weight="800">INDICAR INFUSÃO INTRAVENOSA DE GLICOSE</text>
    <text x="35" y="225" fill="#cbd5e1" font-size="11">Iniciar TIG a 4 a 6 mg/kg/min (evitar dano neuronal)</text>
    <text x="15" y="260" fill="#94a3b8" font-size="10">Monitorar antes das mamadas até 3 controles normais consecutivos</text>
  </g>

  <g transform="translate(500, 320)">
    <!-- Sintomático / Grave -->
    <rect x="0" y="0" width="440" height="320" rx="8" fill="#4c0519" stroke="#ef4444" stroke-width="1.5"/>
    <text x="220" y="28" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="800">RN SINTOMÁTICO OU GLICEMIA &lt; 25 mg/dL</text>
    <text x="15" y="55" fill="#fca5a5" font-size="11" font-weight="700">Sintomas: Tremores, hipotonia, sucção débil, apneia, convulsão</text>
    <text x="15" y="80" fill="#ffffff" font-size="12" font-weight="800">PASSO 1: BOLUS RÁPIDO DE GLICOSE</text>
    <text x="25" y="100" fill="#fef08a" font-size="12" font-weight="800">Soro Glicosado a 10% na dose de 2 mL/kg (200 mg/kg)</text>
    <text x="25" y="118" fill="#cbd5e1" font-size="11">Infundir em 2 a 3 minutos IV</text>
    <text x="25" y="135" fill="#fca5a5" font-size="10">*NUNCA usar glicose 50% ou SG 25% puro (risco de rebote e flebite)</text>
    <text x="15" y="165" fill="#ffffff" font-size="12" font-weight="800">PASSO 2: INFUSÃO CONTÍNUA DE MANUTENÇÃO (TIG)</text>
    <text x="25" y="185" fill="#38bdf8" font-size="11" font-weight="800">Iniciar TIG a 6 a 8 mg/kg/min</text>
    <text x="25" y="203" fill="#cbd5e1" font-size="11">Fórmula: TIG (mg/kg/min) = [Velocidade (mL/h) x % Glicose] / [Peso (kg) x 6]</text>
    <text x="25" y="225" fill="#ffffff" font-size="11">• Reavaliar glicemia em 30 minutos pós-bolus</text>
    <text x="25" y="243" fill="#cbd5e1" font-size="11">• Se refratário: Aumentar TIG de 1 a 2 mg/kg/min (máx 12-15 mg/kg/min)</text>
    <text x="25" y="263" fill="#fde047" font-size="11">• Se TIG &gt; 12 mg/kg/min: Investigar Hiperinsulinismo congênito</text>
    <text x="35" y="282" fill="#cbd5e1" font-size="10">(Considerar Hidrocortisona 5 mg/kg/dia ou Diazóxido 10-15 mg/kg/dia)</text>
  </g>

  <!-- Seção 2: Outros Distúrbios Metabólicos -->
  <g transform="translate(40, 690)">
    <rect x="0" y="0" width="920" height="440" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
    <text x="460" y="30" text-anchor="middle" fill="#facc15" font-size="15" font-weight="800">OUTROS DISTÚRBIOS DO PERÍODO NEONATAL (SBP 2024)</text>

    <!-- Card 1: Hipocalcemia -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="275" height="360" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="137" y="26" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="800">HIPOCALCEMIA NEONATAL</text>
      <text x="10" y="52" fill="#cbd5e1" font-size="11">• Cálcio total &lt; 7,0 mg/dL (prematuro)</text>
      <text x="10" y="70" fill="#cbd5e1" font-size="11">• Cálcio total &lt; 8,0 mg/dL (a termo)</text>
      <text x="10" y="88" fill="#fde047" font-size="11" font-weight="700">• Cálcio Iônico &lt; 1,1 mmol/L (padrão)</text>
      <text x="10" y="118" fill="#f8fafc" font-size="11" font-weight="700">Apresentação Clínica:</text>
      <text x="10" y="136" fill="#cbd5e1" font-size="11">Hiperirritabilidade, tremores finos,</text>
      <text x="10" y="154" fill="#cbd5e1" font-size="11">apneia, estridor, clonus e convulsões</text>
      <text x="10" y="185" fill="#a7f3d0" font-size="11" font-weight="700">Tratamento Sintomático Agudo:</text>
      <text x="10" y="205" fill="#ffffff" font-size="11" font-weight="800">Gluconato de Cálcio 10%:</text>
      <text x="10" y="225" fill="#fef08a" font-size="11">1 a 2 mL/kg (100 a 200 mg/kg) IV lento</text>
      <text x="10" y="243" fill="#cbd5e1" font-size="10">em 10 a 15 min sob monitorização de FC</text>
      <text x="10" y="263" fill="#f87171" font-size="10">(Risco de bradicardia e necrose tecidual)</text>
      <text x="10" y="295" fill="#94a3b8" font-size="10">Manutenção: 4 a 6 mL/kg/dia IV contínuo</text>
    </g>

    <!-- Card 2: Policitemia -->
    <g transform="translate(315, 50)">
      <rect x="0" y="0" width="280" height="360" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="140" y="26" text-anchor="middle" fill="#f87171" font-size="13" font-weight="800">POLICITEMIA NEONATAL</text>
      <text x="10" y="52" fill="#fca5a5" font-size="11" font-weight="800">• Definição: Hematócrito venoso central ≥ 65%</text>
      <text x="10" y="70" fill="#94a3b8" font-size="10">(Confirmar com sangue venoso, capilar superestima)</text>
      <text x="10" y="98" fill="#f8fafc" font-size="11" font-weight="700">Fatores de Risco:</text>
      <text x="10" y="116" fill="#cbd5e1" font-size="11">Clampeamento tardio excessivo, transfusão feto-fetal, PIG, filho de mãe DM</text>
      <text x="10" y="150" fill="#f8fafc" font-size="11" font-weight="700">Clínica de Hiperviscosidade:</text>
      <text x="10" y="168" fill="#cbd5e1" font-size="11">Pletora facial, cianose periférica,</text>
      <text x="10" y="186" fill="#cbd5e1" font-size="11">letargia, priapismo e trombose</text>
      <text x="10" y="218" fill="#a7f3d0" font-size="11" font-weight="700">Conduta Terapêutica:</text>
      <text x="10" y="238" fill="#ffffff" font-size="11" font-weight="800">Exsanguinotransfusão Parcial (ETP):</text>
      <text x="10" y="258" fill="#cbd5e1" font-size="11">Se Htc &gt; 65% sintomático OU &gt; 70%</text>
      <text x="10" y="278" fill="#fef08a" font-size="10">Volume (mL) = [Peso x 80 x (Htc atual - 55)] / Htc atual</text>
      <text x="10" y="300" fill="#a7f3d0" font-size="10">Substituir sangue retirado por SF 0,9%</text>
    </g>

    <!-- Card 3: Enterocolite Necrosante (ECN) -->
    <g transform="translate(615, 50)">
      <rect x="0" y="0" width="285" height="360" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="142" y="26" text-anchor="middle" fill="#eab308" font-size="13" font-weight="800">ENTEROCOLITE NECROSANTE</text>
      <text x="10" y="52" fill="#cbd5e1" font-size="11">• Maior emergência GI do prematuro</text>
      <text x="10" y="70" fill="#cbd5e1" font-size="11">• Isquemia + fórmula láctea + flora</text>
      <text x="10" y="98" fill="#f8fafc" font-size="11" font-weight="700">Sinais Clínicos Clássicos:</text>
      <text x="10" y="116" fill="#cbd5e1" font-size="11">Distensão abdominal, resíduos gástricos</text>
      <text x="10" y="134" fill="#cbd5e1" font-size="11">biliosos, sangue nas fezes e letargia</text>
      <text x="10" y="165" fill="#fde047" font-size="11" font-weight="700">Radiografia de Abdome (Critérios Bell):</text>
      <text x="10" y="185" fill="#fef08a" font-size="11" font-weight="800">• Pneumatose intestinal (patognomônico)</text>
      <text x="10" y="205" fill="#cbd5e1" font-size="11">• Gás no sistema porta hepático</text>
      <text x="10" y="223" fill="#f87171" font-size="11" font-weight="700">• Pneumoperitônio (Perfuração = Cirurgia)</text>
      <text x="10" y="255" fill="#a7f3d0" font-size="11" font-weight="700">Tratamento Clínico Inicial:</text>
      <text x="10" y="275" fill="#ffffff" font-size="11">Jejum absoluto + Descompressão gástrica</text>
      <text x="10" y="293" fill="#ffffff" font-size="11">ATB: Ampicilina + Gentamicina + Metronidazol</text>
      <text x="10" y="311" fill="#cbd5e1" font-size="10">Suporte volêmico vigoroso e analgesia</text>
    </g>
  </g>

  <text x="500" y="1165" text-anchor="middle" fill="#64748b" font-size="12">Fonte Oficial de Referência: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>