<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>
  
  <!-- Flowchart Connectors Behind Cross -->
  <g stroke="#38bdf8" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round">
    <path d="M 120 180 L 120 332 L 256 332"/>
    <path d="M 392 180 L 392 332 L 256 332"/>
    <path d="M 256 120 L 256 392"/>
  </g>
  <circle cx="120" cy="180" r="14" fill="#38bdf8"/>
  <circle cx="392" cy="180" r="14" fill="#38bdf8"/>
  <circle cx="120" cy="332" r="12" fill="#0284c7"/>
  <circle cx="392" cy="332" r="12" fill="#0284c7"/>
  <circle cx="256" cy="120" r="16" fill="#38bdf8"/>
  <circle cx="256" cy="392" r="16" fill="#38bdf8"/>

  <!-- Medical Cross with Flowchart Aesthetic -->
  <g filter="url(#glow)">
    <!-- Vertical Bar -->
    <rect x="220" y="160" width="72" height="192" rx="20" fill="url(#crossGrad)"/>
    <!-- Horizontal Bar -->
    <rect x="160" y="220" width="192" height="72" rx="20" fill="url(#crossGrad)"/>
    <!-- Center Pulse / Node -->
    <circle cx="256" cy="256" r="26" fill="#ffffff"/>
    <circle cx="256" cy="256" r="14" fill="#0284c7"/>
  </g>
</svg>