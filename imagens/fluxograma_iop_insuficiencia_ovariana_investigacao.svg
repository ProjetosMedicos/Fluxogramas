<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • ENDOCRINOLOGIA &amp; CLIMATÉRIO</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">INSUFICIÊNCIA OVARIANA PREMATURA (IOP): INVESTIGAÇÃO &amp; MANEJO</text>
  <text x="970" y="45" fill="#cbd5e1" font-size="13" font-weight="500" text-anchor="end">Cap. 46 FEBRASGO • ESHRE Guidelines</text>

  <!-- Top Node -->
  <rect x="180" y="85" width="640" height="55" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="108" font-size="13" font-weight="800" fill="#0369a1" text-anchor="middle">SUSPEITA DE IOP: MULHER &lt; 40 ANOS COM AMENORREIA / OLIGOMENORREIA ≥ 4 MESES</text>
  <text x="500" y="127" font-size="11" fill="#0284c7" text-anchor="middle">Sintomas vasomotores (fogachos), atrofia urogenital e sofrimento psicoemocional</text>

  <!-- Linha -->
  <line x1="500" y1="140" x2="500" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Critério Diagnóstico ESHRE -->
  <rect x="200" y="170" width="600" height="48" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="191" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">CRITÉRIO DIAGNÓSTICO OBRIGATÓRIO (ESHRE / FEBRASGO)</text>
  <text x="500" y="208" font-size="10" font-weight="700" fill="#e11d48" text-anchor="middle">FSH sérico &gt; 25 UI/L comprovado em DUAS dosagens distintas com intervalo mínimo de 4 a 6 semanas</text>

  <!-- 3 Painéis de Investigação Etiológica -->
  <rect x="30" y="235" width="300" height="230" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="235" width="300" height="26" rx="8" fill="#8b5cf6"/>
  <text x="180" y="253" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1. INVESTIGAÇÃO GENÉTICA</text>
  <text x="45" y="280" font-size="10" font-weight="800" fill="#6d28d9">• Cariótipo com Contagem de Bandas:</text>
  <text x="45" y="296" font-size="9" fill="#475569">Exclusão de mosaicismos 45,X (Turner),</text>
  <text x="45" y="310" font-size="9" fill="#475569">deleções do cromossomo X</text>
  <text x="45" y="326" font-size="9" font-weight="700" fill="#e11d48">Pesquisa mandatória de fragmento Y!</text>
  <text x="45" y="340" font-size="9" fill="#475569">Se presença de material do cromossomo Y =</text>
  <text x="45" y="354" font-size="9" font-weight="700" fill="#0f172a">Gonadectomia profilática bilateral imediata</text>

  <text x="45" y="380" font-size="10" font-weight="800" fill="#6d28d9">• Pré-mutação do Gene FMR1 (X Frágil):</text>
  <text x="45" y="396" font-size="9" fill="#475569">Pesquisa de expansão de 55 a 200 CGG</text>
  <text x="45" y="410" font-size="9" fill="#475569">Presente em 15% das IOPs familiares</text>
  <text x="45" y="424" font-size="9" fill="#475569">Aconselhamento genético aos parentes</text>

  <rect x="350" y="235" width="300" height="230" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="350" y="235" width="300" height="26" rx="8" fill="#e11d48"/>
  <text x="500" y="253" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2. INVESTIGAÇÃO AUTOIMUNE (10-20%)</text>
  <text x="365" y="280" font-size="10" font-weight="800" fill="#9f1239">• Rastreio de Doença de Addison Oculta:</text>
  <text x="365" y="296" font-size="9" font-weight="700" fill="#0f172a">Anticorpos anti-córtex adrenal / 21-OH</text>
  <text x="365" y="310" font-size="9" fill="#475569">A ooforite autoimune frequentemente precede</text>
  <text x="365" y="324" font-size="9" fill="#475569">a falência adrenal potencialmente fatal</text>
  <text x="365" y="338" font-size="9" fill="#e11d48">Se positivo: dosar cortisol e ACTH matinais</text>

  <text x="365" y="365" font-size="10" font-weight="800" fill="#9f1239">• Autoimunidade Tireoidiana:</text>
  <text x="365" y="380" font-size="9" fill="#475569">Anticorpos Anti-TPO e Anti-Tireoglobulina</text>
  <text x="365" y="394" font-size="9" fill="#475569">Alta associação com Hashimoto e Vitiligo</text>

  <text x="365" y="420" font-size="10" font-weight="800" fill="#9f1239">• Causas Iatrogênicas Adquiridas:</text>
  <text x="365" y="434" font-size="9" fill="#475569">Quimioterapia prévia (ciclofosfamida),</text>
  <text x="365" y="448" font-size="9" fill="#475569">radioterapia pélvica ou cirurgias de endometrioma</text>

  <rect x="670" y="235" width="300" height="230" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="235" width="300" height="26" rx="8" fill="#16a34a"/>
  <text x="820" y="253" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3. PILARES DO MANEJO TERAPÊUTICO</text>
  <text x="685" y="280" font-size="10" font-weight="800" fill="#15803d">• TRH Fisiológica Mandatória até os 50a:</text>
  <text x="685" y="296" font-size="9" font-weight="700" fill="#0f172a">17-β-Estradiol (1-2 mg/d VO ou transdérmico)</text>
  <text x="685" y="310" font-size="9" fill="#475569">+ Progesterona Micronizada (200 mg/d 12d/mês)</text>
  <text x="685" y="324" font-size="9" fill="#475569">NÃO é opcional: previne osteoporose precoce,</text>
  <text x="685" y="338" font-size="9" fill="#475569">infarto agudo do miocárdio e demência</text>

  <text x="685" y="365" font-size="10" font-weight="800" fill="#15803d">• Planejamento Reprodutivo &amp; Fertilidade:</text>
  <text x="685" y="380" font-size="9" fill="#475569">5-10% apresentam ovulação espontânea;</text>
  <text x="685" y="394" font-size="9" fill="#475569">TRH não é contraceptivo (usar barreira se desejar)</text>
  <text x="685" y="408" font-size="9" font-weight="700" fill="#0f172a">Para reprodução assistida: Ovodoação</text>
  <text x="685" y="422" font-size="9" fill="#475569">é o método padrão-ouro de alta eficácia (&gt; 50%)</text>

  <!-- Caixa de Preservação Óssea -->
  <rect x="30" y="480" width="940" height="115" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="505" font-size="11" font-weight="800" fill="#0f172a">VIGILÂNCIA DA DENSIDADE MINERAL ÓSSEA (DMO) &amp; SAÚDE CARDIOVASCULAR</text>
  <text x="50" y="525" font-size="10" fill="#475569">• Densitometria Óssea (DXA) no diagnóstico basal e a cada 2 anos se controle instável • Dieta rica em Cálcio (1.000 a 1.200 mg/d) e Vitamina D (meta sérica &gt; 30 ng/mL)</text>
  <text x="50" y="543" font-size="10" fill="#475569">• Atividade física com impacto e musculação resistida regular • Monitorização lipídica e da pressão arterial</text>
  <text x="50" y="561" font-size="10" font-weight="700" fill="#0284c7">• Suporte psicológico longitudinal especializado: acolhimento ao impacto do diagnóstico de falência ovariana precoce na autoimagem feminina</text>

  <!-- Rodapé -->
  <rect x="30" y="610" width="940" height="52" rx="8" fill="#0f172a" filter="url(#shadow)"/>
  <text x="500" y="630" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">CONSENSO ESHRE / THE MENOPAUSE SOCIETY</text>
  <text x="500" y="648" font-size="10" fill="#f8fafc" text-anchor="middle">A TRH na paciente com IOP substitui o estrogênio que o ovário deveria produzir fisiologicamente; não aumenta risco de câncer de mama até a idade média da menopausa</text>
</svg>