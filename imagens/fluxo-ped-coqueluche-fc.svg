<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; line-height: 1.3; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">ALGORITMO DE COQUELUCHE &amp; RASTREIO DE FIBROSE CÍSTICA</text>
  <text x="50" y="78" class="subtitle">Bordetella pertussis e Teste do Suor • SBP 2024</text>
  <rect x="750" y="42" width="200" height="28" rx="6" fill="#0284c7" />
  <text x="850" y="60" text-anchor="middle" class="badge-text">SBP 2024 • PNEUMO &amp; GENÉTICA</text>


  <g class="card-shadow">
    <rect x="100" y="115" width="380" height="60" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="290" y="138" text-anchor="middle" class="node-bold">COQUELUCHE (Bordetella pertussis)</text>
    <text x="290" y="158" text-anchor="middle" class="node-text">Tosse paroxística, guincho inspiratório e apneia/cianose em lactentes</text>
  </g>

  <g class="card-shadow">
    <rect x="520" y="115" width="380" height="60" rx="10" fill="#ffffff" stroke="#c026d3" stroke-width="2" />
    <text x="710" y="138" text-anchor="middle" class="node-bold">FIBROSE CÍSTICA (Mucoviscidose)</text>
    <text x="710" y="158" text-anchor="middle" class="node-text">Triagem com IRT alterada, tosse crônica e esteatorreia desnutritiva</text>
  </g>

  <path d="M 290 175 L 290 230" class="edge" />
  <path d="M 710 175 L 710 230" class="edge" />

  <!-- Coqueluche fases e tto -->
  <g class="card-shadow">
    <rect x="60" y="230" width="420" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="270" y="252" text-anchor="middle" class="node-bold" fill="#1e40af">FASES CLÍNICAS &amp; DIAGNÓSTICO DA COQUELUCHE</text>
    <text x="270" y="272" text-anchor="middle" class="node-text">• Fase Catarral (1-2 sem): coriza, tosse seca, febre baixa (fase de maior contágio)</text>
    <text x="270" y="290" text-anchor="middle" class="node-text">• Fase Paroxística (2-6 sem): acessos em salva seguidos de guincho inspiratório e vômitos</text>
    <text x="270" y="308" text-anchor="middle" class="node-text">• Alerta em &lt; 3 meses: apneia, cianose e engasgo sem guincho audível!</text>
    <text x="270" y="326" text-anchor="middle" class="node-text">• Laboratório: Hiperleucocitose importante (&gt; 20.000-50.000) com Linfocitose absoluta</text>
    <text x="270" y="344" text-anchor="middle" class="node-text">• Confirmação: PCR de aspirado/swab de nasofaringe em meio de Dacron/Rayon</text>
    <text x="270" y="362" text-anchor="middle" class="node-bold">• Tratamento: Azitromicina 10 mg/kg/dia por 5 dias (todos os contatos domiciliares)</text>
  </g>

  <!-- Fibrose cística diagnóstico e tto -->
  <g class="card-shadow">
    <rect x="520" y="230" width="420" height="150" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="730" y="252" text-anchor="middle" class="node-bold" fill="#701a75">INVESTIGAÇÃO DO TESTE DO SUOR (SBP 2024)</text>
    <text x="730" y="272" text-anchor="middle" class="node-text">• Triagem Neonatal: Tripsina Imunorreativa (IRT) elevada em 2 dosagens (até 30 dias)</text>
    <text x="730" y="290" text-anchor="middle" class="node-text">• Padrão-Ouro Diagnóstico: Dosagem de Cloro no Suor por iontoforese (Gibson-Cooke):</text>
    <text x="730" y="308" text-anchor="middle" class="node-text">  - Normal: Cloreto &lt; 30 mEq/L</text>
    <text x="730" y="326" text-anchor="middle" class="node-text">  - Limítrofe: 30 a 59 mEq/L (repetir teste e fazer painel genético CFTR)</text>
    <text x="730" y="344" text-anchor="middle" class="node-bold">  - Positivo: Cloreto ≥ 60 mEq/L em 2 amostras independentes</text>
    <text x="730" y="362" text-anchor="middle" class="node-text">• Mutações mais frequentes: F508del (Classe II - defeito de processamento protéico)</text>
  </g>

  <path d="M 270 380 L 270 435" class="edge" />
  <path d="M 730 380 L 730 435" class="edge" />

  <g class="card-shadow">
    <rect x="60" y="435" width="420" height="115" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="270" y="458" text-anchor="middle" class="node-bold" fill="#b91c1c">GRAVIDADE &amp; HIPERLEUCOCITOSE MALIGNA</text>
    <text x="270" y="480" text-anchor="middle" class="node-text">• Leucócitos &gt; 50.000 a 100.000/mm³: trombi microvasculares pulmonares</text>
    <text x="270" y="498" text-anchor="middle" class="node-text">• Hipertensão Pulmonar Grave e choque cardiogênico refratário</text>
    <text x="270" y="516" text-anchor="middle" class="node-text">• Internação imediata em UTI, monitorização cardiorrespiratória contínua</text>
    <text x="270" y="534" text-anchor="middle" class="node-text">• Considerar exsanguineotransfusão ou leucoaférese em casos extremos</text>
  </g>

  <g class="card-shadow">
    <rect x="520" y="435" width="420" height="115" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <text x="730" y="458" text-anchor="middle" class="node-bold" fill="#15803d">PILAR TERAPÊUTICO MULTIDISCIPLINAR DA FC</text>
    <text x="730" y="480" text-anchor="middle" class="node-text">• Reposição de Enzimas Pancreáticas em todas as refeições e mamadas</text>
    <text x="730" y="498" text-anchor="middle" class="node-text">• Suplementação diária de Vitaminas Lipossolúveis (A, D, E e K)</text>
    <text x="730" y="516" text-anchor="middle" class="node-text">• Fisioterapia respiratória diária e inalação com Alfa-dornase e Salina Hipertônica 7%</text>
    <text x="730" y="534" text-anchor="middle" class="node-text">• Terapia de Precisão com Moduladores de CFTR (Ivacaftor, Elexacaftor/Tezacaftor)</text>
  </g>

  <path d="M 500 550 L 500 590" class="edge" />

  <g class="card-shadow">
    <rect x="180" y="590" width="640" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <text x="500" y="612" text-anchor="middle" class="node-bold">PREVENÇÃO VACINAL OBRIGATÓRIA (SBP / PNI)</text>
    <text x="500" y="632" text-anchor="middle" class="node-text">• Vacina Pentavalente (DTPw) aos 2, 4 e 6 meses + Reforços com DTP aos 15m e 4 anos</text>
    <text x="500" y="650" text-anchor="middle" class="node-text">• Vacina dTpa obrigatória para todas as GESTANTES a partir da 20ª semana a cada gestação para proteção neonatal passiva!</text>
  </g>


  <!-- Footer Notice -->
  <rect x="30" y="700" width="940" height="35" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="722" text-anchor="middle" class="subtitle" style="font-size: 11px;">Diretriz Oficial: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>