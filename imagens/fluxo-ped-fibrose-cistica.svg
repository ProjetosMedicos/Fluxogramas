<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradFC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadowFC" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="920" height="620" fill="#f8fafc" rx="8" />

  <!-- Cabeçalho -->
  <rect x="20" y="16" width="880" height="54" rx="6" fill="url(#gradFC)" filter="url(#shadowFC)" />
  <text x="40" y="42" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">ALGORITMO DIAGNÓSTICO &amp; TERAPÊUTICO: FIBROSE CÍSTICA</text>
  <text x="40" y="58" fill="#ccfbf1" font-size="11" font-family="system-ui, -apple-system, sans-serif">Diretrizes SBP 2024 • Triagem por IRT, Teste do Suor Quantitativo &amp; Reposição Pancreática</text>

  <!-- Triagem Neonatal -->
  <rect x="40" y="85" width="410" height="240" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#shadowFC)" />
  <rect x="40" y="85" width="410" height="26" fill="#0d9488" rx="6" />
  <text x="245" y="103" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. TRIAGEM NEONATAL BIOLÓGICA (IRT)</text>
  <text x="55" y="127" fill="#0f766e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Imunorreatividade Tripsínica (IRT) no Teste do Pezinho:</text>
  <text x="55" y="142" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  - 1ª amostra colhida entre o <tspan font-weight="bold">3º e 5º dia de vida</tspan>.</text>
  <text x="55" y="156" fill="#334155" font-size="9.5" font-family="system-ui, sans-serif">  - Ponto de corte alterado: <tspan font-weight="bold">IRT &gt;= 70 ng/mL</tspan>.</text>
  <text x="55" y="174" fill="#0f766e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Segunda Amostra de IRT (Obrigatória se 1ª positiva):</text>
  <text x="55" y="189" fill="#0f172a" font-size="9.5" font-family="system-ui, sans-serif">  - Deve ser colhida rigorosamente até <tspan font-weight="bold">30 dias de vida</tspan>.</text>
  <text x="55" y="203" fill="#b91c1c" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  - Se 2ª amostra também &gt;= 70 ng/mL: ENCAMINHAR PARA TESTE DO SUOR!</text>
  <text x="55" y="222" fill="#334155" font-size="9" font-family="system-ui, sans-serif">• Obs: Criança com íleo meconial ao nascimento dispensa triagem</text>
  <text x="55" y="236" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  e segue direto para investigação diagnóstica de Fibrose Cística.</text>

  <!-- Teste do Suor -->
  <rect x="470" y="85" width="410" height="240" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadowFC)" />
  <rect x="470" y="85" width="410" height="26" fill="#0f766e" rx="6" />
  <text x="675" y="103" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. TESTE DO SUOR: PADRÃO-OURO DIAGNÓSTICO</text>
  <text x="485" y="127" fill="#0f766e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Método de Gibson &amp; Cooke (Iontoforese com Pilocarpina):</text>
  <text x="485" y="145" fill="#166534" font-size="9.5" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Cloreto no Suor &lt; 30 mEq/L:</tspan> Fibrose Cística improvável / Normal.</text>
  <text x="485" y="165" fill="#d97706" font-size="9.5" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Cloreto 30 a 59 mEq/L:</tspan> Resultado limítrofe (duvidoso).</text>
  <text x="485" y="180" fill="#d97706" font-size="9" font-family="system-ui, sans-serif">  Conduta: Repetir o teste do suor e realizar painel genético CFTR.</text>
  <text x="485" y="200" fill="#dc2626" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Cloreto &gt;= 60 mEq/L em 2 amostras independentes:</text>
  <text x="485" y="215" fill="#dc2626" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">  DIAGNÓSTICO CONFIRMADO DE FIBROSE CÍSTICA!</text>
  <text x="485" y="235" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  Iniciar acompanhamento imediato em Centro de Referência SBP.</text>

  <!-- Pilares do Tratamento -->
  <rect x="40" y="340" width="840" height="260" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="40" y="340" width="840" height="28" fill="#f1f5f9" rx="6" />
  <text x="55" y="359" fill="#0f172a" font-size="11.5" font-weight="bold" font-family="system-ui, sans-serif">3. MANEJO TERAPÊUTICO MULTIDISCIPLINAR (SBP 2024)</text>

  <rect x="55" y="380" width="260" height="205" rx="5" fill="#f0fdfa" stroke="#ccfbf1" />
  <text x="65" y="400" fill="#0f766e" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">Manejo Pulmonar:</text>
  <text x="65" y="420" fill="#334155" font-size="9" font-family="system-ui, sans-serif">• Fisioterapia respiratória diária.</text>
  <text x="65" y="438" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Alfa-dornase:</tspan> fluidificação do muco.</text>
  <text x="65" y="456" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Salina Hipertônica 7%:</tspan> hidratação ciliar.</text>
  <text x="65" y="474" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• Vacinação antipneumo e influenza.</text>

  <rect x="330" y="380" width="260" height="205" rx="5" fill="#eff6ff" stroke="#dbeafe" />
  <text x="340" y="400" fill="#1d4ed8" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">Suporte Gastrointestinal:</text>
  <text x="340" y="420" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Enzimas Pancreáticas:</tspan> lipase oral</text>
  <text x="348" y="435" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">  em todas as refeições e lanches.</text>
  <text x="340" y="455" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Vitaminas Lipossolúveis (A, D, E, K):</tspan></text>
  <text x="348" y="470" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">  suplementação contínua diária.</text>
  <text x="340" y="490" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• Dieta hipercalórica (120-150% VET).</text>

  <rect x="605" y="380" width="260" height="205" rx="5" fill="#fef2f2" stroke="#fee2e2" />
  <text x="615" y="400" fill="#b91c1c" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">Controle Infeccioso:</text>
  <text x="615" y="420" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• Rastreio: P. aeruginosa e S. aureus.</text>
  <text x="615" y="440" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• <tspan font-weight="bold">Tobramicina inalatória</tspan> para erradicação</text>
  <text x="623" y="455" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">  precoce de Pseudomonas.</text>
  <text x="615" y="475" fill="#b91c1c" font-size="8.5" font-weight="bold" font-family="system-ui, sans-serif">• Exacerbação: internação e ATB IV dupla.</text>
</svg>