<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradConv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="shadowConv" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="920" height="620" fill="#f8fafc" rx="8" />

  <!-- Cabeçalho -->
  <rect x="20" y="16" width="880" height="54" rx="6" fill="url(#gradConv)" filter="url(#shadowConv)" />
  <text x="40" y="42" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">ALGORITMO DECISÓRIO: CRISE CONVULSIVA E CONVULSÃO FEBRIL PEDIÁTRICA</text>
  <text x="40" y="58" fill="#e0e7ff" font-size="11" font-family="system-ui, -apple-system, sans-serif">Diretrizes Oficiais SBP 2024 (6ª Edição) • Triagem Febril Simples vs Complexa &amp; Manejo do Estado de Mal</text>

  <!-- Nó Inicial: Avaliação Inicial e C-A-B -->
  <rect x="250" y="85" width="420" height="52" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadowConv)" />
  <text x="460" y="106" fill="#1e1b4b" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CRIANÇA EM CRISE CONVULSIVA AGUDA NA EMERGÊNCIA</text>
  <text x="460" y="124" fill="#4b5563" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Garantir vias aéreas pérvias (C-A-B), decúbito lateral, O2 em alto fluxo, glicemia capilar imediata</text>

  <!-- Linha divisória de tempo: < 5 min vs >= 5 min -->
  <line x1="460" y1="137" x2="460" y2="160" stroke="#94a3b8" stroke-width="2" />
  <polygon points="460,165 456,157 464,157" fill="#94a3b8" />

  <!-- Cronologia do Estado de Mal -->
  <rect x="210" y="165" width="500" height="68" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="460" y="186" fill="#312e81" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CRONOMETRAGEM DA CRISE: DURAÇÃO &gt; 5 MINUTOS = STATUS EPILEPTICUS</text>
  <text x="460" y="204" fill="#4338ca" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">1ª Linha (0 a 10 min): Diazepam IV (0,2-0,3 mg/kg) ou Midazolam IM/Bucal/Nasal (0,2 mg/kg)</text>
  <text x="460" y="220" fill="#4338ca" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Se refratário após 10 min (2ª dose): Levetiracetam (40-60 mg/kg) ou Fenitoína/Fosfenitoína (20 mg/kg IV)</text>

  <!-- Ramificação pós-crise: Convulsão Febril -->
  <line x1="460" y1="233" x2="460" y2="255" stroke="#94a3b8" stroke-width="2" />
  <line x1="240" y1="255" x2="680" y2="255" stroke="#94a3b8" stroke-width="2" />

  <!-- Linhas para Simples vs Complexa -->
  <line x1="240" y1="255" x2="240" y2="280" stroke="#94a3b8" stroke-width="2" />
  <polygon points="240,285 236,277 244,277" fill="#94a3b8" />
  <line x1="680" y1="255" x2="680" y2="280" stroke="#94a3b8" stroke-width="2" />
  <polygon points="680,285 676,277 684,277" fill="#94a3b8" />

  <!-- Ramo Esquerdo: Convulsão Febril Simples -->
  <rect x="40" y="285" width="400" height="150" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadowConv)" />
  <rect x="40" y="285" width="400" height="28" rx="6" fill="#10b981" />
  <text x="240" y="304" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CONVULSÃO FEBRIL SIMPLES (80% a 85%)</text>
  <text x="55" y="330" fill="#065f46" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">• Idade típica: 6 meses a 5 anos (pico aos 18 meses)</text>
  <text x="55" y="348" fill="#374151" font-size="10" font-family="system-ui, sans-serif">• Crise Generalizada (tônico-clônica bilateral)</text>
  <text x="55" y="366" fill="#374151" font-size="10" font-family="system-ui, sans-serif">• Duração breve: &lt; 15 minutos (maioria &lt; 5 min)</text>
  <text x="55" y="384" fill="#374151" font-size="10" font-family="system-ui, sans-serif">• Única em 24 horas (não recorre no mesmo episódio febril)</text>
  <text x="55" y="402" fill="#374151" font-size="10" font-family="system-ui, sans-serif">• Período pós-ictal rápido; exame neurológico intercrítico normal</text>
  <text x="55" y="420" fill="#b91c1c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• CONDUTA: Tranquilizar a família, buscar foco infeccioso; NÃO pedir TC/EEG</text>

  <!-- Ramo Direito: Convulsão Febril Complexa -->
  <rect x="480" y="285" width="400" height="150" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shadowConv)" />
  <rect x="480" y="285" width="400" height="28" rx="6" fill="#ef4444" />
  <text x="680" y="304" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CONVULSÃO FEBRIL COMPLEXA (15% a 20%)</text>
  <text x="495" y="330" fill="#991b1b" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">• Presença de ≥ 1 dos seguintes critérios atípicos:</text>
  <text x="495" y="348" fill="#374151" font-size="10" font-family="system-ui, sans-serif">• Crise FOCAL ou com início focalizado em um hemicorpo</text>
  <text x="495" y="366" fill="#374151" font-size="10" font-family="system-ui, sans-serif">• Duração prolongada: ≥ 15 minutos ou Estado de Mal Febril</text>
  <text x="495" y="384" fill="#374151" font-size="10" font-family="system-ui, sans-serif">• Recorrência de crises dentro das mesmas 24 horas</text>
  <text x="495" y="402" fill="#374151" font-size="10" font-family="system-ui, sans-serif">• Déficit neurológico pós-ictal mantido (Paralisia de Todd)</text>
  <text x="495" y="420" fill="#b91c1c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• CONDUTA: Internação, considerar Punção Lombar, neuroimagem e EEG</text>

  <!-- Card Inferior: Recomendações e Punção Lombar -->
  <rect x="40" y="450" width="840" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="40" y="450" width="840" height="26" fill="#f1f5f9" rx="6" />
  <text x="55" y="468" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">CRITÉRIOS FORMAIS PARA PUNÇÃO LOMBAR &amp; AVISOS CHOOSING WISELY SBP 2024</text>

  <text x="55" y="494" fill="#0f172a" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Indicações de Punção Lombar (LCR):</text>
  <text x="55" y="510" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">1. Sinais meníngeos (rigidez de nuca, fontanela abaulada, toxemia).</text>
  <text x="55" y="525" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">2. Lactente 6-12m com vacinação incompleta para Hib/Pneumococo.</text>
  <text x="55" y="540" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">3. Uso prévio de antibiótico que possa mascarar meningite.</text>
  <text x="55" y="555" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">4. Estado de Mal Febril ou déficit neurológico pós-crise.</text>

  <text x="495" y="494" fill="#b91c1c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Choosing Wisely SBP (O que NÃO Fazer):</text>
  <text x="495" y="510" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• NÃO realizar punção lombar na febril simples com exame normal.</text>
  <text x="495" y="525" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• NÃO prescrever anticonvulsivantes profiláticos contínuos.</text>
  <text x="495" y="540" fill="#334155" font-size="8.8" font-family="system-ui, sans-serif">• Antitérmicos dão conforto, mas NÃO evitam recorrência de crise.</text>
  <text x="495" y="555" fill="#0284c7" font-size="8.8" font-weight="bold" font-family="system-ui, sans-serif">• Risco de epilepsia futura é de apenas 1% a 2% (população geral).</text>
</svg>