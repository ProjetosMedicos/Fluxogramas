<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="100%" height="100%" class="flowchart" style="background:#ffffff; font-family:Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="940" height="70" fill="#0f172a"/>
  <text x="30" y="32" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.1em">PORTAL CLÍNICO FEBRASGO • DIRETRIZES OFICIAIS</text>
  <text x="30" y="54" fill="#ffffff" font-size="18" font-weight="800">MANEJO CLÍNICO E CIRÚRGICO DA HIPERPLASIA ENDOMETRIAL</text>
  <text x="910" y="45" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">Classificação OMS 2014/2020 &amp; FEBRASGO Cap. 80</text>

  <!-- Content -->
  
    <rect x="270" y="95" width="400" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="470" y="120" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">RESULTADO HISTOPATOLÓGICO DA BIÓPSIA ENDOMETRIAL</text>
    <text x="470" y="140" font-size="12" fill="#475569" text-anchor="middle">Diferenciação Crítica: Presença ou Ausência de Atipia Celular / EIN</text>

    <!-- Bifurcação das Hiperplasias -->
    <path d="M 370 155 L 230 205" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 570 155 L 710 205" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Coluna Sem Atipia -->
    <rect x="50" y="215" width="360" height="360" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="230" y="245" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">HIPERPLASIA SEM ATIPIA</text>
    <text x="230" y="265" font-size="11" fill="#15803d" text-anchor="middle">Risco de progressão para adenocarcinoma: &lt; 1-3%</text>

    <text x="70" y="300" font-size="12" font-weight="700" fill="#14532d">• Tratamento Clínico de 1ª Linha:</text>
    <text x="80" y="320" font-size="11" fill="#166534"><tspan font-weight="bold">DIU de Levonorgestrel 52 mg (Mirena):</tspan></text>
    <text x="90" y="338" font-size="11" fill="#166534">Método padrão-ouro (regressão &gt; 90-95%)</text>
    <text x="80" y="360" font-size="11" fill="#166534"><tspan font-weight="bold">Progestagênio Oral Alternativo:</tspan></text>
    <text x="90" y="378" font-size="11" fill="#166534">Acetato de Medroxiprogesterona 10-20 mg/d</text>
    <text x="90" y="396" font-size="11" fill="#166534">ou Noretisterona 10-15 mg/d por 14-21 d/mês</text>

    <text x="70" y="430" font-size="12" font-weight="700" fill="#14532d">• Seguimento e Reavaliação:</text>
    <text x="80" y="450" font-size="11" fill="#166534">Nova biópsia endometrial a cada 6 meses</text>
    <text x="80" y="468" font-size="11" fill="#166534">até documentar 2 biópsias normais consecutivas</text>
    <text x="70" y="500" font-size="12" font-weight="700" fill="#14532d">• Histerectomia:</text>
    <text x="80" y="518" font-size="11" fill="#166534">Apenas se persistência após 12 meses de tratamento,</text>
    <text x="80" y="536" font-size="11" fill="#166534">progressão para atipia ou recidiva após suspensão</text>

    <!-- Coluna Com Atipia -->
    <rect x="530" y="215" width="360" height="360" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="710" y="245" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">HIPERPLASIA COM ATIPIA / EIN</text>
    <text x="710" y="265" font-size="11" fill="#b91c1c" text-anchor="middle">Risco de carcinoma coexistente oculto: 30-40%</text>

    <text x="550" y="300" font-size="12" font-weight="700" fill="#7f1d1d">• Tratamento Padrão-Ouro:</text>
    <text x="560" y="325" font-size="13" font-weight="800" fill="#b91c1c">HISTERECTOMIA TOTAL</text>
    <text x="560" y="345" font-size="12" font-weight="800" fill="#b91c1c">+ SALPINGO-OOFORECTOMIA BILATERAL</text>
    <text x="560" y="368" font-size="11" fill="#991b1b">Via laparoscópica preferencial</text>
    <text x="560" y="386" font-size="11" fill="#991b1b">Exame anatomopatológico com congelação</text>

    <text x="550" y="420" font-size="12" font-weight="700" fill="#7f1d1d">• Exceção Estrita (Preservação de Fertilidade):</text>
    <text x="560" y="440" font-size="11" fill="#991b1b">Pacientes jovens que desejam engravidar:</text>
    <text x="570" y="458" font-size="11" fill="#7f1d1d">- Afastar carcinoma invasor ou invasão miometrial (RNM)</text>
    <text x="570" y="476" font-size="11" fill="#7f1d1d">- Progestagênio de alta dose (DIU-LNG + Megestrol 160 mg)</text>
    <text x="570" y="494" font-size="11" fill="#7f1d1d">- Histeroscopias + biópsias a cada 3 meses</text>
    <text x="570" y="512" font-size="11" fill="#7f1d1d">- FIV prioritária após remissão</text>
    <text x="570" y="530" font-size="11" fill="#991b1b">- Histerectomia profilática definitiva após parto</text>
    

  <!-- Footer -->
  <line x1="30" y1="585" x2="910" y2="585" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="602" fill="#64748b" font-size="11" font-weight="600">Fonte: Tratado de Ginecologia FEBRASGO (2ª Edição) • FIGO • IOTA • OMS</text>
  <text x="910" y="602" fill="#94a3b8" font-size="11" text-anchor="end">Uso exclusivo para tomada de decisão clínica fundamentada</text>
</svg>