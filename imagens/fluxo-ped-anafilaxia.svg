<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .node-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1e293b; line-height: 1.3; }
      .node-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #0f172a; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; }
      .decision-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #b45309; }
      .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-yes { stroke: #10b981; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .edge-no { stroke: #ef4444; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="750" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" />
  <text x="50" y="55" class="title">ALGORITMO DE EMERGÊNCIA: ANAFILAXIA PEDIÁTRICA</text>
  <text x="50" y="78" class="subtitle">Critérios WAO / SBP 2024 • Adrenalina IM como Primeira Linha Absoluta</text>
  <rect x="750" y="42" width="200" height="28" rx="6" fill="#0284c7" />
  <text x="850" y="60" text-anchor="middle" class="badge-text">SBP 2024 • ALERGIA & EMERGÊNCIA</text>


  <g class="card-shadow">
    <rect x="280" y="115" width="440" height="60" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="500" y="138" text-anchor="middle" class="node-bold" fill="#b91c1c">RECONHECIMENTO IMEDIATO DA ANAFILAXIA (CRITÉRIOS WAO / SBP)</text>
    <text x="500" y="158" text-anchor="middle" class="node-text">Sintomas agudos em pele/mucosa + Respiratório OU Hemodinâmico OU Gastrointestinal</text>
  </g>

  <path d="M 500 175 L 500 230" class="edge-yes" />

  <g class="card-shadow">
    <rect x="220" y="230" width="560" height="90" rx="10" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <text x="500" y="255" text-anchor="middle" class="node-bold" fill="#ffffff" style="font-size: 15px;">PRIMEIRA LINHA MANDATÓRIA E IMEDIATA: ADRENALINA IM</text>
    <text x="500" y="278" text-anchor="middle" class="node-bold" fill="#ffffff">• ADRENALINA 1:1.000 (1 mg/mL) na dose de 0,01 mg/kg IM (máx 0,3 mg pré-púbere / 0,5 mg adolescente)</text>
    <text x="500" y="298" text-anchor="middle" class="node-text" fill="#fef2f2">• Aplicar exclusivamente na FACE ANTEROLATERAL MÉDIA DA COXA (Vasto Lateral)</text>
  </g>

  <path d="M 360 320 L 230 380" class="edge" />
  <path d="M 640 320 L 770 380" class="edge" />

  <g class="card-shadow">
    <rect x="70" y="380" width="320" height="130" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="230" y="403" text-anchor="middle" class="node-bold">SUPORTE CIRCULATÓRIO &amp; VIA AÉREA</text>
    <text x="230" y="425" text-anchor="middle" class="node-text">• Posição supina com membros inferiores elevados</text>
    <text x="230" y="443" text-anchor="middle" class="node-text">• NÃO colocar o paciente em pé ou sentado abruptamente</text>
    <text x="230" y="461" text-anchor="middle" class="node-text">• Oxigênio em alto fluxo por máscara com reservatório</text>
    <text x="230" y="479" text-anchor="middle" class="node-text">• Acesso venoso calibroso: SF 0,9% 20 mL/kg em bolus rápido</text>
    <text x="230" y="497" text-anchor="middle" class="node-text">• Preparar IOT se estridor laríngeo ou angioedema grave</text>
  </g>

  <g class="card-shadow">
    <rect x="610" y="380" width="320" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
    <text x="770" y="403" text-anchor="middle" class="node-bold">SE REFRATÁRIO OU RESPOSTA PARCIAL</text>
    <text x="770" y="425" text-anchor="middle" class="node-text">• Repetir Adrenalina IM a cada 5 a 15 minutos (até 3 doses)</text>
    <text x="770" y="443" text-anchor="middle" class="node-text">• Se choque anafilático refratário a 2 doses IM + volume:</text>
    <text x="770" y="461" text-anchor="middle" class="node-text">  Infusão contínua de Adrenalina IV (0,1 a 1 mcg/kg/min)</text>
    <text x="770" y="479" text-anchor="middle" class="node-text">• Inalação com Salbutamol se broncoespasmo associado</text>
    <text x="770" y="497" text-anchor="middle" class="node-text">• Glucagon IV se paciente em uso de betabloqueadores</text>
  </g>

  <path d="M 500 510 L 500 560" class="edge" />

  <g class="card-shadow">
    <rect x="180" y="560" width="640" height="110" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <text x="500" y="583" text-anchor="middle" class="node-bold">MEDICAMENTOS DE SEGUNDA LINHA &amp; OBSERVAÇÃO CLÍNICA</text>
    <text x="500" y="605" text-anchor="middle" class="node-text">• Anti-histamínicos (Difenidramina 1 mg/kg ou Ranitidina): ação apenas no prurido e urticária cutânea (NÃO salvam vidas)</text>
    <text x="500" y="623" text-anchor="middle" class="node-text">• Corticoides (Metilprednisolona 1-2 mg/kg IV): início de ação tardio (4-6h); visam mitigar reação anafilática bifásica</text>
    <text x="500" y="641" text-anchor="middle" class="node-text">• Observação hospitalar mínima obrigatória: 6 a 8 horas (leves) e 12 a 24 horas se anafilaxia grave</text>
    <text x="500" y="659" text-anchor="middle" class="node-text">• Prescrição na alta: Autoinjetor de adrenalina (EpiPen Jr 0,15 mg ou Adulto 0,3 mg) + plano de emergência escrito</text>
  </g>


  <!-- Footer Notice -->
  <rect x="30" y="700" width="940" height="35" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="722" text-anchor="middle" class="subtitle" style="font-size: 11px;">Diretriz Oficial: Tratado de Pediatria — Sociedade Brasileira de Pediatria (SBP), 6ª Edição (2024), Volumes 1 e 2.</text>
</svg>