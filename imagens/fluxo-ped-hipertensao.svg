<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gradHAS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadowHAS" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="920" height="620" fill="#f8fafc" rx="8" />

  <!-- Cabeçalho -->
  <rect x="20" y="16" width="880" height="54" rx="6" fill="url(#gradHAS)" filter="url(#shadowHAS)" />
  <text x="40" y="42" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">ALGORITMO CLÍNICO: HIPERTENSÃO ARTERIAL NA INFÂNCIA &amp; ADOLESCÊNCIA</text>
  <text x="40" y="58" fill="#ffe4e6" font-size="11" font-family="system-ui, -apple-system, sans-serif">Diretrizes Oficiais SBP 2024 • Tabelas de Percentis por Estatura, Investigação Secundária &amp; Crises</text>

  <!-- Estratificação da PA -->
  <rect x="40" y="85" width="410" height="235" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="2" filter="url(#shadowHAS)" />
  <rect x="40" y="85" width="410" height="26" fill="#e11d48" rx="6" />
  <text x="245" y="103" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. CLASSIFICAÇÃO DA PRESSÃO ARTERIAL (SBP 2024)</text>
  <text x="55" y="127" fill="#be123c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Crianças de 1 a 13 anos (Percentis por Idade, Sexo e Altura):</text>
  <text x="55" y="145" fill="#166534" font-size="9.5" font-family="system-ui, sans-serif">• <strong>PA Normal:</strong> PAS e PAD &lt; Percentil 90.</text>
  <text x="55" y="165" fill="#d97706" font-size="9.5" font-family="system-ui, sans-serif">• <strong>PA Elevada:</strong> &gt;= P90 a &lt; P95 ou 120/80 mmHg (o que for menor).</text>
  <text x="55" y="185" fill="#e11d48" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">• HAS Estágio 1: &gt;= P95 a &lt; P95 + 12 mmHg (ou 130/80 a 139/89 mmHg).</text>
  <text x="55" y="205" fill="#9f1239" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">• HAS Estágio 2: &gt;= P95 + 12 mmHg (ou &gt;= 140/90 mmHg).</text>
  <text x="55" y="225" fill="#0f172a" font-size="9" font-family="system-ui, sans-serif">• Adolescentes &gt;= 13 anos: Seguem pontos de corte de adultos</text>
  <text x="55" y="239" fill="#0f172a" font-size="9" font-family="system-ui, sans-serif">  (Normal &lt; 120/80; Elevada 120-129/&lt;80; HAS-1 130-139/80-89; HAS-2 &gt;= 140/90).</text>

  <!-- Propedêutica Secundária -->
  <rect x="470" y="85" width="410" height="235" rx="6" fill="#ffffff" stroke="#be123c" stroke-width="2" filter="url(#shadowHAS)" />
  <rect x="470" y="85" width="410" height="26" fill="#be123c" rx="6" />
  <text x="675" y="103" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. INVESTIGAÇÃO DE ETIOLOGIAS SECUNDÁRIAS</text>
  <text x="485" y="127" fill="#b91c1c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Regra de Ouro da Hipertensão Pediátrica:</text>
  <text x="485" y="142" fill="#0f172a" font-size="9.5" font-family="system-ui, sans-serif">  Quanto mais jovem a criança e mais alta a PA, MAIOR a chance</text>
  <text x="485" y="156" fill="#0f172a" font-size="9.5" font-family="system-ui, sans-serif">  de tratar-se de hipertensão arterial de causa secundária!</text>
  <text x="485" y="174" fill="#9f1239" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">• Causas Principais:</text>
  <text x="485" y="190" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  1. <strong>Doença Renal Parenquimatosa (70-80%):</strong> GNPE, refluxo VUR, DPol.</text>
  <text x="485" y="204" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  2. <strong>Renovascular (10%):</strong> Estenose de artéria renal / displasia fibromuscular.</text>
  <text x="485" y="218" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  3. <strong>Cardiovascular:</strong> Coarctação da Aorta (pulsos e PA em MMII!).</text>
  <text x="485" y="232" fill="#334155" font-size="9" font-family="system-ui, sans-serif">  4. <strong>Endócrina:</strong> Feocromocitoma, síndrome de Cushing, hiperaldosteronismo.</text>

  <!-- Conduta e Tratamento -->
  <rect x="40" y="335" width="840" height="265" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="40" y="335" width="840" height="28" fill="#f1f5f9" rx="6" />
  <text x="55" y="354" fill="#0f172a" font-size="11.5" font-weight="bold" font-family="system-ui, sans-serif">3. PROTOCOLO TERAPÊUTICO AMBULATORIAL &amp; CRISES HIPERTENSIVAS</text>

  <rect x="55" y="375" width="375" height="110" rx="5" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="65" y="395" fill="#166534" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">Manejo Ambulatorial Escalonado:</text>
  <text x="65" y="415" fill="#1e293b" font-size="9.5" font-family="system-ui, sans-serif">• Mudança de estilo de vida por 3 a 6 meses se PA elevada ou HAS-1 sem LOA.</text>
  <text x="65" y="430" fill="#1e293b" font-size="9" font-family="system-ui, sans-serif">• Início farmacológico: HAS-1 sintomática, falha MEV, LOA ou HAS-2.</text>
  <text x="65" y="445" fill="#047857" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">• Fármacos: Enalapril (0,08 mg/kg/dia), Losartana (0,7 mg/kg/dia) ou Anlodipino.</text>

  <rect x="450" y="375" width="415" height="110" rx="5" fill="#fef2f2" stroke="#fecaca" />
  <text x="460" y="395" fill="#b91c1c" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif">Crise Hipertensiva Pediátrica:</text>
  <text x="460" y="415" fill="#1e293b" font-size="9" font-family="system-ui, sans-serif">• <strong>Urgência:</strong> PA grave sem lesão aguda de órgão-alvo. Medicação oral em observação.</text>
  <text x="460" y="430" fill="#b91c1c" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif">• Emergência: PA grave COM encefalopatia, edema pulmonar ou IRA.</text>
  <text x="460" y="445" fill="#1e293b" font-size="9" font-family="system-ui, sans-serif">  UTI imediata, Nitroprussiato de Sódio IV em bomba contínua.</text>
  <text x="460" y="460" fill="#b91c1c" font-size="8.5" font-weight="bold" font-family="system-ui, sans-serif">  * Reduzir PA em no máximo 25% no 1º dia para evitar isquemia cerebral!</text>

  <rect x="55" y="500" width="810" height="85" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="65" y="518" fill="#be123c" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">RASTREAMENTO DE LESÃO DE ÓRGÃO-ALVO (MANDATÓRIO):</text>
  <text x="65" y="535" fill="#334155" font-size="9" font-family="system-ui, sans-serif">• <strong>Ecocardiograma bidimensional:</strong> Avaliação do índice de massa do ventrículo esquerdo (HVE).</text>
  <text x="65" y="550" fill="#334155" font-size="9" font-family="system-ui, sans-serif">• <strong>Exame de Fundo de Olho:</strong> Rastrear retinopatia hipertensiva (exsudatos, hemorragias e papiledema).</text>
</svg>