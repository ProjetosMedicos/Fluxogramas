d="url(#mermaid-svg_flowchart-v2-pointEnd)"/><path d="M540.97,393.03L577.142,417.941C613.314,442.853,685.657,492.677,721.828,526.338C758,560,758,577.5,758,586.25L758,595" id="mermaid-svg-L_B_E_0" class=" edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_B_E_0" data-points="W3sieCI6NTQwLjk3MDM5MTU5NTAzMzQsInkiOjM5My4wMjk2MDg0MDQ5NjY1NX0seyJ4Ijo3NTgsInkiOjU0Mi41fSx7IngiOjc1OCwieSI6NTk5fV0=" data-look="classic" marker-end="url(#mermaid-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_A_B_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel "></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(138, 542.5)"><g class="label" data-id="L_B_C_0" transform="translate(-100, -21)"><foreignObject width="200" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Alerta Terapêutico Fundamental</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(448, 542.5)"><g class="label" data-id="L_B_D_0" transform="translate(-100, -31.5)"><foreignObject width="200" height="63"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Endometriose Mínima a Leve em Paciente Jovem menor que 35 anos</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(758, 542.5)"><g class="label" data-id="L_B_E_0" transform="translate(-100, -31.5)"><foreignObject width="200" height="63"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel "><p>Endometriose Moderada a Severa ou Idade ≥ 35 anos ou Fator Tubário</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default  " id="mermaid-svg-flowchart-A-0" data-look="classic" transform="translate(448, 65)"><rect class="basic label-container" style="" x="-130" y="-57" width="260" height="114"/><g class="label" style="" transform="translate(-100, -42)"><rect/><foreignObject width="200" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p><b>Paciente com Endometriose e Desejo Reprodutivo / Infertilidade</b></p></span></div></foreignObject></g></g><g class="node default dec " id="mermaid-svg-flowchart-B-1" data-look="classic" transform="translate(448, 329)"><polygon points="157,0 314,-157 157,-314 0,-157" class="label-container" transform="translate(-156.5, 157)" style="fill:#fef3c7 !important;stroke:#d97706 !important;stroke-width:2px !important"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -42)"><rect/><foreignObject width="200" height="84"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><b>Avaliação Multidimensional: Idade, Reserva Ovariana e Trompas</b></p></span></div></foreignObject></g></g><g class="node default alert " id="mermaid-svg-flowchart-C-3" data-look="classic" transform="translate(138, 813.5)"><rect class="basic label-container" style="fill:#fee2e2 !important;stroke:#dc2626 !important;stroke-width:2px !important" x="-130" y="-130.5" width="260" height="261"/><g class="label" style="font-size:14px !important;color:#991b1b !important" transform="translate(-100, -115.5)"><rect/><foreignObject width="200" height="231"><div style="font-size: 14px !important; color: rgb(153, 27, 27) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#991b1b !important" class="nodeLabel "><p><b>REGRA DE OURO FEBRASGO E ESHRE:</b><br />• Tratamento clínico hormonal supressivo (AOC, Dienogeste, GnRHa) NÃO cura nem melhora a fertilidade futura<br />• <i>Conduta:</i> Suspender bloqueio hormonal em pacientes que buscam engravidar imediatamente</p></span></div></foreignObject></g></g><g class="node default act " id="mermaid-svg-flowchart-D-5" data-look="classic" transform="translate(448, 813.5)"><rect class="basic label-container" style="fill:#f0fdf4 !important;stroke:#16a34a !important;stroke-width:2px !important" x="-130" y="-130.5" width="260" height="261"/><g class="label" style="font-size:14px !important;color:#0f172a !important" transform="translate(-100, -115.5)"><rect/><foreignObject width="200" height="231"><div style="font-size: 14px !important; color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#0f172a !important" class="nodeLabel "><p><b>BAIXA COMPLEXIDADE / CONCEPÇÃO ASSISTIDA:</b><br />• Trompas pérvias na HSG e espermograma do parceiro normal<br />• Tentativa de concepção espontânea por até 6 meses ou Inseminação Intrauterina (IIU) com indução ovulatória leve por 3 a 4 ciclos</p></span></div></foreignObject></g></g><g class="node default fiv " id="mermaid-svg-flowchart-E-7" data-look="classic" transform="translate(758, 813.5)"><rect class="basic label-container" style="fill:#ede9fe !important;stroke:#7c3aed !important;stroke-width:2px !important" x="-130" y="-214.5" width="260" height="429"/><g class="label" style="font-size:14px !important;color:#4c1d95 !important" transform="translate(-100, -199.5)"><rect/><foreignObject width="200" height="399"><div style="font-size: 14px !important; color: rgb(76, 29, 149) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="font-size:14px !important;color:#4c1d95 !important" class="nodeLabel "><p><b>ALTA COMPLEXIDADE: FERTILIZAÇÃO IN VITRO (FIV):</b><br />• <b>Conduta de Escolha Imediata:</b> Supera a distorção anatômica pélvica e a toxicidade peritoneal<br />• Indicada se trompas obstruídas, endometriomas volumosos ou falha de baixa complexidade<br />• <b>Preparo Pré-FIV com GnRHa Ultralongo:</b> Goserrelina depot por 2 a 3 meses antes da transferência embrionária aumenta as taxas de gravidez clínica</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mermaid-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mermaid-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>