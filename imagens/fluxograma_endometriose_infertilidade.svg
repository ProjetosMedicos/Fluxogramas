troke:revert;stroke-width:revert;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .dec&gt;*{fill:rgb(254, 243, 199)!important;stroke:rgb(217, 119, 6)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .dec span{fill:rgb(254, 243, 199)!important;stroke:rgb(217, 119, 6)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .dec tspan{fill:rgb(15, 23, 42)!important;}#mermaid-svg .act&gt;*{fill:rgb(240, 253, 244)!important;stroke:rgb(22, 163, 74)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .act span{fill:rgb(240, 253, 244)!important;stroke:rgb(22, 163, 74)!important;stroke-width:2px!important;font-size:14px!important;color:rgb(15, 23, 42)!important;}#mermaid-svg .act tspan{fill:rgb(15, 23, 42)!important;}#mermaid-svg .fiv&gt;*{fill:rgb(237, 233, 254)!important;stroke:rgb(124